<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Pac-Man</title>
  <style>
    :root {
      --bg: #05060a;
      --panel: #0b1020;
      --maze: #1b3f9a;
      --maze-glow: #2f6bff;
      --dot: #ffd9a0;
      --text: #f4f7ff;
      --muted: #9aa6c5;
      --accent: #ffd400;
      --danger: #ff4d6d;
      --ghost-pink: #ff9ad5;
      --ghost-cyan: #64f0ff;
      --ghost-orange: #ffb347;
      --ghost-red: #ff3b3b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, #14204a 0%, transparent 55%),
        radial-gradient(circle at 20% 80%, #1a1030 0%, transparent 40%),
        var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Trebuchet MS", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 12px;
    }

    .shell {
      width: min(100vw - 24px, 520px);
      display: grid;
      gap: 12px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--accent);
      text-shadow: 0 0 18px rgba(255, 212, 0, 0.35);
      line-height: 1;
    }

    .hud {
      display: grid;
      gap: 2px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-size: 0.95rem;
    }

    .hud span {
      color: var(--muted);
      margin-right: 6px;
    }

    .stage {
      position: relative;
      border-radius: 18px;
      padding: 10px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.04), transparent 40%),
        var(--panel);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.06),
        0 20px 50px rgba(0,0,0,0.45);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 10px;
      background: #000;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 10px;
      display: grid;
      place-items: center;
      text-align: center;
      background: rgba(0, 0, 0, 0.72);
      border-radius: 10px;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease;
    }

    .overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay h2 {
      font-size: clamp(1.4rem, 4vw, 1.9rem);
      margin-bottom: 8px;
      color: var(--accent);
    }

    .overlay p {
      color: var(--muted);
      margin-bottom: 18px;
      line-height: 1.4;
    }

    .overlay button,
    .pad button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: #1a1400;
      font-weight: 800;
      font-size: 1rem;
      padding: 12px 22px;
      cursor: pointer;
    }

    .overlay button:active,
    .pad button:active {
      transform: scale(0.97);
    }

    .hint {
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
    }

    .pad {
      display: none;
      grid-template-columns: 64px 64px 64px;
      grid-template-rows: 64px 64px 64px;
      gap: 8px;
      justify-content: center;
      user-select: none;
    }

    .pad button {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: rgba(255,255,255,0.08);
      color: var(--text);
      font-size: 1.4rem;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    }

    .pad .up { grid-column: 2; grid-row: 1; }
    .pad .left { grid-column: 1; grid-row: 2; }
    .pad .down { grid-column: 2; grid-row: 2; }
    .pad .right { grid-column: 3; grid-row: 2; }

    @media (pointer: coarse) {
      .pad { display: grid; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">PAC-MAN</div>
      <div class="hud">
        <div><span>SCORE</span><strong id="score">0</strong></div>
        <div><span>LIVES</span><strong id="lives">3</strong></div>
        <div><span>LEVEL</span><strong id="level">1</strong></div>
      </div>
    </header>

    <div class="stage">
      <canvas id="game" width="448" height="496" aria-label="Pac-Man game"></canvas>
      <div class="overlay visible" id="overlay">
        <div>
          <h2 id="overlay-title">Ready!</h2>
          <p id="overlay-msg">Eat every pellet. Power pellets turn the ghosts blue — then chomp them.</p>
          <button id="start-btn" type="button">Start Game</button>
        </div>
      </div>
    </div>

    <p class="hint">Arrow keys or WASD to move · Space to pause</p>

    <div class="pad" aria-label="Touch controls">
      <button class="up" type="button" data-dir="up">▲</button>
      <button class="left" type="button" data-dir="left">◀</button>
      <button class="down" type="button" data-dir="down">▼</button>
      <button class="right" type="button" data-dir="right">▶</button>
    </div>
  </div>

  <script>
    const TILE = 16;
    const COLS = 28;
    const ROWS = 31;
    const SPEED = 1.6;
    const GHOST_SPEED = 1.45;
    const FRIGHT_SPEED = 0.95;
    const EYES_SPEED = 2.4;

    // 0 path, 1 wall, 2 pellet, 3 power, 4 gate
    const MAZE_TEMPLATE = [
      "1111111111111111111111111111",
      "1222222222222112222222222221",
      "1211112111112112111112111121",
      "1311112111112112111112111131",
      "1211112111112112111112111121",
      "1222222222222222222222222221",
      "1211112112111111112112111121",
      "1211112112111111112112111121",
      "1222222112222112222112222221",
      "1111112111110110111112111111",
      "0000012111110110111112100000",
      "0000012110000000000112100000",
      "0000012110111441110112100000",
      "1111112110100000010112111111",
      "0000002000100000010002000000",
      "1111112110100000010112111111",
      "0000012110111111110112100000",
      "0000012110000000000112100000",
      "0000012110111111110112100000",
      "1111112110111111110112111111",
      "1222222222222112222222222221",
      "1211112111112112111112111121",
      "1211112111112112111112111121",
      "1322112222222002222222112231",
      "1112112112111111112112112111",
      "1112112112111111112112112111",
      "1222222112222112222112222221",
      "1211111111112112111111111121",
      "1211111111112112111111111121",
      "1222222222222222222222222221",
      "1111111111111111111111111111",
    ];

    const DIRS = {
      up:    { x: 0, y: -1, name: "up" },
      down:  { x: 0, y: 1, name: "down" },
      left:  { x: -1, y: 0, name: "left" },
      right: { x: 1, y: 0, name: "right" },
    };
    const DIR_LIST = [DIRS.up, DIRS.left, DIRS.down, DIRS.right];
    const OPPOSITE = { up: "down", down: "up", left: "right", right: "left" };

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const livesEl = document.getElementById("lives");
    const levelEl = document.getElementById("level");
    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlay-title");
    const overlayMsg = document.getElementById("overlay-msg");
    const startBtn = document.getElementById("start-btn");

    let maze = [];
    let pelletsLeft = 0;
    let score = 0;
    let lives = 3;
    let level = 1;
    let state = "ready"; // ready | playing | paused | dead | won | lost
    let frightTimer = 0;
    let frightFlashing = false;
    let ghostEatStreak = 0;
    let animT = 0;
    let deathT = 0;
    let lastTs = 0;
    let queuedDir = null;

    const pac = {
      x: 14 * TILE,
      y: 23 * TILE,
      dir: DIRS.left,
      mouth: 0,
    };

    const ghostDefs = [
      { name: "blinky", color: "#ff3b3b", home: { x: 14, y: 11 }, scatter: { x: 25, y: 0 } },
      { name: "pinky",  color: "#ff9ad5", home: { x: 14, y: 14 }, scatter: { x: 2, y: 0 } },
      { name: "inky",   color: "#64f0ff", home: { x: 12, y: 14 }, scatter: { x: 27, y: 30 } },
      { name: "clyde",  color: "#ffb347", home: { x: 16, y: 14 }, scatter: { x: 0, y: 30 } },
    ];

    let ghosts = [];

    function cloneMaze() {
      maze = MAZE_TEMPLATE.map((row) => row.split("").map(Number));
      pelletsLeft = 0;
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          if (maze[y][x] === 2 || maze[y][x] === 3) pelletsLeft++;
        }
      }
    }

    function tileAt(tx, ty) {
      if (ty < 0 || ty >= ROWS) return 1;
      if (tx < 0) return maze[ty][COLS - 1];
      if (tx >= COLS) return maze[ty][0];
      return maze[ty][tx];
    }

    function isWalkable(tx, ty, allowGate = false) {
      const t = tileAt(tx, ty);
      if (t === 1) return false;
      if (t === 4) return allowGate;
      return true;
    }

    function centerOf(tx, ty) {
      return { x: tx * TILE + TILE / 2, y: ty * TILE + TILE / 2 };
    }

    function gridPos(entity) {
      return {
        tx: Math.floor(entity.x / TILE),
        ty: Math.floor(entity.y / TILE),
      };
    }

    function nearCenter(entity, tol = 1.2) {
      const cx = Math.floor(entity.x / TILE) * TILE + TILE / 2;
      const cy = Math.floor(entity.y / TILE) * TILE + TILE / 2;
      return Math.abs(entity.x - cx) <= tol && Math.abs(entity.y - cy) <= tol;
    }

    function snapToCenter(entity) {
      entity.x = Math.floor(entity.x / TILE) * TILE + TILE / 2;
      entity.y = Math.floor(entity.y / TILE) * TILE + TILE / 2;
    }

    function wrapTunnel(entity) {
      if (entity.x < -TILE / 2) entity.x = COLS * TILE + TILE / 2;
      if (entity.x > COLS * TILE + TILE / 2) entity.x = -TILE / 2;
    }

    function resetActors(full = false) {
      pac.x = 14 * TILE + TILE / 2;
      pac.y = 23 * TILE + TILE / 2;
      pac.dir = DIRS.left;
      pac.mouth = 0;
      queuedDir = null;
      frightTimer = 0;
      frightFlashing = false;
      ghostEatStreak = 0;

      ghosts = ghostDefs.map((g, i) => ({
        ...g,
        x: g.home.x * TILE + TILE / 2,
        y: g.home.y * TILE + TILE / 2,
        dir: i === 0 ? DIRS.left : DIRS.up,
        mode: i === 0 ? "scatter" : "house",
        released: i === 0,
        releaseAt: i * 2.2,
        frightened: false,
        eyes: false,
      }));

      if (full) {
        cloneMaze();
      }
    }

    function setHud() {
      scoreEl.textContent = String(score);
      livesEl.textContent = String(lives);
      levelEl.textContent = String(level);
    }

    function showOverlay(title, msg, btnLabel) {
      overlayTitle.textContent = title;
      overlayMsg.textContent = msg;
      startBtn.textContent = btnLabel;
      overlay.classList.add("visible");
    }

    function hideOverlay() {
      overlay.classList.remove("visible");
    }

    function startGame() {
      if (state === "lost" || state === "won" || state === "ready") {
        if (state === "lost" || state === "ready") {
          score = 0;
          lives = 3;
          level = 1;
          cloneMaze();
        }
        if (state === "won") {
          level += 1;
          cloneMaze();
        }
        resetActors(false);
        setHud();
      }
      if (state === "paused") {
        hideOverlay();
        state = "playing";
        return;
      }
      hideOverlay();
      state = "playing";
      lastTs = performance.now();
    }

    function pauseGame() {
      if (state !== "playing") return;
      state = "paused";
      showOverlay("Paused", "Take a breath. The pellets can wait.", "Resume");
    }

    function canEnter(tx, ty, entity) {
      const allowGate = entity.mode === "house" || entity.eyes || entity.leaving;
      return isWalkable(tx, ty, allowGate);
    }

    function trySetDir(entity, nextDir, allowGate = false) {
      if (!nextDir) return false;
      if (!nearCenter(entity)) return false;
      const { tx, ty } = gridPos(entity);
      const nx = tx + nextDir.x;
      const ny = ty + nextDir.y;
      if (!isWalkable(nx, ny, allowGate)) return false;
      snapToCenter(entity);
      entity.dir = nextDir;
      return true;
    }

    function moveEntity(entity, speed, allowGate = false) {
      if (queuedDir && entity === pac) {
        trySetDir(entity, queuedDir, allowGate);
      }

      const nextX = entity.x + entity.dir.x * speed;
      const nextY = entity.y + entity.dir.y * speed;
      const probeX = entity.x + entity.dir.x * (TILE / 2 + 0.5);
      const probeY = entity.y + entity.dir.y * (TILE / 2 + 0.5);
      const ptx = Math.floor(probeX / TILE);
      const pty = Math.floor(probeY / TILE);

      if (!isWalkable(ptx, pty, allowGate) && nearCenter(entity, speed + 0.5)) {
        snapToCenter(entity);
        return;
      }

      entity.x = nextX;
      entity.y = nextY;
      wrapTunnel(entity);
    }

    function dist2(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      return dx * dx + dy * dy;
    }

    function chooseGhostDir(ghost) {
      if (!nearCenter(ghost, 1.5)) return;
      snapToCenter(ghost);

      const { tx, ty } = gridPos(ghost);
      let target;

      if (ghost.eyes) {
        target = { x: 14, y: 14 };
      } else if (ghost.frightened) {
        const opts = DIR_LIST.filter((d) => {
          if (d.name === OPPOSITE[ghost.dir.name]) return false;
          return canEnter(tx + d.x, ty + d.y, ghost);
        });
        if (!opts.length) {
          ghost.dir = DIRS[OPPOSITE[ghost.dir.name]];
          return;
        }
        ghost.dir = opts[Math.floor(Math.random() * opts.length)];
        return;
      } else if (ghost.mode === "house" || ghost.leaving) {
        target = { x: 14, y: 11 };
      } else if (ghost.mode === "scatter") {
        target = ghost.scatter;
      } else {
        const pacCell = gridPos(pac);
        if (ghost.name === "blinky") {
          target = { x: pacCell.tx, y: pacCell.ty };
        } else if (ghost.name === "pinky") {
          target = {
            x: pacCell.tx + pac.dir.x * 4,
            y: pacCell.ty + pac.dir.y * 4,
          };
        } else if (ghost.name === "inky") {
          const blinky = ghosts[0];
          const blinkyCell = gridPos(blinky);
          const pivot = {
            x: pacCell.tx + pac.dir.x * 2,
            y: pacCell.ty + pac.dir.y * 2,
          };
          target = {
            x: pivot.x + (pivot.x - blinkyCell.tx),
            y: pivot.y + (pivot.y - blinkyCell.ty),
          };
        } else {
          const d = dist2(
            { x: pacCell.tx, y: pacCell.ty },
            { x: tx, y: ty }
          );
          target = d > 64
            ? { x: pacCell.tx, y: pacCell.ty }
            : ghost.scatter;
        }
      }

      let best = null;
      let bestScore = Infinity;
      for (const d of DIR_LIST) {
        if (d.name === OPPOSITE[ghost.dir.name] && ghost.mode !== "house") continue;
        const nx = tx + d.x;
        const ny = ty + d.y;
        if (!canEnter(nx, ny, ghost)) continue;
        const scoreN = (nx - target.x) ** 2 + (ny - target.y) ** 2;
        if (scoreN < bestScore) {
          bestScore = scoreN;
          best = d;
        }
      }
      if (best) ghost.dir = best;
    }

    function releaseGhosts(dt) {
      for (const g of ghosts) {
        if (g.released || g.eyes) continue;
        g.releaseAt -= dt;
        if (g.releaseAt <= 0) {
          g.released = true;
          g.leaving = true;
          g.mode = "chase";
        }
      }
    }

    function updateGhostModes(elapsed) {
      // Simple scatter/chase cadence
      const cycle = elapsed % 27;
      const scatter = cycle < 7;
      for (const g of ghosts) {
        if (!g.released || g.eyes || g.frightened || g.leaving) continue;
        const next = scatter ? "scatter" : "chase";
        if (g.mode !== next) {
          g.dir = DIRS[OPPOSITE[g.dir.name]] || g.dir;
          g.mode = next;
        }
      }
    }

    function eatPellet() {
      const { tx, ty } = gridPos(pac);
      const tile = tileAt(tx, ty);
      if (tile !== 2 && tile !== 3) return;
      maze[ty][tx] = 0;
      pelletsLeft--;
      if (tile === 2) {
        score += 10;
      } else {
        score += 50;
        frightTimer = 6;
        frightFlashing = false;
        ghostEatStreak = 0;
        for (const g of ghosts) {
          if (!g.eyes && g.released) {
            g.frightened = true;
            g.dir = DIRS[OPPOSITE[g.dir.name]] || g.dir;
          }
        }
      }
      setHud();
      if (pelletsLeft <= 0) {
        state = "won";
        showOverlay("Level Clear!", `Score ${score}. Ready for level ${level + 1}?`, "Next Level");
      }
    }

    function collideActors() {
      for (const g of ghosts) {
        const dx = g.x - pac.x;
        const dy = g.y - pac.y;
        if (dx * dx + dy * dy > (TILE * 0.7) ** 2) continue;

        if (g.eyes) continue;

        if (g.frightened) {
          g.frightened = false;
          g.eyes = true;
          g.mode = "eyes";
          ghostEatStreak += 1;
          score += 200 * ghostEatStreak;
          setHud();
          continue;
        }

        lives -= 1;
        setHud();
        if (lives <= 0) {
          state = "lost";
          showOverlay("Game Over", `Final score ${score}. The maze wins this round.`, "Play Again");
        } else {
          state = "dead";
          deathT = 0;
        }
        return;
      }
    }

    let playElapsed = 0;

    function update(dt) {
      animT += dt;
      playElapsed += dt;

      if (state === "dead") {
        deathT += dt;
        if (deathT > 1.2) {
          resetActors(false);
          state = "playing";
        }
        return;
      }

      if (state !== "playing") return;

      if (frightTimer > 0) {
        frightTimer -= dt;
        frightFlashing = frightTimer < 2;
        if (frightTimer <= 0) {
          frightTimer = 0;
          frightFlashing = false;
          for (const g of ghosts) g.frightened = false;
        }
      }

      releaseGhosts(dt);
      updateGhostModes(playElapsed);

      moveEntity(pac, SPEED * (1 + (level - 1) * 0.04), false);
      pac.mouth += dt * 10;
      eatPellet();

      for (const g of ghosts) {
        if (g.leaving) {
          const homeExit = centerOf(14, 11);
          if (Math.abs(g.x - homeExit.x) < 2 && Math.abs(g.y - homeExit.y) < 2) {
            g.x = homeExit.x;
            g.y = homeExit.y;
            g.leaving = false;
            g.mode = "chase";
            g.dir = DIRS.left;
          }
        }

        if (g.eyes) {
          const door = centerOf(14, 14);
          if (Math.abs(g.x - door.x) < 3 && Math.abs(g.y - door.y) < 3) {
            g.eyes = false;
            g.frightened = false;
            g.mode = "house";
            g.leaving = true;
            g.x = door.x;
            g.y = door.y;
          }
        }

        chooseGhostDir(g);
        let spd = GHOST_SPEED * (1 + (level - 1) * 0.03);
        if (g.frightened) spd = FRIGHT_SPEED;
        if (g.eyes) spd = EYES_SPEED;
        if (g.mode === "house" && !g.leaving) spd = 0.8;
        moveEntity(g, spd, true);
      }

      collideActors();
    }

    function drawMaze() {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const t = maze[y][x];
          const px = x * TILE;
          const py = y * TILE;

          if (t === 1) {
            ctx.fillStyle = "#0a1a4a";
            ctx.fillRect(px, py, TILE, TILE);
            ctx.strokeStyle = "#2f6bff";
            ctx.lineWidth = 1.5;
            ctx.strokeRect(px + 1.5, py + 1.5, TILE - 3, TILE - 3);
          } else if (t === 4) {
            ctx.fillStyle = "#ff9ad5";
            ctx.fillRect(px + 1, py + TILE / 2 - 1, TILE - 2, 2);
          } else if (t === 2) {
            ctx.fillStyle = "#ffd9a0";
            ctx.beginPath();
            ctx.arc(px + TILE / 2, py + TILE / 2, 2, 0, Math.PI * 2);
            ctx.fill();
          } else if (t === 3) {
            const pulse = 4.5 + Math.sin(animT * 6) * 1.2;
            ctx.fillStyle = "#fff4c2";
            ctx.beginPath();
            ctx.arc(px + TILE / 2, py + TILE / 2, pulse, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }
    }

    function drawPac() {
      if (state === "dead") {
        const open = Math.min(Math.PI, deathT * 2.8);
        ctx.fillStyle = "#ffd400";
        ctx.beginPath();
        ctx.moveTo(pac.x, pac.y);
        ctx.arc(pac.x, pac.y, TILE * 0.55, -Math.PI / 2 + open, -Math.PI / 2 + Math.PI * 2 - open);
        ctx.closePath();
        ctx.fill();
        return;
      }

      const chomp = (Math.sin(pac.mouth) + 1) * 0.35;
      const base = {
        right: 0,
        down: Math.PI / 2,
        left: Math.PI,
        up: -Math.PI / 2,
      }[pac.dir.name];

      ctx.fillStyle = "#ffd400";
      ctx.beginPath();
      ctx.moveTo(pac.x, pac.y);
      ctx.arc(
        pac.x,
        pac.y,
        TILE * 0.55,
        base + chomp,
        base + Math.PI * 2 - chomp
      );
      ctx.closePath();
      ctx.fill();
    }

    function drawGhost(g) {
      const r = TILE * 0.55;
      let body = g.color;
      if (g.eyes) body = "transparent";
      else if (g.frightened) {
        body = frightFlashing && Math.floor(animT * 8) % 2 === 0 ? "#fff" : "#2236ff";
      }

      if (!g.eyes) {
        ctx.fillStyle = body;
        ctx.beginPath();
        ctx.arc(g.x, g.y - 2, r, Math.PI, 0);
        ctx.lineTo(g.x + r, g.y + r * 0.7);
        const waves = 4;
        const step = (r * 2) / waves;
        for (let i = 0; i < waves; i++) {
          const wx = g.x + r - i * step;
          const wy = g.y + r * 0.7 + ((i % 2 === 0) ? 3 : -2);
          ctx.lineTo(wx - step / 2, wy);
        }
        ctx.lineTo(g.x - r, g.y + r * 0.7);
        ctx.closePath();
        ctx.fill();
      }

      // Eyes
      const eyeOffset = {
        left: [-2, 0],
        right: [2, 0],
        up: [0, -2],
        down: [0, 2],
      }[g.dir.name];

      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(g.x - 4, g.y - 3, 3.2, 0, Math.PI * 2);
      ctx.arc(g.x + 4, g.y - 3, 3.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = g.frightened && !g.eyes ? "#fff" : "#2030aa";
      if (!(g.frightened && !g.eyes && frightFlashing && Math.floor(animT * 8) % 2 === 0)) {
        ctx.beginPath();
        ctx.arc(g.x - 4 + eyeOffset[0], g.y - 3 + eyeOffset[1], 1.5, 0, Math.PI * 2);
        ctx.arc(g.x + 4 + eyeOffset[0], g.y - 3 + eyeOffset[1], 1.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function draw() {
      drawMaze();
      if (state !== "dead") {
        for (const g of ghosts) drawGhost(g);
      }
      drawPac();
    }

    function loop(ts) {
      const dt = Math.min(0.033, (ts - lastTs) / 1000 || 0);
      lastTs = ts;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    function setDirection(name) {
      const dir = DIRS[name];
      if (!dir) return;
      queuedDir = dir;
      if (state === "playing") trySetDir(pac, dir, false);
    }

    const keyMap = {
      ArrowUp: "up",
      ArrowDown: "down",
      ArrowLeft: "left",
      ArrowRight: "right",
      w: "up",
      W: "up",
      s: "down",
      S: "down",
      a: "left",
      A: "left",
      d: "right",
      D: "right",
    };

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space" || e.code === "Enter") {
        e.preventDefault();
        if (state === "playing") pauseGame();
        else startGame();
        return;
      }
      const dir = keyMap[e.key];
      if (!dir) return;
      e.preventDefault();
      if (state === "ready" || state === "paused" || state === "lost" || state === "won") {
        startGame();
      }
      setDirection(dir);
    });

    startBtn.addEventListener("click", () => startGame());

    document.querySelectorAll(".pad button").forEach((btn) => {
      const press = (e) => {
        e.preventDefault();
        if (state !== "playing") startGame();
        setDirection(btn.dataset.dir);
      };
      btn.addEventListener("pointerdown", press);
    });

    // Boot
    cloneMaze();
    resetActors(false);
    setHud();
    showOverlay("Ready!", "Eat every pellet. Power pellets turn the ghosts blue — then chomp them.", "Start Game");
    lastTs = performance.now();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
