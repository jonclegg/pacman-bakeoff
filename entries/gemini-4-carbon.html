<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PAC-MAN</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 50% 42%, #101226 0%, #05050c 72%, #020205 100%);
    color: #dedeff;
    font-family: ui-monospace, "SF Mono", Menlo, Monaco, "Cascadia Mono", Consolas, monospace;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .cabinet {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    max-height: 100vh;
    max-width: 100vw;
    padding: 8px 12px;
    gap: 8px;
  }

  .bezel {
    position: relative;
    background: #000;
    border-radius: 14px;
    padding: 10px;
    border: 2px solid #22264a;
    box-shadow:
      0 0 0 1px #0b0d1f,
      0 18px 50px rgba(0, 0, 0, 0.85),
      0 0 36px rgba(33, 33, 255, 0.18),
      inset 0 0 18px rgba(33, 33, 255, 0.14);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #screen {
    display: block;
    background: #000000;
    /* Logical 224x288 (7:9 aspect ratio), scaled cleanly to fit viewport */
    height: min(calc(100vh - 68px), calc((100vw - 40px) * 288 / 224));
    width: calc(min(calc(100vh - 68px), calc((100vw - 40px) * 288 / 224)) * 224 / 288);
    max-height: 864px;
    max-width: 672px;
    border-radius: 6px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: pointer;
  }

  .crt-overlay {
    pointer-events: none;
    position: absolute;
    inset: 10px;
    border-radius: 6px;
    opacity: 0;
    transition: opacity 0.2s ease;
    background:
      linear-gradient(
        rgba(18, 16, 16, 0) 50%,
        rgba(0, 0, 0, 0.28) 50%
      ),
      radial-gradient(
        circle at center,
        transparent 62%,
        rgba(0, 0, 0, 0.36) 100%
      );
    background-size: 100% 3px, 100% 100%;
    box-shadow: inset 0 0 22px rgba(60, 90, 255, 0.12);
  }

  .bezel.crt-on .crt-overlay {
    opacity: 1;
  }

  .hud-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    max-width: 692px;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: #9aa2cc;
    flex-wrap: wrap;
  }

  .controls-hint {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .key-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  kbd {
    background: #151833;
    border: 1px solid #30376b;
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 5px;
    color: #eef0ff;
    font-size: 10px;
    font-family: inherit;
  }

  .btn-group {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: auto;
  }

  .cab-btn {
    background: #141730;
    color: #d6dcff;
    border: 1px solid #2e366b;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 4px 9px;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: background 0.12s ease, color 0.12s ease, transform 0.06s ease;
  }

  .cab-btn:hover {
    background: #1e2450;
    color: #ffffff;
  }

  .cab-btn:active {
    transform: translateY(1px);
  }

  .cab-btn.active {
    border-color: #ffb852;
    color: #ffff00;
  }

  @media (max-height: 560px), (max-width: 520px) {
    .controls-hint {
      display: none;
    }
    .hud-bar {
      justify-content: center;
    }
    .btn-group {
      margin-left: 0;
    }
    #screen {
      height: min(calc(100vh - 50px), calc((100vw - 20px) * 288 / 224));
      width: calc(min(calc(100vh - 50px), calc((100vw - 20px) * 288 / 224)) * 224 / 288);
    }
  }
</style>
</head>
<body>
  <div class="cabinet">
    <div class="bezel crt-on" id="bezel">
      <canvas id="screen" width="672" height="864" aria-label="Pac-Man Arcade Game"></canvas>
      <div class="crt-overlay"></div>
    </div>
    <div class="hud-bar">
      <div class="controls-hint">
        <span class="key-pill"><kbd>Arrows</kbd>/<kbd>WASD</kbd> Move</span>
        <span class="key-pill"><kbd>P</kbd>/<kbd>Esc</kbd> Pause</span>
        <span class="key-pill"><kbd>M</kbd> Sound</span>
        <span class="key-pill"><kbd>R</kbd> Restart</span>
      </div>
      <div class="btn-group">
        <button type="button" class="cab-btn" id="btnPause" title="Pause / Resume (P or Esc)">PAUSE</button>
        <button type="button" class="cab-btn active" id="btnSound" title="Toggle Sound (M)">SOUND: ON</button>
        <button type="button" class="cab-btn active" id="btnCrt" title="Toggle CRT Scanlines (C)">CRT: ON</button>
        <button type="button" class="cab-btn" id="btnRestart" title="Restart Game (R)">RESTART</button>
      </div>
    </div>
  </div>

<script>
(() => {
  "use strict";

  // =========================================================================
  // 1. CONSTANTS & ARCADE SPECIFICATIONS
  // =========================================================================
  const LOGICAL_W = 224;   // 28 tiles * 8 px
  const LOGICAL_H = 288;   // 36 tiles * 8 px
  const SCALE = 3;         // 672 x 864 crisp internal framebuffer
  const TILE = 8;
  const COLS = 28;
  const MAZE_ROWS = 31;
  const MAZE_Y_OFFSET = 3; // Maze occupies screen rows 3..33 (top HUD 0..2, bottom HUD 34..35)

  // Directions ordered in exact 1980 Namco tie-break priority: UP > LEFT > DOWN > RIGHT
  const DIR_UP = 0;
  const DIR_LEFT = 1;
  const DIR_DOWN = 2;
  const DIR_RIGHT = 3;
  const DIR_NONE = -1;

  const DIRS = [
    { dx: 0,  dy: -1, opp: DIR_DOWN,  name: "UP" },
    { dx: -1, dy: 0,  opp: DIR_RIGHT, name: "LEFT" },
    { dx: 0,  dy: 1,  opp: DIR_UP,    name: "DOWN" },
    { dx: 1,  dy: 0,  opp: DIR_LEFT,  name: "RIGHT" }
  ];

  // Authentic Arcade Colors
  const PALETTE = {
    black:   "#000000",
    wall:    "#2121ff",
    wallDim: "#1919a6",
    door:    "#ffb8ff",
    pellet:  "#ffb8ae",
    white:   "#dedeff",
    yellow:  "#ffff00",
    red:     "#ff0000",
    pink:    "#ffb8ff",
    cyan:    "#00ffff",
    orange:  "#ffb852",
    fright:  "#2121ff",
    frightFace: "#ffb8ae",
    green:   "#00ff00",
    stem:    "#de9751"
  };

  // Exact 28x31 Namco Arcade Maze (240 small dots '.' + 4 power pellets 'o' = 244 total)
  // 'X' = exterior void, 'H' = ghost house wall, '-' = ghost house pink gate, 'G' = ghost house interior
  const RAW_MAZE = [
    "############################", // 0
    "#............##............#", // 1
    "#.####.#####.##.#####.####.#", // 2
    "#o####.#####.##.#####.####o#", // 3
    "#.####.#####.##.#####.####.#", // 4
    "#..........................#", // 5
    "#.####.##.########.##.####.#", // 6
    "#.####.##.########.##.####.#", // 7
    "#......##....##....##......#", // 8
    "######.##### ## #####.######", // 9
    "XXXXX#.##### ## #####.#XXXXX", // 10
    "XXXXX#.##          ##.#XXXXX", // 11
    "XXXXX#.## HHH--HHH ##.#XXXXX", // 12
    "######.## HGGGGGGH ##.######", // 13
    "      .   HGGGGGGH   .      ", // 14 (Side Tunnel)
    "######.## HGGGGGGH ##.######", // 15
    "XXXXX#.## HHHHHHHH ##.#XXXXX", // 16
    "XXXXX#.##          ##.#XXXXX", // 17 (Bonus Fruit spawns at x=14.0, y=17.5)
    "XXXXX#.## ######## ##.#XXXXX", // 18
    "######.## ######## ##.######", // 19
    "#............##............#", // 20
    "#.####.#####.##.#####.####.#", // 21
    "#.####.#####.##.#####.####.#", // 22
    "#o..##.......  .......##..o#", // 23 (Pac-Man spawns at x=14.0, y=23.5)
    "###.##.##.########.##.##.###", // 24
    "###.##.##.########.##.##.###", // 25
    "#......##....##....##......#", // 26
    "#.##########.##.##########.#", // 27
    "#.##########.##.##########.#", // 28
    "#..........................#", // 29
    "############################"  // 30
  ];

  // Base 100% arcade speed = 75.7575 px/s = 9.4697 tiles/s
  const BASE_SPEED = 9.47;

  // Bonus Fruit Table per Level
  const FRUITS = [
    { id: "cherry",     pts: 100 },  // Lv 1
    { id: "strawberry", pts: 300 },  // Lv 2
    { id: "peach",      pts: 500 },  // Lv 3
    { id: "peach",      pts: 500 },  // Lv 4
    { id: "apple",      pts: 700 },  // Lv 5
    { id: "apple",      pts: 700 },  // Lv 6
    { id: "melon",      pts: 1000 }, // Lv 7
    { id: "melon",      pts: 1000 }, // Lv 8
    { id: "galaxian",   pts: 2000 }, // Lv 9
    { id: "galaxian",   pts: 2000 }, // Lv 10
    { id: "bell",       pts: 3000 }, // Lv 11
    { id: "bell",       pts: 3000 }, // Lv 12
    { id: "key",        pts: 5000 }  // Lv 13+
  ];

  function getFruitSpec(level) {
    return FRUITS[Math.min(level - 1, FRUITS.length - 1)];
  }

  // Per-level speed & fright duration specifications (faithful to arcade tables)
  function getLevelSpec(level) {
    let pacNorm, pacFright, ghostNorm, ghostFright, ghostTunnel, elroy1Dots, elroy1Spd, elroy2Dots, elroy2Spd;
    if (level === 1) {
      pacNorm = 0.80; pacFright = 0.90;
      ghostNorm = 0.75; ghostFright = 0.50; ghostTunnel = 0.40;
      elroy1Dots = 20; elroy1Spd = 0.80; elroy2Dots = 10; elroy2Spd = 0.85;
    } else if (level <= 4) {
      pacNorm = 0.90; pacFright = 0.95;
      ghostNorm = 0.85; ghostFright = 0.55; ghostTunnel = 0.45;
      elroy1Dots = level === 2 ? 30 : 40; elroy1Spd = 0.90;
      elroy2Dots = level === 2 ? 15 : 20; elroy2Spd = 0.95;
    } else if (level <= 20) {
      pacNorm = 1.00; pacFright = 1.00;
      ghostNorm = 0.95; ghostFright = 0.60; ghostTunnel = 0.50;
      elroy1Dots = level <= 8 ? 50 : (level <= 11 ? 60 : (level <= 14 ? 80 : 100));
      elroy1Spd = 1.00;
      elroy2Dots = Math.floor(elroy1Dots / 2);
      elroy2Spd = 1.05;
    } else {
      pacNorm = 0.90; pacFright = 1.00;
      ghostNorm = 0.95; ghostFright = 0.60; ghostTunnel = 0.50;
      elroy1Dots = 120; elroy1Spd = 1.00; elroy2Dots = 60; elroy2Spd = 1.05;
    }

    // Frightened durations in seconds (0 on Lv 17 and Lv 19+, where ghosts reverse without turning blue)
    const frightTable = [6, 5, 4, 3, 2, 5, 2, 2, 1, 5, 2, 1, 1, 3, 1, 1, 0, 1];
    const frightSec = level <= frightTable.length ? frightTable[level - 1] : 0;
    const flashes = frightSec >= 2 ? 5 : (frightSec === 1 ? 3 : 0);

    // Scatter / Chase wave durations (seconds)
    let waves;
    if (level === 1) {
      waves = [
        { mode: "SCATTER", dur: 7 }, { mode: "CHASE", dur: 20 },
        { mode: "SCATTER", dur: 7 }, { mode: "CHASE", dur: 20 },
        { mode: "SCATTER", dur: 5 }, { mode: "CHASE", dur: 20 },
        { mode: "SCATTER", dur: 5 }, { mode: "CHASE", dur: Infinity }
      ];
    } else if (level <= 4) {
      waves = [
        { mode: "SCATTER", dur: 7 }, { mode: "CHASE", dur: 20 },
        { mode: "SCATTER", dur: 7 }, { mode: "CHASE", dur: 20 },
        { mode: "SCATTER", dur: 5 }, { mode: "CHASE", dur: 1033 },
        { mode: "SCATTER", dur: 1 / 60 }, { mode: "CHASE", dur: Infinity }
      ];
    } else {
      waves = [
        { mode: "SCATTER", dur: 5 }, { mode: "CHASE", dur: 20 },
        { mode: "SCATTER", dur: 5 }, { mode: "CHASE", dur: 20 },
        { mode: "SCATTER", dur: 5 }, { mode: "CHASE", dur: 1037 },
        { mode: "SCATTER", dur: 1 / 60 }, { mode: "CHASE", dur: Infinity }
      ];
    }

    return {
      pacNorm, pacFright, ghostNorm, ghostFright, ghostTunnel,
      elroy1Dots, elroy1Spd, elroy2Dots, elroy2Spd,
      frightSec, flashes, waves,
      starveLimit: level < 5 ? 4.0 : 3.0
    };
  }

  // =========================================================================
  // 2. SAFE STORAGE
  // =========================================================================
  function loadStored(key, fallback) {
    try {
      const v = window.localStorage.getItem(key);
      return v !== null ? v : fallback;
    } catch (_) {
      return fallback;
    }
  }

  function saveStored(key, val) {
    try {
      window.localStorage.setItem(key, String(val));
    } catch (_) {
      // Ignore file:// storage restrictions in strict browser modes
    }
  }

  // =========================================================================
  // 3. CUSTOM 8x8 ARCADE BITMAP FONT & PIXEL SPRITE ENGINE
  // =========================================================================
  // Crisp 8x8 arcade glyphs (each row is 8 bits, MSB left, bottom row usually 0 for baseline spacing)
  const FONT_8X8 = {
    " ": [0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00],
    "0": [0x3c,0x66,0x6e,0x76,0x66,0x66,0x3c,0x00],
    "1": [0x18,0x38,0x18,0x18,0x18,0x18,0x7e,0x00],
    "2": [0x3c,0x66,0x06,0x1c,0x30,0x66,0x7e,0x00],
    "3": [0x3c,0x66,0x06,0x1c,0x06,0x66,0x3c,0x00],
    "4": [0x0c,0x1c,0x3c,0x6c,0x7e,0x0c,0x0c,0x00],
    "5": [0x7e,0x60,0x7c,0x06,0x06,0x66,0x3c,0x00],
    "6": [0x1c,0x30,0x60,0x7c,0x66,0x66,0x3c,0x00],
    "7": [0x7e,0x66,0x06,0x0c,0x18,0x18,0x18,0x00],
    "8": [0x3c,0x66,0x66,0x3c,0x66,0x66,0x3c,0x00],
    "9": [0x3c,0x66,0x66,0x3e,0x06,0x0c,0x38,0x00],
    "A": [0x3c,0x66,0x66,0x7e,0x66,0x66,0x66,0x00],
    "B": [0x7c,0x66,0x66,0x7c,0x66,0x66,0x7c,0x00],
    "C": [0x3c,0x66,0x60,0x60,0x60,0x66,0x3c,0x00],
    "D": [0x78,0x6c,0x66,0x66,0x66,0x6c,0x78,0x00],
    "E": [0x7e,0x60,0x60,0x78,0x60,0x60,0x7e,0x00],
    "F": [0x7e,0x60,0x60,0x78,0x60,0x60,0x60,0x00],
    "G": [0x3c,0x66,0x60,0x6e,0x66,0x66,0x3e,0x00],
    "H": [0x66,0x66,0x66,0x7e,0x66,0x66,0x66,0x00],
    "I": [0x3c,0x18,0x18,0x18,0x18,0x18,0x3c,0x00],
    "J": [0x1e,0x0c,0x0c,0x0c,0x6c,0x6c,0x38,0x00],
    "K": [0x66,0x6c,0x78,0x70,0x78,0x6c,0x66,0x00],
    "L": [0x60,0x60,0x60,0x60,0x60,0x60,0x7e,0x00],
    "M": [0x63,0x77,0x7f,0x6b,0x63,0x63,0x63,0x00],
    "N": [0x66,0x76,0x7e,0x7e,0x6e,0x66,0x66,0x00],
    "O": [0x3c,0x66,0x66,0x66,0x66,0x66,0x3c,0x00],
    "P": [0x7c,0x66,0x66,0x7c,0x60,0x60,0x60,0x00],
    "Q": [0x3c,0x66,0x66,0x66,0x6a,0x6c,0x36,0x00],
    "R": [0x7c,0x66,0x66,0x7c,0x6c,0x66,0x66,0x00],
    "S": [0x3c,0x66,0x60,0x3c,0x06,0x66,0x3c,0x00],
    "T": [0x7e,0x18,0x18,0x18,0x18,0x18,0x18,0x00],
    "U": [0x66,0x66,0x66,0x66,0x66,0x66,0x3c,0x00],
    "V": [0x66,0x66,0x66,0x66,0x66,0x3c,0x18,0x00],
    "W": [0x63,0x63,0x63,0x6b,0x7f,0x77,0x63,0x00],
    "X": [0x66,0x66,0x3c,0x18,0x3c,0x66,0x66,0x00],
    "Y": [0x66,0x66,0x66,0x3c,0x18,0x18,0x18,0x00],
    "Z": [0x7e,0x06,0x0c,0x18,0x30,0x60,0x7e,0x00],
    "!": [0x18,0x3c,0x3c,0x18,0x18,0x00,0x18,0x00],
    "-": [0x00,0x00,0x00,0x7e,0x00,0x00,0x00,0x00],
    "/": [0x06,0x0c,0x18,0x30,0x60,0x40,0x00,0x00],
    "\"": [0x66,0x66,0x24,0x00,0x00,0x00,0x00,0x00],
    ".": [0x00,0x00,0x00,0x00,0x00,0x18,0x18,0x00],
    ":": [0x00,0x18,0x18,0x00,0x18,0x18,0x00,0x00],
    "*": [0x3c,0x42,0x99,0xa1,0xa1,0x99,0x42,0x3c] // Copyright (c) symbol
  };

  function makeCanvas(w, h) {
    const c = document.createElement("canvas");
    c.width = w;
    c.height = h;
    return c;
  }

  // Cache colored glyph canvases at logical resolution (drawn onto logical 224x288 buffer)
  const glyphCache = new Map();
  function getGlyph(ch, color) {
    const key = ch + "|" + color;
    let g = glyphCache.get(key);
    if (g) return g;
    const rows = FONT_8X8[ch] || FONT_8X8[" "];
    g = makeCanvas(8, 8);
    const gctx = g.getContext("2d");
    gctx.fillStyle = color;
    for (let y = 0; y < 8; y++) {
      const bits = rows[y];
      for (let x = 0; x < 8; x++) {
        if ((bits >> (7 - x)) & 1) {
          gctx.fillRect(x, y, 1, 1);
        }
      }
    }
    glyphCache.set(key, g);
    return g;
  }

  function drawText(lctx, text, tileCol, tileRow, color = PALETTE.white) {
    const s = String(text).toUpperCase();
    for (let i = 0; i < s.length; i++) {
      const ch = s[i];
      if (ch !== " ") {
        lctx.drawImage(getGlyph(ch, color), (tileCol + i) * 8, tileRow * 8);
      }
    }
  }

  function drawTextPx(lctx, text, px, py, color = PALETTE.white) {
    const s = String(text).toUpperCase();
    for (let i = 0; i < s.length; i++) {
      const ch = s[i];
      if (ch !== " ") {
        lctx.drawImage(getGlyph(ch, color), Math.round(px + i * 8), Math.round(py));
      }
    }
  }

  // Build pixel sprite from ASCII art strings + palette map
  function buildPixelSprite(rows, colorMap) {
    const h = rows.length;
    const w = rows[0].length;
    const c = makeCanvas(w, h);
    const cx = c.getContext("2d");
    for (let y = 0; y < h; y++) {
      const row = rows[y];
      for (let x = 0; x < w; x++) {
        const col = colorMap[row[x]];
        if (col) {
          cx.fillStyle = col;
          cx.fillRect(x, y, 1, 1);
        }
      }
    }
    return c;
  }

  // =========================================================================
  // 4. PRE-RENDERED MAZE WALL BITMAPS (BLUE & FLASHING WHITE)
  // =========================================================================
  function isWalkableCell(tx, ty) {
    if (ty < 0 || ty >= MAZE_ROWS) return false;
    if (tx < 0 || tx >= COLS) return ty === 14; // Side tunnel row
    const c = RAW_MAZE[ty][tx];
    return c === "." || c === "o" || c === " ";
  }

  function buildMazeBitmap(wallColor, showDoor) {
    const mw = COLS * TILE;      // 224
    const mh = MAZE_ROWS * TILE; // 248
    const c = makeCanvas(mw, mh);
    const cx = c.getContext("2d");

    const setPx = (x, y, col = wallColor) => {
      if (x >= 0 && x < mw && y >= 0 && y < mh) {
        cx.fillStyle = col;
        cx.fillRect(x, y, 1, 1);
      }
    };
    const hLine = (x0, x1, y, col = wallColor) => {
      cx.fillStyle = col;
      cx.fillRect(Math.min(x0, x1), y, Math.abs(x1 - x0) + 1, 1);
    };
    const vLine = (x, y0, y1, col = wallColor) => {
      cx.fillStyle = col;
      cx.fillRect(x, Math.min(y0, y1), 1, Math.abs(y1 - y0) + 1);
    };

    // 1. Inner maze wall contour (exact 8x8 tile curves & lines)
    for (let ty = 0; ty < MAZE_ROWS; ty++) {
      for (let tx = 0; tx < COLS; tx++) {
        if (RAW_MAZE[ty][tx] !== "#") continue;
        const n  = isWalkableCell(tx, ty - 1);
        const s  = isWalkableCell(tx, ty + 1);
        const w  = isWalkableCell(tx - 1, ty);
        const e  = isWalkableCell(tx + 1, ty);
        const nw = isWalkableCell(tx - 1, ty - 1);
        const ne = isWalkableCell(tx + 1, ty - 1);
        const sw = isWalkableCell(tx - 1, ty + 1);
        const se = isWalkableCell(tx + 1, ty + 1);
        const card = (n ? 1 : 0) + (s ? 1 : 0) + (w ? 1 : 0) + (e ? 1 : 0);
        const bx = tx * 8;
        const by = ty * 8;

        if (card === 2) {
          if (n && w) [[7,3],[6,3],[5,4],[4,5],[3,6],[3,7]].forEach(([x,y]) => setPx(bx+x, by+y));
          if (n && e) [[0,3],[1,3],[2,4],[3,5],[4,6],[4,7]].forEach(([x,y]) => setPx(bx+x, by+y));
          if (s && w) [[3,0],[3,1],[4,2],[5,3],[6,4],[7,4]].forEach(([x,y]) => setPx(bx+x, by+y));
          if (s && e) [[4,0],[4,1],[3,2],[2,3],[1,4],[0,4]].forEach(([x,y]) => setPx(bx+x, by+y));
        } else if (card === 1) {
          if (n) hLine(bx, bx + 7, by + 3);
          if (s) hLine(bx, bx + 7, by + 4);
          if (w) vLine(bx + 3, by, by + 7);
          if (e) vLine(bx + 4, by, by + 7);

          if (se) [[7,4],[6,5],[5,6],[4,7]].forEach(([x,y]) => setPx(bx+x, by+y));

  function rotateGrid(rows, dir) {
    // Source grids are facing LEFT (DIR_LEFT = 1)
    const n = rows.length;
    const out = Array.from({ length: n }, () => Array(n).fill("."));
    for (let y = 0; y < n; y++) {
      for (let x = 0; x < n; x++) {
        const ch = rows[y][x];
        if (dir === DIR_LEFT)       out[y][x] = ch;
        else if (dir === DIR_RIGHT) out[y][n - 1 - x] = ch;
        else if (dir === DIR_UP)    out[x][n - 1 - y] = ch;
        else if (dir === DIR_DOWN)  out[n - 1 - x][y] = ch;
      }
    }
    return out.map((r) => r.join(""));
  }

    const frames = [];

      const c = makeCanvas(15, 15);
      const cx = c.getContext("2d");
      cx.fillStyle = PALETTE.yellow;
      const openAngle = ((i + 1) / 9) * Math.PI * 0.96;
      const cy = 7 + Math.floor(i / 3);
      const r = 6.3;
      for (let y = 0; y < 15; y++) {
        for (let x = 0; x < 15; x++) {
          const dx = x - 7;
          const dy = y - cy;
          const dist = Math.hypot(dx, dy);
          if (dist <= r && y <= 13) {
            // Angle measured from straight UP (0..PI on both left and right)
            const angFromUp = Math.atan2(Math.abs(dx), -dy);
            if (angFromUp >= openAngle) {

  function drawMiniNumber(lctx, num, centerX, centerY, color) {
    const key = num + "|" + color;
    let spr = miniPopupCache.get(key);
    if (!spr) {
      const s = String(num);
      const w = s.length * 4 - 1;
      spr = makeCanvas(w, 7);
      const scx = spr.getContext("2d");
      // Subtle black halo so popup digits remain 100% legible over maze walls & dots
      scx.fillStyle = PALETTE.black;
      scx.fillRect(0, 0, w, 7);
      scx.fillStyle = color;
      for (let i = 0; i < s.length; i++) {
        const d = MINI_DIGITS[s[i]];
        if (!d) continue;
        for (let y = 0; y < 5; y++) {
          for (let x = 0; x < 3; x++) {
            if (d[y][x] === "#") scx.fillRect(i * 4 + x, y + 1, 1, 1);

        }
      }
      miniPopupCache.set(key, spr);
    }
    lctx.drawImage(spr, Math.round(centerX - spr.width / 2), Math.round(centerY - spr.height / 2));
  }

  // =========================================================================
  // 6. PROCEDURAL WEB AUDIO SYNTHESIZER (ARCADE SOUND ENGINE)
  // =========================================================================
  class ArcadeAudio {
    constructor() {
      this.ctx = null;
      this.master = null;
      this.muted = loadStored("pacman_muted", "0") === "1";
      this.wakaToggle = 0;
      this.bgOsc = null;
      this.bgGain = null;
      this.bgMode = "NONE"; // NONE | SIREN | FRIGHT | EYES
      this.bgPhase = 0;
      this.introNodes = [];
    }

    unlock() {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = this.muted ? 0 : 0.24;
        this.master.connect(this.ctx.destination);
      }
      if (this.ctx && this.ctx.state === "suspended") {
        this.ctx.resume().catch(() => {});
      }
    }

    setMuted(m) {
      this.muted = m;
      saveStored("pacman_muted", m ? "1" : "0");
      if (this.master && this.ctx) {
        this.master.gain.setValueAtTime(m ? 0 : 0.24, this.ctx.currentTime);
      }
    }

    stopIntro() {
      for (const n of this.introNodes) {
        try { n.stop(); } catch (_) {}
      }
      this.introNodes.length = 0;
    }

    stopBg() {
      if (this.bgOsc) {
        try { this.bgOsc.stop(); } catch (_) {}
        try { this.bgOsc.disconnect(); } catch (_) {}
        this.bgOsc = null;
      }
      if (this.bgGain) {
        try { this.bgGain.disconnect(); } catch (_) {}
        this.bgGain = null;
      }
      this.bgMode = "NONE";
    }

    stopAll() {
      this.stopIntro();
      this.stopBg();
    }

    // Iconic 1980 Namco Pac-Man Startup Jingle (B major -> C major -> B major -> chromatic turnaround)
    playIntro() {
      this.unlock();
      if (!this.ctx) return;
      this.stopAll();

      const t0 = this.ctx.currentTime + 0.03;
      const S = 0.118; // 16th-note duration (~4.0s total)

      // [slotStart, slotDur, freqHz]
      const melody = [
        // Bar 1a: B major
        [0,   0.9, 493.88], [1,   0.9, 987.77], [2,   0.9, 739.99], [3,   0.9, 622.25],
        [4,   0.5, 987.77], [4.5, 1.4, 739.99], [6,   1.8, 622.25],
        // Bar 1b: C major
        [8,   0.9, 523.25], [9,   0.9, 1046.50],[10,  0.9, 783.99], [11,  0.9, 659.25],
        [12,  0.5, 1046.50],[12.5,1.4, 783.99], [14,  1.8, 659.25],
        // Bar 2a: B major
        [16,  0.9, 493.88], [17,  0.9, 987.77], [18,  0.9, 739.99], [19,  0.9, 622.25],
        [20,  0.5, 987.77], [20.5,1.4, 739.99], [22,  1.8, 622.25],
        // Bar 2b: Chromatic upward triplets + final B5!
        [24,   0.65, 622.25], [24.66,0.65, 659.25], [25.33,0.65, 698.46],
        [26,   0.65, 698.46], [26.66,0.65, 739.99], [27.33,0.65, 783.99],
        [28,   0.65, 783.99], [28.66,0.65, 830.61], [29.33,0.65, 880.00],
        [30,   1.9,  987.77]
      ];

      const bass = [
        [0,  2.8, 123.47], [3,  0.9, 246.94], [4,  2.8, 123.47], [7,  0.9, 246.94],
        [8,  2.8, 130.81], [11, 0.9, 261.63], [12, 2.8, 130.81], [15, 0.9, 261.63],
        [16, 2.8, 123.47], [19, 0.9, 246.94], [20, 2.8, 123.47], [23, 0.9, 246.94],
        [24, 1.8, 185.00], [26, 1.8, 207.65], [28, 1.8, 233.08], [30, 1.9, 246.94]
      ];

      const sched = (notes, type, vol) => {
        for (const [st, dur, freq] of notes) {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, t0 + st * S);
          const start = t0 + st * S;
          const end = start + dur * S;
          g.gain.setValueAtTime(0.0001, start);
          g.gain.linearRampToValueAtTime(vol, start + 0.008);
          g.gain.setValueAtTime(vol * 0.85, Math.max(start + 0.01, end - 0.02));
          g.gain.linearRampToValueAtTime(0.0001, end);
          osc.connect(g);
          g.connect(this.master);
          osc.start(start);
          osc.stop(end + 0.01);
          this.introNodes.push(osc);
        }
      };

      sched(melody, "square", 0.32);
      sched(bass, "triangle", 0.42);
    }

    // Alternating two-stroke waka-waka dot sound
    playWaka() {
      if (!this.ctx || this.muted) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = "triangle";
      if (this.wakaToggle === 0) {
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.exponentialRampToValueAtTime(540, now + 0.075);
      } else {
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(250, now + 0.075);
      }
      this.wakaToggle ^= 1;
      g.gain.setValueAtTime(0.38, now);
      g.gain.linearRampToValueAtTime(0.001, now + 0.08);
      osc.connect(g);
      g.connect(this.master);
      osc.start(now);
      osc.stop(now + 0.085);
    }

    playEatGhost() {
      if (!this.ctx || this.muted) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(190, now);
      osc.frequency.exponentialRampToValueAtTime(1180, now + 0.42);
      g.gain.setValueAtTime(0.35, now);
      g.gain.setValueAtTime(0.32, now + 0.35);
      g.gain.linearRampToValueAtTime(0.001, now + 0.45);
      osc.connect(g);
      g.connect(this.master);
      osc.start(now);
      osc.stop(now + 0.46);
    }

    playEatFruit() {
      if (!this.ctx || this.muted) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = "square";
      osc.frequency.setValueAtTime(392, now);
      osc.frequency.setValueAtTime(523.25, now + 0.07);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.24);
      g.gain.setValueAtTime(0.3, now);
      g.gain.linearRampToValueAtTime(0.001, now + 0.27);
      osc.connect(g);
      g.connect(this.master);
      osc.start(now);
      osc.stop(now + 0.28);
    }

    playExtraLife() {
      if (!this.ctx || this.muted) return;
      const now = this.ctx.currentTime;
      for (let i = 0; i < 6; i++) {
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = "triangle";
        const t = now + i * 0.105;
        osc.frequency.setValueAtTime(i % 2 === 0 ? 1174.66 : 1567.98, t);
        g.gain.setValueAtTime(0.42, t);
        g.gain.exponentialRampToValueAtTime(0.01, t + 0.095);
        osc.connect(g);
        g.connect(this.master);
        osc.start(t);
        osc.stop(t + 0.1);
      }
    }

    playDeath() {
      this.stopBg();
      if (!this.ctx || this.muted) return;
      const now = this.ctx.currentTime;
      // 6 descending warbles + 2 end pops
      for (let i = 0; i < 6; i++) {
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = "square";
        const t = now + i * 0.16;
        const hi = 680 - i * 72;
        const lo = hi * 0.68;
        osc.frequency.setValueAtTime(lo, t);
        osc.frequency.linearRampToValueAtTime(hi, t + 0.075);
        osc.frequency.linearRampToValueAtTime(lo * 0.88, t + 0.155);
        g.gain.setValueAtTime(0.28, t);
        g.gain.linearRampToValueAtTime(0.01, t + 0.158);
        osc.connect(g);
        g.connect(this.master);
        osc.start(t);
        osc.stop(t + 0.16);
      }
      for (let j = 0; j < 2; j++) {
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = "sawtooth";
        const t = now + 0.98 + j * 0.13;
        osc.frequency.setValueAtTime(160, t);
        osc.frequency.exponentialRampToValueAtTime(520, t + 0.09);
        g.gain.setValueAtTime(0.32, t);
        g.gain.linearRampToValueAtTime(0.001, t + 0.11);
        osc.connect(g);
        g.connect(this.master);
        osc.start(t);
        osc.stop(t + 0.12);
      }
    }

    // Continuous frame-driven background sound (Siren / Power-Pellet Hum / Returning Eyes)
    updateBackground(dt, desiredMode, pelletsRemaining) {
      if (!this.ctx || this.muted || desiredMode === "NONE") {
        if (this.bgMode !== "NONE") this.stopBg();
        return;
      }

      if (this.bgMode !== desiredMode || !this.bgOsc) {
        this.stopBg();
        this.bgMode = desiredMode;
        this.bgPhase = 0;
        this.bgOsc = this.ctx.createOscillator();
        this.bgGain = this.ctx.createGain();
        this.bgOsc.type = desiredMode === "SIREN" ? "triangle" : "square";
        this.bgGain.gain.value = desiredMode === "SIREN" ? 0.17 : 0.13;
        this.bgOsc.connect(this.bgGain);
        this.bgGain.connect(this.master);
        this.bgOsc.start();
      }

      if (desiredMode === "EYES") {
        // Urgent fast descending trill while eyes race back to Ghost House
        this.bgPhase = (this.bgPhase + dt * 11.0) % 1;
        const f = 980 - this.bgPhase * 520;
        this.bgOsc.frequency.setTargetAtTime(f, this.ctx.currentTime, 0.008);
      } else if (desiredMode === "FRIGHT") {
        // Classic upward warbling hum during Power Pellet
        this.bgPhase = (this.bgPhase + dt * 7.5) % 1;
        const f = 155 + this.bgPhase * 210;
        this.bgOsc.frequency.setTargetAtTime(f, this.ctx.currentTime, 0.008);
      } else if (desiredMode === "SIREN") {
        // 5 escalating siren tiers as remaining pellets decrease
        let tier = 0;
        if (pelletsRemaining <= 20) tier = 4;
        else if (pelletsRemaining <= 55) tier = 3;
        else if (pelletsRemaining <= 115) tier = 2;
        else if (pelletsRemaining <= 180) tier = 1;

        const rates = [2.2, 2.6, 3.1, 3.7, 4.5];
        const bases = [130, 152, 176, 204, 238];
        const spans = [78,  88,  98,  110, 125];
        this.bgPhase = (this.bgPhase + dt * rates[tier]) % 1;
        const tri = 1 - Math.abs(this.bgPhase * 2 - 1);
        const f = bases[tier] + tri * spans[tier];
        this.bgOsc.frequency.setTargetAtTime(f, this.ctx.currentTime, 0.012);
      }
    }
  }

  const audio = new ArcadeAudio();

  // =========================================================================
  // 7. GAME STATE & CORE ENTITIES
  // =========================================================================
  const STATE = {
    TITLE:       "TITLE",
    INTRO:       "INTRO",
    READY:       "READY",
    PLAYING:     "PLAYING",
    EAT_FREEZE:  "EAT_FREEZE",
    DYING:       "DYING",
    LEVEL_CLEAR: "LEVEL_CLEAR",
    GAME_OVER:   "GAME_OVER"
  };

  const game = {
    state: STATE.TITLE,
    stateTimer: 0,
    paused: false,
    crtOn: loadStored("pacman_crt", "1") !== "0",
    tick: 0,

    score: 0,
    highScore: parseInt(loadStored("pacman_highscore", "10000"), 10) || 10000,
    lives: 3, // Total lives including active Pac-Man (displays lives - 1 reserve icons)
    extraLifeAwarded: false,
    level: 1,
    spec: getLevelSpec(1),

    // Pellet grid: 0 = empty, 1 = dot (10 pts), 2 = energizer (50 pts)
    pellets: Array.from({ length: MAZE_ROWS }, () => new Uint8Array(COLS)),
    pelletsRemaining: 244,
    dotsEatenThisLevel: 0,

    // Ghost house release counters
    useGlobalDotCounter: false,
    globalDotCounter: 0,
    starveTimer: 0,

    // Wave & Fright timers
    waveIdx: 0,
    waveTimer: 0,
    globalMode: "SCATTER",
    frightTimer: 0,
    ghostCombo: 0,

    // Freeze popup when eating a ghost
    eatPopup: null,     // { x, y, pts, ghostId }
    fruit: null,        // { id, pts, timer }
    fruitPopup: null,   // { pts, timer }

    // Title screen animated chase demo timer
    attractTime: 0
  };

  const pac = {
    x: 14.0,
    y: 23.5,
    dir: DIR_LEFT,
    moving: false,
    animPhase: 0,
    freezeFrames: 0 // 1-frame dot hitlag / 3-frame energizer hitlag
  };

  // Input buffering: supports both held keys and quick pre-corner taps
  const input = {
    heldDirs: [],
    bufferedDir: DIR_NONE,
    bufferedTimer: 0
  };

  const ghosts = GHOST_DEFS.map((def, idx) => ({
    idx,
    id: def.id,
    name: def.name,
    nick: def.nick,
    color: def.color,
    scatterX: def.scatterX,
    scatterY: def.scatterY,
    x: 14.0,
    y: 11.5,
    dir: DIR_LEFT,
    lookDir: DIR_LEFT,
    state: "ACTIVE", // ACTIVE | HOUSE | EXITING | EYES | ENTERING
    frightened: false,
    reversePending: false,
    dotCounter: 0,
    dotLimit: 0
  }));

  // =========================================================================
  // 8. INITIALIZATION & LEVEL / ROUND SETUP
  // =========================================================================
  function resetPelletGrid() {
    let count = 0;
    for (let y = 0; y < MAZE_ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const ch = RAW_MAZE[y][x];
        if (ch === ".") {
          game.pellets[y][x] = 1;
          count++;
        } else if (ch === "o") {
          game.pellets[y][x] = 2;
          count++;
        } else {
          game.pellets[y][x] = 0;
        }
      }
    }
    game.pelletsRemaining = count;
    game.dotsEatenThisLevel = 0;
  }

  function resetPositionsForLife(afterDeath) {
    pac.x = 14.0;
    pac.y = 23.5;
    pac.dir = DIR_LEFT;
    pac.moving = true;
    pac.animPhase = 0;
    pac.freezeFrames = 0;

    input.bufferedDir = DIR_NONE;
    input.bufferedTimer = 0;

    game.waveIdx = 0;
    game.waveTimer = 0;
    game.globalMode = game.spec.waves[0].mode;
    game.frightTimer = 0;
    game.ghostCombo = 0;
    game.starveTimer = 0;
    game.eatPopup = null;
    game.fruit = null;
    game.fruitPopup = null;

    if (afterDeath) {
      game.useGlobalDotCounter = true;
      game.globalDotCounter = 0;
    } else {
      game.useGlobalDotCounter = false;
      game.globalDotCounter = 0;
    }

    // Blinky starts outside above Ghost House
    const blinky = ghosts[0];
    blinky.x = 14.0; blinky.y = 11.5;
    blinky.dir = DIR_LEFT; blinky.lookDir = DIR_LEFT;
    blinky.state = "ACTIVE";
    blinky.frightened = false; blinky.reversePending = false;

    // Pinky starts center inside Ghost House
    const pinky = ghosts[1];
    pinky.x = 14.0; pinky.y = 14.5;
    pinky.dir = DIR_DOWN; pinky.lookDir = DIR_DOWN;
    pinky.state = afterDeath ? "HOUSE" : "EXITING";
    pinky.frightened = false; pinky.reversePending = false;
    if (!afterDeath) { pinky.dotCounter = 0; pinky.dotLimit = 0; }

    // Inky starts left inside Ghost House
    const inky = ghosts[2];
    inky.x = 12.0; inky.y = 14.5;
    inky.dir = DIR_UP; inky.lookDir = DIR_UP;
    inky.state = "HOUSE";
    inky.frightened = false; inky.reversePending = false;
    if (!afterDeath) {
      inky.dotCounter = 0;
      inky.dotLimit = game.level === 1 ? 30 : 0;
    }

    // Clyde starts right inside Ghost House
    const clyde = ghosts[3];
    clyde.x = 16.0; clyde.y = 14.5;
    clyde.dir = DIR_UP; clyde.lookDir = DIR_UP;
    clyde.state = "HOUSE";
    clyde.frightened = false; clyde.reversePending = false;
    if (!afterDeath) {
      clyde.dotCounter = 0;
      clyde.dotLimit = game.level === 1 ? 60 : (game.level === 2 ? 50 : 0);
    }
  }

  function startNewGame() {
    audio.unlock();
    game.paused = false;
    game.score = 0;
    game.lives = 3;
    game.extraLifeAwarded = false;
    game.level = 1;
    game.spec = getLevelSpec(1);
    resetPelletGrid();
    resetPositionsForLife(false);
    game.state = STATE.INTRO;
    game.stateTimer = 4.15;
    audio.playIntro();
    syncUiButtons();
  }

  function startNextLevel() {
    game.level++;
    game.spec = getLevelSpec(game.level);
    resetPelletGrid();
    resetPositionsForLife(false);
    game.state = STATE.READY;
    game.stateTimer = 2.0;
    audio.stopBg();
  }

  function addScore(pts) {
    game.score += pts;
    if (game.score > game.highScore) {
      game.highScore = game.score;
      saveStored("pacman_highscore", game.highScore);
    }
    if (!game.extraLifeAwarded && game.score >= 10000) {
      game.extraLifeAwarded = true;
      game.lives++;
      audio.playExtraLife();
    }
  }

  // =========================================================================
  // 9. PAC-MAN MOVEMENT, RESPONSIVE CORNERING & PELLET EATING
  // =========================================================================
  const TURN_TOLERANCE = 0.44; // Generous corner-cutting window around tile centers

  function canPacTurn(dir) {
    if (dir === DIR_NONE) return false;
    if (dir === DIRS[pac.dir].opp) return true;
    if (dir === pac.dir) return false;

    const ix = Math.floor(pac.x);
    const iy = Math.floor(pac.y);
    // Disallow 90-degree turns while outside maze bounds in the wrap tunnel
    if (ix < 0 || ix >= COLS || iy < 0 || iy >= MAZE_ROWS) return false;

    const axisCoord = DIRS[pac.dir].dx !== 0 ? pac.x - (ix + 0.5) : pac.y - (iy + 0.5);
    if (Math.abs(axisCoord) > TURN_TOLERANCE) return false;

    return isWalkableCell(ix + DIRS[dir].dx, iy + DIRS[dir].dy);
  }

  function pickDesiredDir() {
    // Check recent tap buffer first, then held keys stack
    if (input.bufferedTimer > 0 && input.bufferedDir !== DIR_NONE) {
      if (canPacTurn(input.bufferedDir)) {
        const chosen = input.bufferedDir;
        if (!input.heldDirs.includes(chosen)) {
          input.bufferedDir = DIR_NONE;
          input.bufferedTimer = 0;
        }
        return chosen;
      }
    }
    for (const hd of input.heldDirs) {
      if (canPacTurn(hd)) return hd;
    }
    return DIR_NONE;
  }

  function updatePacMan(dt) {
    if (input.bufferedTimer > 0) {
      input.bufferedTimer = Math.max(0, input.bufferedTimer - dt);
      if (input.bufferedTimer === 0) input.bufferedDir = DIR_NONE;
    }

    // Even during 1-frame/3-frame pellet hitlag, accept instant direction buffered turns
    const nextDir = pickDesiredDir();
    if (nextDir !== DIR_NONE) {
      pac.dir = nextDir;
    }

    if (pac.freezeFrames > 0) {
      pac.freezeFrames--;
      return;
    }

    const spdRatio = game.frightTimer > 0 ? game.spec.pacFright : game.spec.pacNorm;
    const step = BASE_SPEED * spdRatio * dt;
    const d = DIRS[pac.dir];
    const prevX = pac.x;
    const prevY = pac.y;

    if (d.dx !== 0) {
      const iy = Math.floor(pac.y);
      // Diagonal corner-cutting slide toward centerline iy + 0.5
      const diffY = (iy + 0.5) - pac.y;
      if (Math.abs(diffY) <= step * 1.35) pac.y = iy + 0.5;
      else pac.y += Math.sign(diffY) * step * 1.35;

      const tx = Math.floor(pac.x);
      let nx = pac.x + d.dx * step;
      if (d.dx > 0 && !isWalkableCell(tx + 1, iy) && nx > tx + 0.5) nx = tx + 0.5;
      if (d.dx < 0 && !isWalkableCell(tx - 1, iy) && nx < tx + 0.5) nx = tx + 0.5;
      pac.x = nx;

      // Smooth side tunnel wraparound ([-1.0, 29.0], span 30 tiles)
      if (pac.x < -1.0) pac.x += 30.0;
      if (pac.x >= 29.0) pac.x -= 30.0;
    } else {
      const ix = Math.floor(pac.x);
      // Diagonal corner-cutting slide toward centerline ix + 0.5
      const diffX = (ix + 0.5) - pac.x;
      if (Math.abs(diffX) <= step * 1.35) pac.x = ix + 0.5;
      else pac.x += Math.sign(diffX) * step * 1.35;

      const ty = Math.floor(pac.y);
      let ny = pac.y + d.dy * step;
      if (d.dy > 0 && !isWalkableCell(ix, ty + 1) && ny > ty + 0.5) ny = ty + 0.5;
      if (d.dy < 0 && !isWalkableCell(ix, ty - 1) && ny < ty + 0.5) ny = ty + 0.5;
      pac.y = ny;
    }

    const distMoved = Math.min(1, Math.hypot(pac.x - prevX, pac.y - prevY));
    pac.moving = distMoved > 0.0005;
    if (pac.moving) {
      pac.animPhase = (pac.animPhase + distMoved * 3.4) % 4;
    } else if (Math.floor(pac.animPhase) === 0) {
      // Stopped against a wall: rest with mouth slightly open like arcade hardware
      pac.animPhase = 1;
    }

    // Check pellet consumption on current tile
    const ptx = Math.floor(pac.x);
    const pty = Math.floor(pac.y);
    if (ptx >= 0 && ptx < COLS && pty >= 0 && pty < MAZE_ROWS) {
      const cell = game.pellets[pty][ptx];
      if (cell !== 0) {
        game.pellets[pty][ptx] = 0;
        game.pelletsRemaining--;
        game.dotsEatenThisLevel++;
        game.starveTimer = 0;
        audio.playWaka();

        if (cell === 1) {
          addScore(10);
          pac.freezeFrames = 1; // Authentic 1-frame dot hitlag
        } else {
          addScore(50);
          pac.freezeFrames = 3; // Authentic 3-frame energizer hitlag
          triggerPowerPellet();
        }

        handleDotReleaseCounters();

        // Spawn bonus fruit at 70 and 170 pellets eaten
        if (game.dotsEatenThisLevel === 70 || game.dotsEatenThisLevel === 170) {
          const fSpec = getFruitSpec(game.level);
          game.fruit = { id: fSpec.id, pts: fSpec.pts, timer: 9.6 };
        }
      }
    }

    // Check Bonus Fruit consumption (spawns at x = 14.0, y = 17.5)
    if (game.fruit && Math.hypot(pac.x - 14.0, pac.y - 17.5) < 0.85) {
      addScore(game.fruit.pts);
      game.fruitPopup = { pts: game.fruit.pts, timer: 2.0 };
      game.fruit = null;
      audio.playEatFruit();
    }
  }

  // =========================================================================
  // 10. GHOST HOUSE RELEASE, SCATTER/CHASE WAVES & DISTINCT 4-GHOST AI
  // =========================================================================
  function triggerPowerPellet() {
    const dur = game.spec.frightSec;
    game.ghostCombo = 0;
    if (dur > 0) {
      game.frightTimer = dur;
      for (const g of ghosts) {
        if (g.state !== "EYES" && g.state !== "ENTERING") {
          g.frightened = true;
          if (g.state === "ACTIVE") g.reversePending = true;
        }
      }
    } else {
      // Lv 17, 19+: ghosts still reverse direction even with 0s blue time
      for (const g of ghosts) {
        if (g.state === "ACTIVE") g.reversePending = true;
      }
    }
  }

  function handleDotReleaseCounters() {
    if (game.useGlobalDotCounter) {
      game.globalDotCounter++;
      if (game.globalDotCounter === 7 && ghosts[1].state === "HOUSE") {
        ghosts[1].state = "EXITING";
      } else if (game.globalDotCounter === 17 && ghosts[2].state === "HOUSE") {
        ghosts[2].state = "EXITING";
      } else if (game.globalDotCounter === 32 && ghosts[3].state === "HOUSE") {
        ghosts[3].state = "EXITING";
        game.useGlobalDotCounter = false; // Deactivate global counter once Clyde exits
      }
      return;
    }

    // Personal dot counters: increment only the highest-priority ghost still in HOUSE
    for (let i = 1; i < 4; i++) {
      const g = ghosts[i];
      if (g.state === "HOUSE") {
        g.dotCounter++;
        if (g.dotCounter >= g.dotLimit) {
          g.state = "EXITING";
        }
        break;
      }
    }
  }

  function checkAutoReleaseHouse(dt) {
    // Immediate exit for any ghost whose personal limit is already met (when not using global counter)
    if (!game.useGlobalDotCounter) {
      for (let i = 1; i < 4; i++) {
        const g = ghosts[i];
        if (g.state === "HOUSE" && g.dotCounter >= g.dotLimit) {
          g.state = "EXITING";
          break;
        }
      }
    }

    // 4-second (3s on Lv5+) dot-starvation safety timer releases next waiting ghost
    game.starveTimer += dt;
    if (game.starveTimer >= game.spec.starveLimit) {
      game.starveTimer = 0;
      for (let i = 1; i < 4; i++) {
        if (ghosts[i].state === "HOUSE") {
          ghosts[i].state = "EXITING";
          break;
        }
      }
    }
  }

  function updateWavesAndFright(dt) {
    if (game.frightTimer > 0) {
      game.frightTimer = Math.max(0, game.frightTimer - dt);
      if (game.frightTimer === 0) {
        for (const g of ghosts) g.frightened = false;
      }
      return; // Wave timer pauses during Frightened mode
    }

    const curWave = game.spec.waves[game.waveIdx];
    if (!curWave || !Number.isFinite(curWave.dur)) return;

    game.waveTimer += dt;
    if (game.waveTimer >= curWave.dur) {
      game.waveTimer -= curWave.dur;
      game.waveIdx = Math.min(game.waveIdx + 1, game.spec.waves.length - 1);
      const nextMode = game.spec.waves[game.waveIdx].mode;
      if (nextMode !== game.globalMode) {
        game.globalMode = nextMode;
        for (const g of ghosts) {
          if (g.state === "ACTIVE") g.reversePending = true;
        }
      }
    }
  }

  function isCruiseElroyActive() {
    // Cruise Elroy suspends after a life loss until Clyde has exited the Ghost House again
    if (game.useGlobalDotCounter && ghosts[3].state === "HOUSE") return 0;
    if (game.pelletsRemaining <= game.spec.elroy2Dots) return 2;
    if (game.pelletsRemaining <= game.spec.elroy1Dots) return 1;
    return 0;
  }

  function computeGhostTarget(g, gx, gy) {
    if (g.state === "EYES") {
      return { tx: 13.5, ty: 11 };
    }

    // Scatter mode (except Blinky in Cruise Elroy mode continues chasing Pac-Man!)
    if (game.globalMode === "SCATTER" && !(g.id === "blinky" && isCruiseElroyActive() > 0)) {
      return { tx: g.scatterX, ty: g.scatterY };
    }

    const ptx = Math.floor(pac.x);
    const pty = Math.floor(pac.y);
    const pd = DIRS[pac.dir];

    switch (g.id) {
      case "blinky":
        // Red ("SHADOW"): relentlessly targets Pac-Man's exact tile
        return { tx: ptx, ty: pty };

      case "pinky": {
        // Pink ("SPEEDY"): targets 4 tiles ahead of Pac-Man (including classic UP+LEFT overflow)
        const offX = pac.dir === DIR_UP ? -4 : pd.dx * 4;
        const offY = pd.dy * 4;
        return { tx: ptx + offX, ty: pty + offY };
      }

      case "inky": {
        // Cyan ("BASHFUL"): doubles vector from Blinky through tile 2 ahead of Pac-Man
        const offX = pac.dir === DIR_UP ? -2 : pd.dx * 2;
        const offY = pd.dy * 2;
        const pivX = ptx + offX;
        const pivY = pty + offY;
        const bx = Math.floor(ghosts[0].x);
        const by = Math.floor(ghosts[0].y);
        return { tx: pivX + (pivX - bx), ty: pivY + (pivY - by) };
      }

      case "clyde":
      default: {
        // Orange ("POKEY"): chases when > 8 tiles away, retreats to bottom-left when <= 8 tiles
        const distSq = (gx - ptx) * (gx - ptx) + (gy - pty) * (gy - pty);
        if (distSq > 64) return { tx: ptx, ty: pty };
        return { tx: g.scatterX, ty: g.scatterY };
      }
    }
  }

  // Arcade upward-turn red zones: normal Scatter/Chase ghosts cannot turn UP at (12|15, 11|23)
  function isUpRestrictedZone(tx, ty) {
    return (tx === 12 || tx === 15) && (ty === 11 || ty === 23);
  }

  function chooseGhostDirection(g, tx, ty) {
    const oppDir = DIRS[g.dir].opp;
    const valid = [];

    for (let d = 0; d < 4; d++) {
      if (d === oppDir) continue;
      if (d === DIR_UP && !g.frightened && g.state === "ACTIVE" && isUpRestrictedZone(tx, ty)) {
        continue;
      }
      if (isWalkableCell(tx + DIRS[d].dx, ty + DIRS[d].dy)) {
        valid.push(d);
      }
    }

    if (valid.length === 0) {
      return isWalkableCell(tx + DIRS[oppDir].dx, ty + DIRS[oppDir].dy) ? oppDir : g.dir;
    }
    if (valid.length === 1) return valid[0];

    if (g.frightened && g.state === "ACTIVE") {
      return valid[Math.floor(Math.random() * valid.length)];
    }

    const { tx: targetX, ty: targetY } = computeGhostTarget(g, tx, ty);
    let bestDir = valid[0];
    let bestDist = Infinity;

    // Valid array is already in UP > LEFT > DOWN > RIGHT tie-break order!
    for (const d of valid) {
      const nx = tx + DIRS[d].dx;
      const ny = ty + DIRS[d].dy;
      const dist = (nx - targetX) * (nx - targetX) + (ny - targetY) * (ny - targetY);
      if (dist < bestDist) {
        bestDist = dist;
        bestDir = d;
      }
    }
    return bestDir;
  }

  function getGhostSpeed(g) {
    if (g.state === "EYES" || g.state === "ENTERING") return BASE_SPEED * 1.75;
    if (g.state === "HOUSE" || g.state === "EXITING") return BASE_SPEED * 0.48;

    // Tunnel slowdown
    const ty = Math.floor(g.y);
    const tx = Math.floor(g.x);
    if (ty === 14 && (tx <= 5 || tx >= 22)) {
      return BASE_SPEED * game.spec.ghostTunnel;
    }

    if (g.frightened) {
      return BASE_SPEED * game.spec.ghostFright;
    }

    if (g.id === "blinky") {
      const elroy = isCruiseElroyActive();
      if (elroy === 2) return BASE_SPEED * game.spec.elroy2Spd;
      if (elroy === 1) return BASE_SPEED * game.spec.elroy1Spd;
    }
    return BASE_SPEED * game.spec.ghostNorm;
  }

  function updateGhost(g, dt) {
    const step = getGhostSpeed(g) * dt;

    if (g.state === "HOUSE") {
      // Gentle vertical bobbing inside the Ghost House
      const dy = DIRS[g.dir].dy;
      g.y += dy * step;
      if (g.y <= 14.05) { g.y = 14.05; g.dir = DIR_DOWN; }
      if (g.y >= 14.95) { g.y = 14.95; g.dir = DIR_UP; }
      g.lookDir = g.dir;
      return;
    }

    if (g.state === "EXITING") {
      // Center horizontally to x = 14.0, then ascend through pink gate to y = 11.5
      if (Math.abs(g.x - 14.0) > 0.001) {
        const dirX = g.x < 14.0 ? 1 : -1;
        g.lookDir = dirX > 0 ? DIR_RIGHT : DIR_LEFT;
        if (Math.abs(14.0 - g.x) <= step) g.x = 14.0;
        else g.x += dirX * step;
      } else {
        g.x = 14.0;
        g.lookDir = DIR_UP;
        g.y -= step;
        if (g.y <= 11.5) {
          g.y = 11.5;
          g.state = "ACTIVE";
          g.dir = g.reversePending ? DIR_RIGHT : DIR_LEFT;
          g.lookDir = g.dir;
          g.reversePending = false;
        }
      }
      return;
    }

    if (g.state === "ENTERING") {
      // Descend straight down through the pink gate into Ghost House center, regenerate & exit
      g.x = 14.0;
      g.lookDir = DIR_DOWN;
      g.y += step;
      if (g.y >= 14.5) {
        g.y = 14.5;
        g.frightened = false;
        g.state = "EXITING";
        g.lookDir = DIR_UP;
      }
      return;
    }

    // ACTIVE or EYES: exact rail sub-stepping from tile center to tile center
    let rem = step;
    let guard = 0;
    while (rem > 1e-6 && guard++ < 8) {
      if (g.reversePending && g.state === "ACTIVE" && g.x >= 0.5 && g.x <= 27.5) {
        g.dir = DIRS[g.dir].opp;
        g.lookDir = g.dir;
        g.reversePending = false;
      }

      // Intercept EYES crossing x = 14.0 on row y = 11.5 right above the Ghost House gate
      if (g.state === "EYES" && Math.abs(g.y - 11.5) < 0.02) {
        const dGate = 14.0 - g.x;
        if (Math.abs(dGate) <= rem + 0.02 && (dGate === 0 || Math.sign(dGate) === DIRS[g.dir].dx)) {
          g.x = 14.0;
          g.y = 11.5;
          g.state = "ENTERING";
          g.lookDir = DIR_DOWN;
          return;
        }
      }

      const d = DIRS[g.dir];
      let distToCenter;
      if (d.dx > 0)      distToCenter = (Math.floor(g.x + 0.5) + 0.5) - g.x;
      else if (d.dx < 0) distToCenter = g.x - (Math.ceil(g.x - 0.5) - 0.5);
      else if (d.dy > 0) distToCenter = (Math.floor(g.y + 0.5) + 0.5) - g.y;
      else               distToCenter = g.y - (Math.ceil(g.y - 0.5) - 0.5);

      if (distToCenter <= 1e-6) distToCenter = 1.0;

      if (rem < distToCenter) {
        g.x += d.dx * rem;
        g.y += d.dy * rem;
        rem = 0;
      } else {
        g.x += d.dx * distToCenter;
        g.y += d.dy * distToCenter;
        rem -= distToCenter;

        // Wrap tunnel before tile evaluation
        if (g.x < -1.0) g.x += 30.0;
        if (g.x >= 29.0) g.x -= 30.0;

        // Exact snap onto (.5, .5) center and choose outgoing direction
        const tx = Math.round(g.x - 0.5);
        const ty = Math.round(g.y - 0.5);
        g.x = tx + 0.5;
        g.y = ty + 0.5;

        if (tx >= 0 && tx < COLS && ty >= 0 && ty < MAZE_ROWS) {
          g.dir = chooseGhostDirection(g, tx, ty);
          g.lookDir = g.dir;
        }
      }

      if (g.x < -1.0) g.x += 30.0;
      if (g.x >= 29.0) g.x -= 30.0;
    }
  }

  // =========================================================================
  // 11. COLLISIONS & MASTER SIMULATION TICK (60 HZ FIXED STEP)
  // =========================================================================
  function checkCollisions() {
    // First pass: check Frightened ghosts so Pac-Man never dies on the same frame as eating one
    for (const g of ghosts) {
      if (g.state !== "ACTIVE" || !g.frightened) continue;
      let dx = g.x - pac.x;
      if (Math.abs(dx) > 15) dx -= Math.sign(dx) * 30;
      const dy = g.y - pac.y;
      if (Math.hypot(dx, dy) < 0.75) {
        g.frightened = false;
        g.state = "EYES";
        game.ghostCombo = Math.min(game.ghostCombo + 1, 4);
        const pts = 100 * (1 << game.ghostCombo); // 200, 400, 800, 1600
        addScore(pts);
        game.eatPopup = { x: g.x, y: g.y, pts, ghostId: g.id };
        game.state = STATE.EAT_FREEZE;
        game.stateTimer = 0.85;
        audio.stopBg();
        audio.playEatGhost();
        return;
      }
    }

    // Second pass: check lethal active ghosts
    for (const g of ghosts) {
      if (g.state !== "ACTIVE" || g.frightened) continue;
      let dx = g.x - pac.x;
      if (Math.abs(dx) > 15) dx -= Math.sign(dx) * 30;
      const dy = g.y - pac.y;
      if (Math.hypot(dx, dy) < 0.68) {
        game.state = STATE.DYING;
        game.stateTimer = 2.05;
        game.fruit = null;
        audio.stopBg();
        return;
      }
    }
  }

  function updateSimulation(dt) {
    game.tick++;

    if (game.paused) {
      audio.updateBackground(dt, "NONE", game.pelletsRemaining);
      return;
    }

    switch (game.state) {
      case STATE.TITLE:
        game.attractTime += dt;
        audio.updateBackground(dt, "NONE", game.pelletsRemaining);
        break;

      case STATE.INTRO:
        game.stateTimer -= dt;
        if (game.stateTimer <= 0) {
          game.state = STATE.PLAYING;
        }
        break;

      case STATE.READY:
        game.stateTimer -= dt;
        if (game.stateTimer <= 0) {
          game.state = STATE.PLAYING;
        }
        break;

      case STATE.EAT_FREEZE: {
        // Eaten eyes already on screen continue flying during the eat-ghost freeze, just like arcade!
        for (const g of ghosts) {
          if ((g.state === "EYES" || g.state === "ENTERING") &&
              (!game.eatPopup || g.id !== game.eatPopup.ghostId)) {
            updateGhost(g, dt);
          }
        }
        game.stateTimer -= dt;
        if (game.stateTimer <= 0) {
          game.eatPopup = null;
          game.state = STATE.PLAYING;
        }
        break;
      }

      case STATE.PLAYING: {
        updateWavesAndFright(dt);
        checkAutoReleaseHouse(dt);

        if (game.fruit) {
          game.fruit.timer -= dt;
          if (game.fruit.timer <= 0) game.fruit = null;
        }
        if (game.fruitPopup) {
          game.fruitPopup.timer -= dt;
          if (game.fruitPopup.timer <= 0) game.fruitPopup = null;
        }

        updatePacMan(dt);

        if (game.pelletsRemaining <= 0) {
          game.state = STATE.LEVEL_CLEAR;
          game.stateTimer = 2.55;
          game.fruit = null;
          audio.stopBg();
          break;
        }

        for (const g of ghosts) {
          updateGhost(g, dt);
        }

        checkCollisions();

        if (game.state === STATE.PLAYING) {
          const anyEyes = ghosts.some((g) => g.state === "EYES" || g.state === "ENTERING");
          const bgMode = anyEyes ? "EYES" : (game.frightTimer > 0 ? "FRIGHT" : "SIREN");
          audio.updateBackground(dt, bgMode, game.pelletsRemaining);
        }
        break;
      }

      case STATE.DYING: {
        const prev = game.stateTimer;
        game.stateTimer -= dt;
        // Trigger death warble after 0.65s initial freeze
        if (prev > 1.40 && game.stateTimer <= 1.40) {
          audio.playDeath();
        }
        if (game.stateTimer <= 0) {
          game.lives--;
          if (game.lives <= 0) {
            game.state = STATE.GAME_OVER;
            game.stateTimer = 3.2;
          } else {
            resetPositionsForLife(true);
            game.state = STATE.READY;
            game.stateTimer = 1.9;
          }
        }
        break;
      }

      case STATE.LEVEL_CLEAR:
        game.stateTimer -= dt;
        if (game.stateTimer <= 0) {
          startNextLevel();
        }
        break;

      case STATE.GAME_OVER:
        game.stateTimer -= dt;
        if (game.stateTimer <= 0) {
          game.state = STATE.TITLE;
          game.attractTime = 0;
        }
        break;
    }
  }

  // =========================================================================
  // 12. RENDERING (224x288 LOGICAL BUFFER -> 3X CRISP CANVAS)
  // =========================================================================
  const screenCanvas = document.getElementById("screen");
  const sctx = screenCanvas.getContext("2d", { alpha: false });
  sctx.imageSmoothingEnabled = false;

  const logicalBuf = makeCanvas(LOGICAL_W, LOGICAL_H);
  const lctx = logicalBuf.getContext("2d", { alpha: false });
  lctx.imageSmoothingEnabled = false;

  function drawHudScores() {
    // 1UP blinks every 16 ticks during active gameplay, solid on title screen
    if (game.state === STATE.TITLE || (Math.floor(game.tick / 16) % 2 === 0)) {
      drawText(lctx, "1UP", 3, 0, PALETTE.white);
    }
    drawText(lctx, "HIGH SCORE", 9, 0, PALETTE.white);

    const scoreStr = game.score === 0 ? "00" : String(game.score);
    drawText(lctx, scoreStr, Math.max(0, 7 - scoreStr.length), 1, PALETTE.white);

    const hiStr = game.highScore === 0 ? "00" : String(game.highScore);
    drawText(lctx, hiStr, Math.max(8, 17 - hiStr.length), 1, PALETTE.white);
  }

  function drawBottomHud() {
    // Reserve lives on bottom-left (up to 5 icons)
    const reserve = Math.max(0, Math.min(5, game.lives - 1));
    for (let i = 0; i < reserve; i++) {
      lctx.drawImage(lifeIconSprite, 16 + i * 16, 34 * 8 + 2);
    }

    // Recent level fruit history strip on bottom-right (up to 7 symbols, newest on left of strip)
    const count = Math.min(7, game.level);
    const startLvl = game.level - count + 1;
    for (let i = 0; i < count; i++) {
      const f = getFruitSpec(startLvl + i);
      lctx.drawImage(fruitSprites[f.id], 224 - 30 - i * 16, 34 * 8 + 1);
    }
  }

  function drawPellets() {
    const blinkOn = (Math.floor(game.tick / 10) % 2) === 0 ||
                    game.state === STATE.INTRO ||
                    game.state === STATE.READY;

    lctx.fillStyle = PALETTE.pellet;
    const pyOff = MAZE_Y_OFFSET * TILE;
    for (let y = 0; y < MAZE_ROWS; y++) {
      const row = game.pellets[y];
      for (let x = 0; x < COLS; x++) {
        const v = row[x];
        if (v === 1) {
          lctx.fillRect(x * 8 + 3, pyOff + y * 8 + 3, 2, 2);
        } else if (v === 2 && blinkOn) {
          lctx.drawImage(energizerSprite, x * 8, pyOff + y * 8);
        }
      }
    }
  }

  function drawGhostEntity(g) {
    const px = Math.round(g.x * TILE - 7);
    const py = Math.round((g.y + MAZE_Y_OFFSET) * TILE - 7);
    const skirtIdx = Math.floor(game.tick / 8) % 2;

    if (g.state === "EYES" || g.state === "ENTERING") {
      lctx.drawImage(ghostEyesSprites[g.lookDir], px, py);
      return;
    }

    if (g.frightened) {
      const flashDuration = game.spec.flashes * 0.36;
      let useWhite = false;
      if (game.frightTimer <= flashDuration && game.frightTimer > 0) {
        useWhite = (Math.floor((flashDuration - game.frightTimer) / 0.18) % 2) === 1;
      }
      lctx.drawImage((useWhite ? ghostFrightWhite : ghostFrightBlue)[skirtIdx], px, py);
      return;
    }

    lctx.drawImage(ghostSprites[g.id][g.lookDir][skirtIdx], px, py);
  }

  function drawPacManEntity() {
    const px = Math.round(pac.x * TILE - 6);
    const py = Math.round((pac.y + MAZE_Y_OFFSET) * TILE - 6);

    if (game.state === STATE.LEVEL_CLEAR || game.state === STATE.INTRO || game.state === STATE.READY) {
      lctx.drawImage(pacClosedSprite, px, py);
      return;
    }

    const frame = pacSprites[pac.dir][Math.floor(pac.animPhase) % 4];
    lctx.drawImage(frame, px, py);
  }

  function drawTitleScreen() {
    drawHudScores();

    drawText(lctx, "CHARACTER / NICKNAME", 4, 5, PALETTE.white);

    const castRows = [
      { def: GHOST_DEFS[0], y: 7 },
      { def: GHOST_DEFS[1], y: 10 },
      { def: GHOST_DEFS[2], y: 13 },
      { def: GHOST_DEFS[3], y: 16 }
    ];
    const skirtIdx = Math.floor(game.tick / 8) % 2;

    for (const row of castRows) {
      lctx.drawImage(ghostSprites[row.def.id][DIR_RIGHT][skirtIdx], 30, row.y * 8 - 3);
      drawText(lctx, "-" + row.def.name, 7, row.y, row.def.color);
      drawText(lctx, "\"" + row.def.nick + "\"", 17, row.y, row.def.color);
    }

    // Animated mini chase & power-pellet reversal vignette (rows 20..22)
    const cycle = game.attractTime % 10.5;
    const chaseY = 20 * 8;
    const chompIdx = Math.floor(game.attractTime * 14) % 4;
    if (cycle < 4.8) {
      // Phase 1: Ghosts chase Pac-Man toward left power pellet
      if ((Math.floor(game.tick / 10) % 2) === 0) {
        lctx.drawImage(energizerSprite, 20, chaseY + 3);
      }
      const px = 215 - (cycle / 4.8) * 192;
      lctx.drawImage(pacSprites[DIR_LEFT][chompIdx], Math.round(px), chaseY);
      for (let i = 0; i < 4; i++) {
        lctx.drawImage(
          ghostSprites[GHOST_DEFS[i].id][DIR_LEFT][skirtIdx],
          Math.round(px + 20 + i * 16),
          chaseY
        );
      }
    } else if (cycle < 9.8) {
      // Phase 2: Pac-Man eats power pellet and chases frightened ghosts back right!
      const t = (cycle - 4.8) / 5.0;
      const px = 23 + t * 205;
      lctx.drawImage(pacSprites[DIR_RIGHT][chompIdx], Math.round(px), chaseY);
      for (let i = 0; i < 4; i++) {
        const gx = 42 + i * 18 + t * 142;
        if (px + 4 < gx) {
          const flash = t > 0.72 && (Math.floor(game.tick / 8) % 2 === 1);
          lctx.drawImage((flash ? ghostFrightWhite : ghostFrightBlue)[skirtIdx], Math.round(gx), chaseY);
        } else if (px < gx + 22) {
          drawMiniNumber(lctx, 200 * (1 << i), gx + 7, chaseY + 7, PALETTE.cyan);
        }
      }
    }

    // Pellet point legend
    lctx.fillStyle = PALETTE.pellet;
    lctx.fillRect(10 * 8 + 3, 24 * 8 + 3, 2, 2);
    drawText(lctx, "10 PTS", 12, 24, PALETTE.white);

    if ((Math.floor(game.tick / 10) % 2) === 0) {
      lctx.drawImage(energizerSprite, 10 * 8, 26 * 8);
    }
    drawText(lctx, "50 PTS", 12, 26, PALETTE.white);

    // Blinking Start prompt
    if ((Math.floor(game.tick / 24) % 2) === 0) {
      drawText(lctx, "PRESS ENTER OR SPACE", 4, 30, PALETTE.orange);
    }
    drawText(lctx, "ARROWS / WASD TO MOVE", 3, 32, PALETTE.cyan);
    drawText(lctx, "* 1980 NAMCO STYLE TRIBUTE", 1, 34, PALETTE.pink);
  }

  function drawPlayfield() {
    drawHudScores();

    // Maze walls (flashes alternating white/blue during level clear)
    let useWhiteMaze = false;
    if (game.state === STATE.LEVEL_CLEAR && game.stateTimer < 1.75) {
      useWhiteMaze = (Math.floor((1.75 - game.stateTimer) / 0.21) % 2) === 1;
    }
    lctx.drawImage(useWhiteMaze ? mazeWhite : mazeBlue, 0, MAZE_Y_OFFSET * TILE);

    drawPellets();

    // Bonus Fruit or Fruit Score Popup below Ghost House
    const fx = Math.round(14.0 * TILE - 7);
    const fy = Math.round((17.5 + MAZE_Y_OFFSET) * TILE - 7);
    if (game.fruit) {
      lctx.drawImage(fruitSprites[game.fruit.id], fx, fy);
    } else if (game.fruitPopup) {
      drawMiniNumber(lctx, game.fruitPopup.pts, 14.0 * TILE, (17.5 + MAZE_Y_OFFSET) * TILE, PALETTE.pink);
    }

    // Intro / Ready / Game Over text inside maze corridors
    if (game.state === STATE.INTRO) {
      if (game.stateTimer > 2.1 && game.lives === 3) {
        drawText(lctx, "PLAYER ONE", 9, 14, PALETTE.cyan);
      }
      drawText(lctx, "READY!", 11, 20, PALETTE.yellow);
      if (game.stateTimer <= 2.1) {
        drawPacManEntity();
        for (const g of ghosts) drawGhostEntity(g);
      }
    } else if (game.state === STATE.READY) {
      drawText(lctx, "READY!", 11, 20, PALETTE.yellow);
      drawPacManEntity();
      for (const g of ghosts) drawGhostEntity(g);
    } else if (game.state === STATE.GAME_OVER) {
      drawText(lctx, "GAME  OVER", 9, 20, PALETTE.red);
    } else if (game.state === STATE.DYING) {
      if (game.stateTimer > 1.40) {
        // Initial freeze before ghosts vanish
        drawPacManEntity();
        for (const g of ghosts) drawGhostEntity(g);
      } else {
        // 11-frame death animation + brief empty beat
        const elapsed = 1.40 - game.stateTimer;
        const idx = Math.floor(elapsed / 0.105);
        if (idx >= 0 && idx < pacDeathFrames.length) {
          const px = Math.round(pac.x * TILE - 7);
          const py = Math.round((pac.y + MAZE_Y_OFFSET) * TILE - 7);
          lctx.drawImage(pacDeathFrames[idx], px, py);
        }
      }
    } else if (game.state === STATE.LEVEL_CLEAR) {
      drawPacManEntity();
      if (game.stateTimer >= 1.75) {
        for (const g of ghosts) drawGhostEntity(g);
      }
    } else if (game.state === STATE.EAT_FREEZE) {
      for (const g of ghosts) {
        if (!game.eatPopup || g.id !== game.eatPopup.ghostId) {
          drawGhostEntity(g);
        }
      }
      if (game.eatPopup) {
        drawMiniNumber(
          lctx,
          game.eatPopup.pts,
          game.eatPopup.x * TILE,
          (game.eatPopup.y + MAZE_Y_OFFSET) * TILE,
          PALETTE.cyan
        );
      }
    } else {
      // Normal PLAYING state
      drawPacManEntity();
      for (const g of ghosts) drawGhostEntity(g);
    }

    drawBottomHud();

    // Pause Modal Banner
    if (game.paused) {
      lctx.fillStyle = "rgba(0, 0, 0, 0.72)";
      lctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

      lctx.fillStyle = "#080a1c";
      lctx.fillRect(36, 114, 152, 54);
      lctx.strokeStyle = PALETTE.wall;
      lctx.lineWidth = 2;
      lctx.strokeRect(37, 115, 150, 52);

      drawText(lctx, "PAUSED", 11, 16, PALETTE.yellow);
      drawTextPx(lctx, "PRESS P OR ESC", 56, 146, PALETTE.white);
    }
  }

  function render() {
    lctx.fillStyle = PALETTE.black;
    lctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

    if (game.state === STATE.TITLE) {
      drawTitleScreen();
    } else {
      drawPlayfield();
    }

    // Crisp 3x nearest-neighbor upscale to screen canvas
    sctx.imageSmoothingEnabled = false;
    sctx.drawImage(logicalBuf, 0, 0, LOGICAL_W * SCALE, LOGICAL_H * SCALE);
  }

  // =========================================================================
  // 13. CONTROLS, KEYBOARD, POINTER SWIPE/CLICK & UI BUTTONS
  // =========================================================================
  const KEY_TO_DIR = {
    ArrowUp:    DIR_UP,    KeyW: DIR_UP,    w: DIR_UP,    W: DIR_UP,
    ArrowLeft:  DIR_LEFT,  KeyA: DIR_LEFT,  a: DIR_LEFT,  A: DIR_LEFT,
    ArrowDown:  DIR_DOWN,  KeyS: DIR_DOWN,  s: DIR_DOWN,  S: DIR_DOWN,
    ArrowRight: DIR_RIGHT, KeyD: DIR_RIGHT, d: DIR_RIGHT, D: DIR_RIGHT
  };

  const bezelEl = document.getElementById("bezel");
  const btnPause = document.getElementById("btnPause");
  const btnSound = document.getElementById("btnSound");
  const btnCrt = document.getElementById("btnCrt");
  const btnRestart = document.getElementById("btnRestart");

  function syncUiButtons() {
    btnPause.textContent = game.paused ? "RESUME" : "PAUSE";
    btnPause.classList.toggle("active", game.paused);

    btnSound.textContent = audio.muted ? "SOUND: OFF" : "SOUND: ON";
    btnSound.classList.toggle("active", !audio.muted);

    btnCrt.textContent = game.crtOn ? "CRT: ON" : "CRT: OFF";
    btnCrt.classList.toggle("active", game.crtOn);
    bezelEl.classList.toggle("crt-on", game.crtOn);
  }

  function togglePause() {
    if (game.state === STATE.TITLE || game.state === STATE.GAME_OVER) return;
    game.paused = !game.paused;
    if (game.paused) {
      audio.stopBg();
      if (audio.ctx && audio.ctx.state === "running" && game.state === STATE.INTRO) {
        audio.ctx.suspend().catch(() => {});
      }
    } else if (audio.ctx && audio.ctx.state === "suspended") {
      audio.ctx.resume().catch(() => {});
    }
    syncUiButtons();
  }

  function pushDirectionInput(dir) {
    const idx = input.heldDirs.indexOf(dir);
    if (idx !== -1) input.heldDirs.splice(idx, 1);
    input.heldDirs.unshift(dir);
    input.bufferedDir = dir;
    input.bufferedTimer = 0.34;
  }

  function releaseDirectionInput(dir) {
    const idx = input.heldDirs.indexOf(dir);
    if (idx !== -1) input.heldDirs.splice(idx, 1);
  }

  window.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    audio.unlock();

    const k = e.code || e.key;
    const mappedDir = KEY_TO_DIR[e.code] !== undefined ? KEY_TO_DIR[e.code] : KEY_TO_DIR[e.key];

    if (mappedDir !== undefined) {
      e.preventDefault();
      if (!e.repeat) {
        pushDirectionInput(mappedDir);
        if (game.state === STATE.TITLE) {
          startNewGame();
        } else if (game.paused) {
          togglePause();
        }
      } else {
        input.bufferedDir = mappedDir;
        input.bufferedTimer = 0.34;
      }
      return;
    }

    if (k === "Enter" || k === "Space" || e.key === " ") {
      e.preventDefault();
      if (e.repeat) return;
      if (game.state === STATE.TITLE || game.state === STATE.GAME_OVER) {
        startNewGame();
      } else if (game.state === STATE.INTRO && game.stateTimer < 3.85) {
        audio.stopIntro();
        game.state = STATE.PLAYING;
      } else if (game.paused) {
        togglePause();
      }
      return;
    }

    if (k === "KeyP" || e.key === "p" || e.key === "P" || k === "Escape") {
      e.preventDefault();
      togglePause();
      return;
    }

    if (k === "KeyM" || e.key === "m" || e.key === "M") {
      e.preventDefault();
      audio.setMuted(!audio.muted);
      syncUiButtons();
      return;
    }

    if (k === "KeyC" || e.key === "c" || e.key === "C") {
      e.preventDefault();
      game.crtOn = !game.crtOn;
      saveStored("pacman_crt", game.crtOn ? "1" : "0");
      syncUiButtons();
      return;
    }

    if (k === "KeyR" || e.key === "r" || e.key === "R") {
      e.preventDefault();
      startNewGame();
    }
  });

  window.addEventListener("keyup", (e) => {
    const mappedDir = KEY_TO_DIR[e.code] !== undefined ? KEY_TO_DIR[e.code] : KEY_TO_DIR[e.key];
    if (mappedDir !== undefined) {
      releaseDirectionInput(mappedDir);
    }
  });

  // Auto-pause if window loses focus mid-game so player never loses a life unfairly
  window.addEventListener("blur", () => {
    input.heldDirs.length = 0;
    if (game.state === STATE.PLAYING && !game.paused) {
      togglePause();
    }
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden && game.state === STATE.PLAYING && !game.paused) {
      togglePause();
    }
  });

  // Click / Touch / Swipe support on the arcade screen
  let pointerStart = null;
  screenCanvas.addEventListener("pointerdown", (e) => {
    audio.unlock();
    if (game.state === STATE.TITLE || game.state === STATE.GAME_OVER) {
      startNewGame();
      return;
    }
    if (game.paused) {
      togglePause();
      return;
    }
    pointerStart = { x: e.clientX, y: e.clientY };
  });

  screenCanvas.addEventListener("pointermove", (e) => {
    if (!pointerStart) return;
    const dx = e.clientX - pointerStart.x;
    const dy = e.clientY - pointerStart.y;
    if (Math.hypot(dx, dy) >= 18) {
      const dir = Math.abs(dx) > Math.abs(dy)
        ? (dx > 0 ? DIR_RIGHT : DIR_LEFT)
        : (dy > 0 ? DIR_DOWN : DIR_UP);
      input.bufferedDir = dir;
      input.bufferedTimer = 0.45;
      pointerStart = { x: e.clientX, y: e.clientY };
    }
  });

  window.addEventListener("pointerup", () => {
    pointerStart = null;
  });

  btnPause.addEventListener("click", () => {
    audio.unlock();
    togglePause();
    btnPause.blur();
  });

  btnSound.addEventListener("click", () => {
    audio.unlock();
    audio.setMuted(!audio.muted);
    syncUiButtons();
    btnSound.blur();
  });

  btnCrt.addEventListener("click", () => {
    game.crtOn = !game.crtOn;
    saveStored("pacman_crt", game.crtOn ? "1" : "0");
    syncUiButtons();
    btnCrt.blur();
  });

  btnRestart.addEventListener("click", () => {
    audio.unlock();
    startNewGame();
    btnRestart.blur();
  });

  // =========================================================================
  // 14. MAIN 60 HZ FIXED-TIMESTEP GAME LOOP
  // =========================================================================
  resetPelletGrid();
  syncUiButtons();
  render();

  const FIXED_DT = 1 / 60;
  let lastTime = performance.now();
  let accumulator = 0;

  function frameLoop(now) {
    const rawDt = Math.min(0.1, Math.max(0, (now - lastTime) / 1000));
    lastTime = now;
    accumulator += rawDt;

    while (accumulator >= FIXED_DT) {
      updateSimulation(FIXED_DT);
      accumulator -= FIXED_DT;
    }

    render();
    window.requestAnimationFrame(frameLoop);
  }

  window.requestAnimationFrame(frameLoop);
})();
</script>
</body>
</html>
