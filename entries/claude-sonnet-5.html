<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pac-Man</title>
<style>
  html,body{
    margin:0; height:100%; background:#000;
    display:flex; align-items:center; justify-content:center;
    font-family:'Courier New',monospace; color:#fff;
    -webkit-user-select:none; user-select:none;
  }
  #game{ display:flex; flex-direction:column; align-items:center; }
  #hud{
    width:100%; max-width:456px; display:flex; justify-content:space-between;
    box-sizing:border-box; padding:6px 4px; font-size:16px; letter-spacing:1px;
  }
  #hud span#score{ color:#fff; }
  #hud span#lives{ color:#ff5555; }
  #hud span#level{ color:#55ffff; }
  #stage{ position:relative; }
  canvas{ background:#000; display:block; image-rendering:pixelated; }
  #overlay{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,0.75); text-align:center; padding:20px; box-sizing:border-box;
  }
  #overlay.hidden{ display:none; }
  #overlayContent h1{ color:#ffe600; font-size:28px; margin:0 0 10px; text-shadow:2px 2px #003; }
  #overlayContent p{ margin:6px 0; font-size:14px; line-height:1.5; }
  #overlayContent .hint{ color:#aaa; font-size:12px; margin-top:14px; }
  #touch{
    display:none; grid-template-columns:56px 56px 56px; grid-template-rows:56px 56px 56px;
    gap:4px; margin-top:14px;
  }
  #touch button{
    width:56px; height:56px; border-radius:10px; border:2px solid #4444ff;
    background:#111; color:#fff; font-size:22px; touch-action:none;
  }
  #touch button:active{ background:#333; }
  @media (pointer:coarse){ #touch{ display:grid; } }
  .g-up{ grid-column:2; grid-row:1; }
  .g-left{ grid-column:1; grid-row:2; }
  .g-right{ grid-column:3; grid-row:2; }
  .g-down{ grid-column:2; grid-row:3; }
</style>
</head>
<body>
<div id="game">
  <div id="hud">
    <span id="score">Score: 0</span>
    <span id="level">Level 1</span>
    <span id="lives">Lives: 3</span>
  </div>
  <div id="stage">
    <canvas id="canvas"></canvas>
    <div id="overlay">
      <div id="overlayContent">
        <h1>PAC-MAN</h1>
        <p>Arrow keys / WASD to move.</p>
        <p class="hint">Press ENTER or tap here to start</p>
      </div>
    </div>
  </div>
  <div id="touch">
    <button class="g-up" data-dir="up">&#8593;</button>
    <button class="g-left" data-dir="left">&#8592;</button>
    <button class="g-right" data-dir="right">&#8594;</button>
    <button class="g-down" data-dir="down">&#8595;</button>
  </div>
</div>
<script>
(function(){
  "use strict";

  var CELL = 24, COLS = 19, ROWS = 21;
  var CANVAS_W = COLS*CELL, CANVAS_H = ROWS*CELL;

  var canvas = document.getElementById('canvas');
  canvas.width = CANVAS_W; canvas.height = CANVAS_H;
  var ctx = canvas.getContext('2d');
  var overlay = document.getElementById('overlay');
  var overlayContent = document.getElementById('overlayContent');
  var scoreEl = document.getElementById('score');
  var livesEl = document.getElementById('lives');
  var levelEl = document.getElementById('level');

  var DIRS = {
    up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0}
  };
  function opposite(d){
    return d==='up'?'down':d==='down'?'up':d==='left'?'right':d==='right'?'left':null;
  }

  var HOUSE = {r0:9,r1:11,c0:8,c1:10};

  // Pillar-maze construction: walls only ever sit at (odd row, odd col).
  // No two such cells are ever 4-directionally adjacent (adjacency always flips exactly
  // one coordinate's parity), so removing them from a full grid can never cut it in two -
  // the whole floor stays one connected room dotted with pillars, guaranteed walkable.
  function buildMaze(){
    var g = [];
    for(var r=0;r<ROWS;r++){ g.push(new Array(COLS).fill(2)); }
    var midRow = Math.floor(ROWS/2);
    for(var r=0;r<ROWS;r++){
      for(var c=0;c<COLS;c++){
        if(r===0||r===ROWS-1||c===0||c===COLS-1){
          g[r][c] = (r===midRow && (c===0||c===COLS-1)) ? 1 : 0;
        } else if(r%2===1 && c%2===1){
          g[r][c] = 0;
        }
      }
    }
    for(var r2=HOUSE.r0;r2<=HOUSE.r1;r2++){
      for(var c2=HOUSE.c0;c2<=HOUSE.c1;c2++){ g[r2][c2] = 1; }
    }
    for(var c3=HOUSE.c0;c3<=HOUSE.c1;c3++){ g[HOUSE.r0][c3]=0; g[HOUSE.r1][c3]=0; }
    for(var r3=HOUSE.r0;r3<=HOUSE.r1;r3++){ g[r3][HOUSE.c0]=0; g[r3][HOUSE.c1]=0; }
    g[HOUSE.r0][9] = 1; // gate

    [[2,1],[2,COLS-2],[ROWS-3,1],[ROWS-3,COLS-2]].forEach(function(p){
      g[p[0]][p[1]] = 3;
    });

    g[16][9] = 1; // pac-man start tile, no pellet under the spawn

    return g;
  }

  var grid, pelletsTotal, pelletsRemaining;

  function countPellets(){
    var n = 0;
    for(var r=0;r<ROWS;r++) for(var c=0;c<COLS;c++) if(grid[r][c]===2||grid[r][c]===3) n++;
    return n;
  }

  function wrapCol(c){ return ((c%COLS)+COLS)%COLS; }
  function wrapRow(r){ return ((r%ROWS)+ROWS)%ROWS; }
  function isOpen(r,c){ return grid[wrapRow(r)][wrapCol(c)] !== 0; }
  function colOf(x){ return Math.round(x/CELL); }
  function rowOf(y){ return Math.round(y/CELL); }
  function aligned(x,y){ return Math.abs(x - Math.round(x/CELL)*CELL) < 0.001 && Math.abs(y - Math.round(y/CELL)*CELL) < 0.001; }

  var PACMAN_START = {r:16,c:9};
  var GHOST_DEFS = [
    {name:'blinky', color:'#ff2222', start:{r:8,c:9},  scatter:{r:1,c:COLS-2},   release:0},
    {name:'pinky',  color:'#ffb8ff', start:{r:10,c:9}, scatter:{r:1,c:1},        release:3000},
    {name:'inky',   color:'#00ffff', start:{r:10,c:8}, scatter:{r:ROWS-2,c:COLS-2}, release:7000},
    {name:'clyde',  color:'#ffb852', start:{r:10,c:10},scatter:{r:ROWS-2,c:1},   release:11000}
  ];

  var SCHEDULE = [
    {mode:'scatter', dur:7000},
    {mode:'chase',   dur:20000},
    {mode:'scatter', dur:7000},
    {mode:'chase',   dur:20000},
    {mode:'scatter', dur:5000},
    {mode:'chase',   dur:1e9}
  ];

  var BASE_PACMAN_SPEED = 3, BASE_GHOST_SPEED = 2, FRIGHTENED_SPEED = 1.2, EATEN_SPEED = 4.5;
  var FRIGHTENED_MS = 7000;

  var state, stateTimer, score, lives, level, comboMultiplier;
  var pacman, ghosts, frightenedTimer, scheduleIdx, scheduleTimer, animClock;

  function freshPacman(){
    return {
      x: PACMAN_START.c*CELL, y: PACMAN_START.r*CELL,
      dir: null, nextDir: null, speed: BASE_PACMAN_SPEED,
      mouth: 0, mouthDir: 1, alive:true
    };
  }

  function freshGhosts(){
    return GHOST_DEFS.map(function(d){
      return {
        name:d.name, color:d.color, scatter:d.scatter, release:d.release,
        x:d.start.c*CELL, y:d.start.r*CELL,
        startX:d.start.c*CELL, startY:d.start.r*CELL,
        dir:'up',
        state: d.release===0 ? 'active' : 'house',
        speed: BASE_GHOST_SPEED
      };
    });
  }

  function resetPositions(){
    pacman = freshPacman();
    ghosts = freshGhosts();
    frightenedTimer = 0;
    comboMultiplier = 1;
    scheduleIdx = 0; scheduleTimer = 0;
  }

  function newGame(){
    grid = buildMaze();
    pelletsTotal = countPellets();
    pelletsRemaining = pelletsTotal;
    score = 0; lives = 3; level = 1;
    resetPositions();
    updateHud();
    goReady();
  }

  function nextLevel(){
    grid = buildMaze();
    pelletsTotal = countPellets();
    pelletsRemaining = pelletsTotal;
    level++;
    BASE_GHOST_SPEED = Math.min(3.2, BASE_GHOST_SPEED + 0.15);
    resetPositions();
    updateHud();
    goReady();
  }

  function goReady(){
    state = 'ready'; stateTimer = 0;
    showOverlay('READY!', '', '');
  }

  function showOverlay(title, p1, hint){
    overlayContent.innerHTML =
      '<h1>'+title+'</h1>' +
      (p1 ? '<p>'+p1+'</p>' : '') +
      (hint ? '<p class="hint">'+hint+'</p>' : '');
    overlay.classList.remove('hidden');
  }
  function hideOverlay(){ overlay.classList.add('hidden'); }

  function updateHud(){
    scoreEl.textContent = 'Score: '+score;
    livesEl.textContent = 'Lives: '+Math.max(lives,0);
    levelEl.textContent = 'Level '+level;
  }

  // ---- input ----
  var KEYMAP = {
    ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
    w:'up', s:'down', a:'left', d:'right',
    W:'up', S:'down', A:'left', D:'right'
  };

  function requestDir(d){
    if(!d) return;
    pacman.nextDir = d;
  }

  window.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
      if(state==='start' || state==='gameover'){ newGame(); state='ready'; goReady(); }
      e.preventDefault();
      return;
    }
    if(e.key === ' ' ){
      if(state==='playing'){ state='paused'; showOverlay('PAUSED','', 'Press SPACE to resume'); }
      else if(state==='paused'){ state='playing'; hideOverlay(); }
      e.preventDefault();
      return;
    }
    var d = KEYMAP[e.key];
    if(d){
      requestDir(d);
      if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.key)>=0) e.preventDefault();
    }
  });

  document.querySelectorAll('#touch button').forEach(function(btn){
    btn.addEventListener('touchstart', function(e){ e.preventDefault(); requestDir(btn.dataset.dir); }, {passive:false});
    btn.addEventListener('click', function(){ requestDir(btn.dataset.dir); });
  });

  overlay.addEventListener('click', function(){
    if(state==='start' || state==='gameover'){ newGame(); }
  });

  // ---- movement helpers ----
  function neighborCell(r,c,dir){
    var v = DIRS[dir];
    return {r:r+v.y, c:c+v.x};
  }

  function pickDirections(r,c,excludeReverse){
    var out = [];
    for(var d in DIRS){
      if(excludeReverse && d===excludeReverse) continue;
      var n = neighborCell(r,c,d);
      if(isOpen(n.r,n.c)) out.push(d);
    }
    return out;
  }

  function wrapEntityX(ent){
    if(ent.x < -CELL/2) ent.x += CANVAS_W;
    else if(ent.x > CANVAS_W - CELL/2) ent.x -= CANVAS_W;
  }

  // ---- pacman update ----
  function updatePacman(){
    if(aligned(pacman.x, pacman.y)){
      var r = rowOf(pacman.y), c = colOf(pacman.x);
      if(pacman.nextDir){
        var n = neighborCell(r,c,pacman.nextDir);
        if(isOpen(n.r,n.c)){ pacman.dir = pacman.nextDir; }
      }
      if(pacman.dir){
        var n2 = neighborCell(r,c,pacman.dir);
        if(!isOpen(n2.r,n2.c)) pacman.dir = null;
      }
      eatAt(r,c);
    }
    if(pacman.dir){
      var v = DIRS[pacman.dir];
      pacman.x += v.x*pacman.speed;
      pacman.y += v.y*pacman.speed;
      wrapEntityX(pacman);
    }
  }

  function eatAt(r,c){
    var v = grid[r][c];
    if(v===2){
      grid[r][c]=1; score+=10; pelletsRemaining--;
    } else if(v===3){
      grid[r][c]=1; score+=50; pelletsRemaining--;
      triggerFrightened();
    }
    updateHud();
    if(pelletsRemaining<=0){ startLevelComplete(); }
  }

  function triggerFrightened(){
    frightenedTimer = FRIGHTENED_MS;
    comboMultiplier = 1;
    ghosts.forEach(function(g){
      if(g.state==='active' || g.state==='frightened'){
        g.state = 'frightened';
        g.dir = opposite(g.dir) || g.dir;
      }
    });
  }

  // ---- ghost targeting ----
  function ghostInHouse(g){
    var r = rowOf(g.y), c = colOf(g.x);
    return r>=HOUSE.r0 && r<=HOUSE.r1 && c>=HOUSE.c0-1 && c<=HOUSE.c1+1 && r<=10;
  }

  function getTarget(g){
    var r = rowOf(g.y), c = colOf(g.x);
    if(g.state==='eaten'){
      if(r>=HOUSE.r0 && r<=HOUSE.r1 && c>=8 && c<=10) return null;
      return {r:HOUSE.r1-1, c:9};
    }
    if(r>=HOUSE.r0 && r<=HOUSE.r1+0 && c>=8 && c<=10 && g.state!=='house'){
      return {r:HOUSE.r0-1, c:9};
    }
    if(g.state==='frightened') return null;
    if(g.state==='scatter') return g.scatter;
    var pr = rowOf(pacman.y), pc = colOf(pacman.x);
    if(g.name==='pinky' && pacman.dir){
      var v = DIRS[pacman.dir];
      return {r: pr+v.y*4, c: pc+v.x*4};
    }
    return {r:pr, c:pc};
  }

  function ghostSpeed(g){
    if(g.state==='eaten') return EATEN_SPEED;
    if(g.state==='frightened') return FRIGHTENED_SPEED;
    return BASE_GHOST_SPEED;
  }

  function updateGhostMode(g){
    if(g.state==='house'){
      if(scheduleTimer===undefined) return;
      if(elapsedSinceStart >= g.release){
        g.state = SCHEDULE[scheduleIdx].mode;
      }
      return;
    }
    if(g.state==='frightened' || g.state==='eaten') return;
    g.state = SCHEDULE[scheduleIdx].mode;
  }

  var elapsedSinceStart = 0;

  function updateSchedule(dt){
    elapsedSinceStart += dt;
    if(frightenedTimer>0) return;
    scheduleTimer += dt;
    if(scheduleTimer > SCHEDULE[scheduleIdx].dur && scheduleIdx < SCHEDULE.length-1){
      scheduleIdx++; scheduleTimer = 0;
      ghosts.forEach(function(g){
        if(g.state==='active'||g.state==='scatter'||g.state==='chase'){
          g.state = SCHEDULE[scheduleIdx].mode;
        }
      });
    }
  }

  function updateGhost(g, dt){
    if(g.state==='house'){
      if(elapsedSinceStart >= g.release){
        g.state = SCHEDULE[scheduleIdx].mode;
      } else {
        g.y += Math.sin(animClock/150)*0.3;
        return;
      }
    }

    if(aligned(g.x,g.y)){
      var r = rowOf(g.y), c = colOf(g.x);
      var target = getTarget(g);
      var candidates = pickDirections(r,c, opposite(g.dir));
      if(candidates.length===0) candidates = pickDirections(r,c,null);

      var chosen;
      if(target===null){
        chosen = candidates[Math.floor(Math.random()*candidates.length)];
      } else {
        var best = Infinity;
        candidates.forEach(function(d){
          var n = neighborCell(r,c,d);
          var dist = (n.r-target.r)*(n.r-target.r) + (n.c-target.c)*(n.c-target.c);
          if(dist < best){ best = dist; chosen = d; }
        });
      }
      g.dir = chosen || g.dir;

      if(g.state==='eaten' && r===HOUSE.r1-1 && c===9){
        g.state = SCHEDULE[scheduleIdx].mode;
      }
    }

    g.speed = ghostSpeed(g);
    if(g.dir){
      var v = DIRS[g.dir];
      g.x += v.x*g.speed;
      g.y += v.y*g.speed;
      wrapEntityX(g);
    }
  }

  function updateFrightenedTimer(dt){
    if(frightenedTimer>0){
      frightenedTimer -= dt;
      if(frightenedTimer<=0){
        frightenedTimer = 0;
        ghosts.forEach(function(g){
          if(g.state==='frightened') g.state = SCHEDULE[scheduleIdx].mode;
        });
      }
    }
  }

  function checkCollisions(){
    ghosts.forEach(function(g){
      var dx = Math.abs(g.x-pacman.x), dy = Math.abs(g.y-pacman.y);
      if(dx < CELL*0.6 && dy < CELL*0.6){
        if(g.state==='frightened'){
          score += 200*comboMultiplier;
          comboMultiplier *= 2;
          g.state = 'eaten';
          updateHud();
        } else if(g.state!=='eaten' && g.state!=='house'){
          loseLife();
        }
      }
    });
  }

  function loseLife(){
    lives--;
    updateHud();
    if(lives < 0){
      state = 'gameover';
      showOverlay('GAME OVER', 'Score: '+score, 'Press ENTER or tap to restart');
      return;
    }
    resetPositions();
    goReady();
  }

  function startLevelComplete(){
    state = 'levelcomplete';
    stateTimer = 0;
    showOverlay('LEVEL COMPLETE', 'Score: '+score, 'Get ready...');
  }

  // ---- main update ----
  function update(dt){
    animClock += dt;
    updateSchedule(dt);
    updateFrightenedTimer(dt);
    updatePacman();
    ghosts.forEach(function(g){ updateGhost(g, dt); });
    checkCollisions();
  }

  // ---- rendering ----
  function drawMaze(){
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
    for(var r=0;r<ROWS;r++){
      for(var c=0;c<COLS;c++){
        var v = grid[r][c];
        var x = c*CELL, y = r*CELL;
        if(v===0){
          ctx.fillStyle = '#1919c9';
          ctx.beginPath();
          if(r%2===1 && c%2===1){
            ctx.arc(x+CELL/2, y+CELL/2, CELL*0.46, 0, Math.PI*2);
          } else {
            ctx.rect(x+1,y+1,CELL-2,CELL-2);
          }
          ctx.fill();
        } else if(v===2){
          ctx.fillStyle = '#ffd7a8';
          ctx.beginPath();
          ctx.arc(x+CELL/2, y+CELL/2, 2.5, 0, Math.PI*2);
          ctx.fill();
        } else if(v===3){
          var pulse = 5 + Math.sin(animClock/120)*2;
          ctx.fillStyle = '#ffd7a8';
          ctx.beginPath();
          ctx.arc(x+CELL/2, y+CELL/2, pulse, 0, Math.PI*2);
          ctx.fill();
        }
      }
    }
  }

  function drawPacman(){
    var cx = pacman.x+CELL/2, cy = pacman.y+CELL/2;
    var radius = CELL/2 - 1;
    if(pacman.dir){
      pacman.mouth += pacman.mouthDir*0.09;
      if(pacman.mouth>0.9){ pacman.mouth=0.9; pacman.mouthDir=-1; }
      if(pacman.mouth<0.05){ pacman.mouth=0.05; pacman.mouthDir=1; }
    } else {
      pacman.mouth = 0.4;
    }
    var angle = {up:1.5, down:0.5, left:1, right:0}[pacman.dir||'right'] * Math.PI;
    var open = pacman.mouth*Math.PI*0.6;
    ctx.fillStyle = '#ffe600';
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,radius, angle+open, angle-open+Math.PI*2);
    ctx.closePath();
    ctx.fill();
  }

  function drawGhost(g){
    var cx = g.x+CELL/2, cy = g.y+CELL/2;
    var r = CELL/2 - 1;

    if(g.state==='eaten'){
      drawEyes(cx,cy,g.dir,r);
      return;
    }

    var color = g.color;
    if(g.state==='frightened'){
      color = (frightenedTimer<2000 && Math.floor(animClock/200)%2===0) ? '#ffffff' : '#2222ff';
    }

    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(cx, cy-2, r, Math.PI, 0);
    ctx.lineTo(cx+r, cy+r);
    var waves = 4, step = (r*2)/waves;
    for(var i=0;i<waves;i++){
      var wx = cx+r - step*(i+0.5);
      ctx.lineTo(wx, cy + (i%2===0? r-4 : r+2));
    }
    ctx.lineTo(cx-r, cy+r);
    ctx.closePath();
    ctx.fill();

    if(g.state!=='frightened'){
      drawEyes(cx,cy,g.dir,r);
    } else {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(cx-4,cy-2,2.2,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+4,cy-2,2.2,0,Math.PI*2); ctx.fill();
    }
  }

  function drawEyes(cx,cy,dir,r){
    var off = {up:{x:0,y:-3},down:{x:0,y:3},left:{x:-3,y:0},right:{x:3,y:0}}[dir||'right'];
    [-4,4].forEach(function(ex){
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(cx+ex, cy-2, 3.4, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#2222aa';
      ctx.beginPath(); ctx.arc(cx+ex+off.x*0.6, cy-2+off.y*0.6, 1.6, 0, Math.PI*2); ctx.fill();
    });
  }

  function draw(){
    drawMaze();
    ghosts.forEach(drawGhost);
    if(pacman.alive) drawPacman();
  }

  // ---- main loop ----
  var lastTime = null;
  function loop(t){
    if(lastTime===null) lastTime = t;
    var dt = Math.min(t-lastTime, 40);
    lastTime = t;

    if(state==='playing'){
      update(dt);
    } else if(state==='ready'){
      stateTimer += dt;
      if(stateTimer>1200){ state='playing'; hideOverlay(); }
    } else if(state==='levelcomplete'){
      stateTimer += dt;
      if(stateTimer>1800){ nextLevel(); state='ready'; }
    }

    draw();
    requestAnimationFrame(loop);
  }

  // ---- boot ----
  state = 'start';
  grid = buildMaze();
  pelletsTotal = countPellets();
  pelletsRemaining = pelletsTotal;
  score=0; lives=3; level=1;
  resetPositions();
  updateHud();
  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
