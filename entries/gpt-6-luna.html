<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b19">
  <title>Pac-Man — Neon Maze</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7f4e9;
      --muted: #8d98b6;
      --blue: #35a8ff;
      --panel: #10182b;
      --yellow: #ffdf35;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 18px 40px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 25%, #152044 0, #0b1021 42%, #070b19 78%),
        #070b19;
      font-family: ui-rounded, "SF Pro Rounded", "Trebuchet MS", system-ui, sans-serif;
    }
    .game-shell { width: min(100%, 572px); }
    .eyebrow {
      margin: 0 0 8px;
      color: #8d9cbe;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .24em;
      text-align: center;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 22px;
      color: var(--yellow);
      font-size: clamp(36px, 9vw, 54px);
      font-weight: 1000;
      letter-spacing: .09em;
      line-height: 1;
      text-align: center;
      text-shadow: 0 0 9px #ffe75d88, 0 4px 0 #bc7c17;
    }
    .scorebar {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      align-items: center;
      gap: 12px;
      margin: 0 5px 12px;
    }
    .stat { min-width: 0; }
    .stat:nth-child(2) { text-align: center; }
    .stat:nth-child(3) { text-align: right; }
    .stat-label {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    .stat-value { font-size: 17px; font-variant-numeric: tabular-nums; font-weight: 900; }
    .lives { color: var(--yellow); letter-spacing: .14em; }
    .cabinet {
      position: relative;
      padding: 10px;
      border: 1px solid #26375d;
      border-radius: 15px;
      background: linear-gradient(145deg, #131d36, #0b1226 65%);
      box-shadow: 0 18px 55px #0008, inset 0 1px #ffffff0d, 0 0 34px #2469d51a;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
      background: #050916;
      image-rendering: pixelated;
    }
    .screen-overlay {
      position: absolute;
      inset: 10px;
      display: grid;
      place-items: center;
      padding: 24px;
      border-radius: 8px;
      background: #050916b8;
      text-align: center;
      backdrop-filter: blur(2px);
    }
    .screen-overlay[hidden] { display: none; }
    .overlay-card { max-width: 310px; }
    .overlay-kicker {
      margin: 0 0 7px;
      color: var(--yellow);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    .overlay-title {
      margin: 0 0 9px;
      font-size: clamp(26px, 7vw, 38px);
      font-weight: 1000;
      letter-spacing: .06em;
      text-shadow: 0 0 18px #39aaff66;
    }
    .overlay-copy { margin: 0 0 20px; color: #bdc7df; font-size: 14px; line-height: 1.5; }
    .start-button {
      min-width: 170px;
      padding: 12px 20px;
      border: 0;
      border-radius: 999px;
      color: #111523;
      background: var(--yellow);
      box-shadow: 0 4px 0 #ba851e, 0 0 24px #ffdf3555;
      font: inherit;
      font-size: 13px;
      font-weight: 1000;
      letter-spacing: .12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform .14s ease, filter .14s ease;
    }
    .start-button:hover { filter: brightness(1.09); transform: translateY(-1px); }
    .start-button:active { transform: translateY(2px); box-shadow: none; }
    .below-game {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin: 14px 4px 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .04em;
    }
    .keys { display: flex; align-items: center; gap: 5px; }
    kbd {
      min-width: 23px;
      padding: 4px 6px;
      border: 1px solid #303d5d;
      border-radius: 5px;
      color: #d8def0;
      background: #141e34;
      box-shadow: inset 0 -2px #080d1a;
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
      line-height: 1.1;
      text-align: center;
    }
    .mobile-controls {
      display: none;
      width: 174px;
      height: 122px;
      margin: 20px auto 0;
      grid-template: repeat(3, 1fr) / repeat(3, 1fr);
      gap: 5px;
      touch-action: none;
    }
    .mobile-controls button {
      border: 1px solid #34446a;
      border-radius: 12px;
      color: #e9edfa;
      background: linear-gradient(#1a2845, #111a30);
      box-shadow: 0 3px #080d1a;
      font: 800 18px/1 system-ui, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .mobile-controls button:active { transform: translateY(2px); box-shadow: none; }
    .mobile-controls [data-dir="up"] { grid-area: 1 / 2; }
    .mobile-controls [data-dir="left"] { grid-area: 2 / 1; }
    .mobile-controls [data-dir="down"] { grid-area: 2 / 2; }
    .mobile-controls [data-dir="right"] { grid-area: 2 / 3; }
    .mobile-controls [data-action="pause"] { grid-area: 3 / 2; font-size: 12px; letter-spacing: .04em; }
    @media (max-width: 620px) {
      body { padding: 22px 12px 28px; }
      h1 { margin-bottom: 18px; }
      .cabinet { padding: 7px; border-radius: 12px; }
      .screen-overlay { inset: 7px; }
      .mobile-controls { display: grid; }
      .below-game { justify-content: center; text-align: center; }
      .keys { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="game-shell">
    <p class="eyebrow">The classic arcade chase</p>
    <h1>PAC-MAN</h1>
    <section class="scorebar" aria-label="Game stats">
      <div class="stat"><span class="stat-label">Score</span><span class="stat-value" id="score">00000</span></div>
      <div class="stat"><span class="stat-label">Best</span><span class="stat-value" id="best">00000</span></div>
      <div class="stat"><span class="stat-label">Lives</span><span class="stat-value lives" id="lives">● ● ●</span></div>
    </section>
    <div class="cabinet">
      <canvas id="game" aria-label="Pac-Man maze game" role="img"></canvas>
      <div class="screen-overlay" id="overlay">
        <div class="overlay-card">
          <p class="overlay-kicker" id="overlay-kicker">Ready player one</p>
          <h2 class="overlay-title" id="overlay-title">READY?</h2>
          <p class="overlay-copy" id="overlay-copy">Clear the maze, grab the power pellets, and stay one step ahead.</p>
          <button class="start-button" id="start-button" type="button">Start game</button>
        </div>
      </div>
    </div>
    <div class="below-game">
      <span>Eat every dot. Avoid the ghosts.</span>
      <span class="keys"><kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd><span>or WASD · Space to pause</span></span>
    </div>
    <div class="mobile-controls" aria-label="Touch controls">
      <button type="button" data-dir="up" aria-label="Move up">▲</button>
      <button type="button" data-dir="left" aria-label="Move left">◀</button>
      <button type="button" data-dir="down" aria-label="Move down">▼</button>
      <button type="button" data-dir="right" aria-label="Move right">▶</button>
      <button type="button" data-action="pause" aria-label="Pause game">Ⅱ</button>
    </div>
  </main>
  <script>
    (() => {
      const sourceMap = [
        '###################',
        '#........#........#',
        '#.##.###.#.###.##.#',
        '#o##.###.#.###.##o#',
        '#.................#',
        '#.##.#.#######.#.##',
        '#....#...#...#....#',
        '####.###.#.###.####',
        '   #.#.......#.#   ',
        '####.#.##   ##.####',
        '     . #   # .     ',
        '####.#.#####.#.####',
        '   #.#.......#.#   ',
        '####.#.#####.#.####',
        '#........#........#',
        '#.##.###.#.###.##.#',
        '#o.#...........#.o#',
        '##.#.#.#######.#.##',
        '#....#...#...#....#',
        '#.########.##.##..#',
        '#.................#',
        '###################'
      ];
      const cellSize = 28;
      const columns = sourceMap[0].length;
      const rows = sourceMap.length;
      const stepDuration = 145;
      const directions = {
        up: { x: 0, y: -1 },
        down: { x: 0, y: 1 },
        left: { x: -1, y: 0 },
        right: { x: 1, y: 0 }
      };
      const opposite = { up: 'down', down: 'up', left: 'right', right: 'left' };
      const ghostStarts = [
        { x: 9, y: 9, color: '#ff5474', name: 'blush' },
        { x: 9, y: 10, color: '#50d8ff', name: 'sky' },
        { x: 10, y: 10, color: '#ff9c45', name: 'amber' },
        { x: 11, y: 10, color: '#db76ff', name: 'violet' }
      ];
      const canvas = document.querySelector('#game');
      const context = canvas.getContext('2d');
      const overlay = document.querySelector('#overlay');
      const scoreElement = document.querySelector('#score');
      const bestElement = document.querySelector('#best');
      const livesElement = document.querySelector('#lives');
      const startButton = document.querySelector('#start-button');
      let board;
      let player;
      let ghosts;
      let score = 0;
      let lives = 3;
      let best = 0;
      try { best = Number(localStorage.getItem('pacman-best') || 0); } catch (error) { best = 0; }
      let remainingDots = 0;
      let powerTicks = 0;
      let ghostCombo = 0;
      let respawnTicks = 0;
      let status = 'ready';
      let lastFrame = 0;
      let accumulator = 0;
      let animationFrame;

      canvas.width = columns * cellSize;
      canvas.height = rows * cellSize;

      function makePlayer() {
        return { x: 9, y: 16, previousX: 9, previousY: 16, direction: 'left', queuedDirection: 'left', mouth: 0.22 };
      }

      function makeGhost(start) {
        return {
          x: start.x, y: start.y, previousX: start.x, previousY: start.y,
          direction: 'left', color: start.color, name: start.name
        };
      }

      function resetBoard() {
        board = sourceMap.map(row => row.split(''));
        remainingDots = board.flat().filter(tile => tile === '.' || tile === 'o').length;
        player = makePlayer();
        ghosts = ghostStarts.map(makeGhost);
        powerTicks = 0;
        ghostCombo = 0;
        respawnTicks = 0;
      }

      function canMove(entity, direction) {
        const vector = directions[direction];
        if (!vector) return false;
        const nextX = entity.x + vector.x;
        const nextY = entity.y + vector.y;
        return nextX >= 0 && nextX < columns && nextY >= 0 && nextY < rows && board[nextY][nextX] !== '#';
      }

      function move(entity, direction) {
        entity.previousX = entity.x;
        entity.previousY = entity.y;
        entity.direction = direction;
        entity.x += directions[direction].x;
        entity.y += directions[direction].y;
      }

      function addScore(points) {
        score += points;
        if (score > best) {
          best = score;
          try { localStorage.setItem('pacman-best', String(best)); } catch (error) { best = score; }
        }
        updateStats();
      }

      function updateStats() {
        scoreElement.textContent = String(score).padStart(5, '0');
        bestElement.textContent = String(best).padStart(5, '0');
        livesElement.textContent = lives ? Array.from({ length: lives }, () => '●').join(' ') : '—';
      }

      function collectTile() {
        const tile = board[player.y][player.x];
        if (tile === '.') {
          board[player.y][player.x] = ' ';
          remainingDots -= 1;
          addScore(10);
        } else if (tile === 'o') {
          board[player.y][player.x] = ' ';
          remainingDots -= 1;
          powerTicks = 45;
          ghostCombo = 0;
          addScore(50);
        }
        if (remainingDots === 0) finishGame(true);
      }

      function ghostDistance(x, y) {
        const visited = Array.from({ length: rows }, () => Array(columns).fill(-1));
        const queue = [{ x, y }];
        visited[y][x] = 0;
        for (let index = 0; index < queue.length; index += 1) {
          const point = queue[index];
          if (point.x === player.x && point.y === player.y) return visited[point.y][point.x];
          for (const direction of Object.keys(directions)) {
            const vector = directions[direction];
            const nextX = point.x + vector.x;
            const nextY = point.y + vector.y;
            if (nextX < 0 || nextX >= columns || nextY < 0 || nextY >= rows || board[nextY][nextX] === '#' || visited[nextY][nextX] !== -1) continue;
            visited[nextY][nextX] = visited[point.y][point.x] + 1;
            queue.push({ x: nextX, y: nextY });
          }
        }
        return Infinity;
      }

      function moveGhost(ghost) {
        const possible = Object.keys(directions).filter(direction => canMove(ghost, direction));
        if (possible.length > 1 && ghost.direction) {
          const nonReverse = possible.filter(direction => direction !== opposite[ghost.direction]);
          if (nonReverse.length) possible.splice(0, possible.length, ...nonReverse);
        }
        if (!possible.length) return;
        const distances = possible.map(direction => {
          const vector = directions[direction];
          return { direction, distance: ghostDistance(ghost.x + vector.x, ghost.y + vector.y) };
        });
        distances.sort((first, second) => powerTicks ? second.distance - first.distance : first.distance - second.distance);
        const bestDistance = distances[0].distance;
        const bestChoices = distances.filter(choice => choice.distance === bestDistance);
        const choice = bestChoices[Math.floor(Math.random() * bestChoices.length)];
        move(ghost, choice.direction);
      }

      function checkCollisions() {
        for (const ghost of ghosts) {
          if (ghost.x !== player.x || ghost.y !== player.y) continue;
          if (powerTicks > 0) {
            ghost.previousX = ghost.x;
            ghost.previousY = ghost.y;
            ghost.x = 9;
            ghost.y = 10;
            ghostCombo += 1;
            addScore(200 * (2 ** Math.min(ghostCombo - 1, 3)));
          } else {
            loseLife();
            return;
          }
        }
      }

      function loseLife() {
        lives -= 1;
        updateStats();
        if (lives <= 0) {
          finishGame(false);
          return;
        }
        player = makePlayer();
        ghosts = ghostStarts.map(makeGhost);
        powerTicks = 0;
        ghostCombo = 0;
        respawnTicks = 8;
      }

      function update() {
        if (status !== 'playing') return;
        if (respawnTicks > 0) {
          respawnTicks -= 1;
          return;
        }
        if (powerTicks > 0) powerTicks -= 1;
        if (canMove(player, player.queuedDirection)) player.direction = player.queuedDirection;
        if (canMove(player, player.direction)) move(player, player.direction);
        else {
          player.previousX = player.x;
          player.previousY = player.y;
        }
        collectTile();
        if (status !== 'playing') return;
        for (const ghost of ghosts) moveGhost(ghost);
        checkCollisions();
      }

      function finishGame(won) {
        status = won ? 'won' : 'over';
        showOverlay(
          won ? 'Maze cleared' : 'Game over',
          won ? 'YOU WIN!' : 'NICE TRY!',
          won ? `You cleared the maze with ${score} points.` : `Final score: ${score}. Ready for another run?`,
          'Play again'
        );
      }

      function showOverlay(kicker, title, copy, buttonText) {
        document.querySelector('#overlay-kicker').textContent = kicker;
        document.querySelector('#overlay-title').textContent = title;
        document.querySelector('#overlay-copy').textContent = copy;
        startButton.textContent = buttonText;
        overlay.hidden = false;
      }

      function startGame() {
        if (status === 'over' || status === 'won') {
          score = 0;
          lives = 3;
          resetBoard();
          updateStats();
        }
        status = 'playing';
        overlay.hidden = true;
        lastFrame = 0;
        accumulator = 0;
      }

      function togglePause() {
        if (status === 'playing') {
          status = 'paused';
          showOverlay('Take a breather', 'PAUSED', 'The ghosts can wait. Jump back in whenever you’re ready.', 'Resume');
        } else if (status === 'paused' || status === 'ready') startGame();
      }

      function drawWall(x, y) {
        const inset = 2.5;
        const left = x * cellSize + inset;
        const top = y * cellSize + inset;
        const size = cellSize - inset * 2;
        context.save();
        context.shadowColor = '#1389ff';
        context.shadowBlur = 8;
        context.fillStyle = '#10265b';
        context.strokeStyle = '#258cff';
        context.lineWidth = 1.5;
        context.beginPath();
        context.roundRect(left, top, size, size, 5);
        context.fill();
        context.stroke();
        context.restore();
      }

      function drawBoard() {
        context.fillStyle = '#050916';
        context.fillRect(0, 0, canvas.width, canvas.height);
        for (let y = 0; y < rows; y += 1) {
          for (let x = 0; x < columns; x += 1) {
            const tile = board[y][x];
            if (tile === '#') drawWall(x, y);
            else if (tile === '.') {
              context.fillStyle = '#ffe8b3';
              context.beginPath();
              context.arc((x + .5) * cellSize, (y + .5) * cellSize, 2.15, 0, Math.PI * 2);
              context.fill();
            } else if (tile === 'o') {
              const pulse = 6 + Math.sin(performance.now() / 130) * .9;
              context.save();
              context.shadowColor = '#fff0a8';
              context.shadowBlur = 13;
              context.fillStyle = '#fff2bd';
              context.beginPath();
              context.arc((x + .5) * cellSize, (y + .5) * cellSize, pulse, 0, Math.PI * 2);
              context.fill();
              context.restore();
            }
          }
        }
      }

      function interpolatedPosition(entity, progress) {
        return {
          x: (entity.previousX + (entity.x - entity.previousX) * progress + .5) * cellSize,
          y: (entity.previousY + (entity.y - entity.previousY) * progress + .5) * cellSize
        };
      }

      function drawPlayer(progress) {
        const position = interpolatedPosition(player, progress);
        const directionAngle = { right: 0, down: Math.PI / 2, left: Math.PI, up: -Math.PI / 2 }[player.direction];
        const mouth = .12 + Math.abs(Math.sin(performance.now() / 75)) * .34;
        context.save();
        context.translate(position.x, position.y);
        context.rotate(directionAngle);
        context.fillStyle = '#ffdf35';
        context.shadowColor = '#ffdc35';
        context.shadowBlur = 13;
        context.beginPath();
        context.moveTo(0, 0);
        context.arc(0, 0, 10.8, mouth, Math.PI * 2 - mouth);
        context.closePath();
        context.fill();
        context.restore();
      }

      function drawGhost(ghost, progress) {
        const position = interpolatedPosition(ghost, progress);
        const frightened = powerTicks > 0;
        const blinking = frightened && powerTicks < 12 && Math.floor(performance.now() / 110) % 2 === 0;
        const bodyColor = frightened ? (blinking ? '#f0f4ff' : '#314ee8') : ghost.color;
        const eyeShift = directions[ghost.direction] || directions.left;
        const centerX = position.x;
        const centerY = position.y;
        const radius = 10.5;
        context.save();
        context.fillStyle = bodyColor;
        context.shadowColor = bodyColor;
        context.shadowBlur = 10;
        context.beginPath();
        context.moveTo(centerX - radius, centerY + radius);
        context.lineTo(centerX - radius, centerY - 1);
        context.arc(centerX, centerY - 1, radius, Math.PI, 0, false);
        context.lineTo(centerX + radius, centerY + radius);
        context.lineTo(centerX + radius * .5, centerY + radius * .58);
        context.lineTo(centerX, centerY + radius);
        context.lineTo(centerX - radius * .5, centerY + radius * .58);
        context.closePath();
        context.fill();
        context.shadowBlur = 0;
        if (frightened) {
          context.strokeStyle = blinking ? '#d04451' : '#c6d1ff';
          context.lineWidth = 1.6;
          context.beginPath();
          for (let index = 0; index < 4; index += 1) {
            const x = centerX - 5.5 + index * 3.7;
            context.lineTo(x, centerY + (index % 2 ? 3.3 : 5.8));
          }
          context.stroke();
        } else {
          for (const eyeX of [centerX - 4.2, centerX + 4.2]) {
            context.fillStyle = '#fff';
            context.beginPath();
            context.ellipse(eyeX, centerY - 2, 3.2, 4.2, 0, 0, Math.PI * 2);
            context.fill();
            context.fillStyle = '#15234d';
            context.beginPath();
            context.arc(eyeX + eyeShift.x * 1.5, centerY - 2 + eyeShift.y * 1.5, 1.65, 0, Math.PI * 2);
            context.fill();
          }
        }
        context.restore();
      }

      function draw(progress) {
        drawBoard();
        if (respawnTicks === 0 || Math.floor(performance.now() / 100) % 2 === 0) {
          drawPlayer(progress);
        }
        for (const ghost of ghosts) drawGhost(ghost, progress);
        if (powerTicks > 0 && status === 'playing') {
          context.fillStyle = '#c8d3f4';
          context.font = '800 10px system-ui';
          context.textAlign = 'center';
          context.fillText('POWER', canvas.width / 2, 17);
        }
      }

      function frame(timestamp) {
        if (status === 'playing') {
          if (!lastFrame) lastFrame = timestamp;
          accumulator += Math.min(timestamp - lastFrame, 80);
          lastFrame = timestamp;
          while (accumulator >= stepDuration) {
            update();
            accumulator -= stepDuration;
          }
        } else lastFrame = timestamp;
        draw(status === 'playing' ? accumulator / stepDuration : 1);
        animationFrame = requestAnimationFrame(frame);
      }

      function setDirection(direction) {
        if (status === 'ready' || status === 'paused') startGame();
        if (status === 'over' || status === 'won') return;
        player.queuedDirection = direction;
      }

      document.addEventListener('keydown', event => {
        const keyToDirection = {
          ArrowUp: 'up', w: 'up', W: 'up',
          ArrowDown: 'down', s: 'down', S: 'down',
          ArrowLeft: 'left', a: 'left', A: 'left',
          ArrowRight: 'right', d: 'right', D: 'right'
        };
        if (keyToDirection[event.key]) {
          event.preventDefault();
          setDirection(keyToDirection[event.key]);
        } else if (event.code === 'Space') {
          event.preventDefault();
          togglePause();
        } else if (event.key === 'Enter' && (status === 'ready' || status === 'over' || status === 'won')) startGame();
      });
      startButton.addEventListener('click', startGame);
      document.querySelectorAll('[data-dir]').forEach(button => {
        button.addEventListener('pointerdown', event => {
          event.preventDefault();
          setDirection(button.dataset.dir);
        });
      });
      document.querySelector('[data-action="pause"]').addEventListener('click', togglePause);

      resetBoard();
      updateStats();
      bestElement.textContent = String(best).padStart(5, '0');
      draw(1);
      animationFrame = requestAnimationFrame(frame);
      window.addEventListener('pagehide', () => cancelAnimationFrame(animationFrame), { once: true });
    })();
  </script>
</body>
</html>
