<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pac-Man</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#030307}
  body{display:grid;place-items:center;font-family:monospace;touch-action:none}
  #wrap{position:relative;width:min(94vw,calc(94vh * .81),616px);aspect-ratio:616/760;filter:drop-shadow(0 0 18px #0026a8)}
  canvas{display:block;width:100%;height:100%;background:#000;image-rendering:auto;outline:none;border:1px solid #111}
  #touch{display:none;position:absolute;inset:0;pointer-events:none}
  #touch button{position:absolute;width:15%;aspect-ratio:1;border:1px solid #3977ff55;border-radius:50%;background:#071347aa;color:#9db6ff;font-size:clamp(18px,5vw,34px);pointer-events:auto;user-select:none;-webkit-user-select:none}
  #up{left:8%;bottom:18%}#left{left:0;bottom:8%}#down{left:8%;bottom:0}#right{left:16%;bottom:8%}
  #pause{right:3%;bottom:4%;font-size:clamp(12px,3vw,20px)!important}
  @media(pointer:coarse){#touch{display:block}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="616" height="760" tabindex="0" aria-label="Pac-Man game"></canvas>
  <div id="touch" aria-hidden="true">
    <button id="up">▲</button><button id="left">◀</button><button id="down">▼</button><button id="right">▶</button><button id="pause">Ⅱ</button>
  </div>
</div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const TS=22, OY=58, COLS=28, ROWS=31, W=616, H=760;
const RAW=[
"############################",
"#............##............#",
"#.####.#####.##.#####.####.#",
"#o####.#####.##.#####.####o#",
"#.####.#####.##.#####.####.#",
"#..........................#",
"#.####.##.########.##.####.#",
"#.####.##.########.##.####.#",
"#......##....##....##......#",
"######.##### ## #####.######",
"     #.##### ## #####.#     ",
"     #.##          ##.#     ",
"     #.## ###==### ##.#     ",
"######.## #      # ##.######",
"      .   #      #   .      ",
"######.## #      # ##.######",
"     #.## ######## ##.#     ",
"     #.##          ##.#     ",
"     #.## ######## ##.#     ",
"######.## ######## ##.######",
"#............##............#",
"#.####.#####.##.#####.####.#",
"#.####.#####.##.#####.####.#",
"#o..##................##..o#",
"###.##.##.########.##.##.###",
"###.##.##.########.##.##.###",
"#......##....##....##......#",
"#.##########.##.##########.#",
"#.##########.##.##########.#",
"#..........................#",
"############################"];
const DIR={left:{x:-1,y:0,a:Math.PI},right:{x:1,y:0,a:0},up:{x:0,y:-1,a:-Math.PI/2},down:{x:0,y:1,a:Math.PI/2},none:{x:0,y:0,a:0}};
const OPP={left:'right',right:'left',up:'down',down:'up',none:'none'};
const NAMES=['up','left','down','right'];
function loadHigh(){try{return Number(localStorage.getItem('pacmanHigh')||0)}catch(e){return 0}}
let board, pellets,totalPellets,fruit=null,score=0,high=loadHigh(),lives=3,level=1,state='title',paused=false;
let player,ghosts=[],last=0,acc=0,stateTimer=0,frightTimer=0,ghostCombo=0,modeTimer=0,modeIndex=0,dotTick=0,extraGiven=false,flash=0;
const scatterTimes=[7,20,7,20,5,20,5,9999];
let audio=null;
function initAudio(){
  if(!audio)try{audio=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  if(audio&&audio.state==='suspended')audio.resume();
}
function tone(freq,dur,type='square',vol=.035,slide=0,delay=0){
  if(!audio)return; const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+dur);
}
function sound(kind){
  if(kind==='dot')tone(dotTick++%2?210:260,.045,'square',.018);
  else if(kind==='power'){tone(90,.25,'sawtooth',.05,80);tone(140,.22,'square',.025,-60,.08)}
  else if(kind==='eat'){tone(420,.12,'square',.045,450);tone(750,.12,'square',.03,350,.1)}
  else if(kind==='fruit')tone(520,.1,'square',.04,400);
  else if(kind==='start'){[262,330,392,523].forEach((n,i)=>tone(n,.13,'square',.035,0,i*.12))}
  else if(kind==='death'){for(let i=0;i<9;i++)tone(520-i*38,.11,'sawtooth',.035,-120,i*.09)}
  else if(kind==='level'){[392,523,659,784].forEach((n,i)=>tone(n,.14,'square',.035,0,i*.1))}
}
function tile(x,y){if(y<0||y>=ROWS)return'#';if(x<0||x>=COLS)return y===14?' ':'#';return RAW[y][x]}
function wall(x,y){return tile(x,y)==='#'}
function atCenter(e){return Math.abs(e.x-(Math.round(e.x-.5)+.5))<.0001&&Math.abs(e.y-(Math.round(e.y-.5)+.5))<.0001}
function cell(e){return{x:Math.round(e.x-.5),y:Math.round(e.y-.5)}}
function passable(x,y,e,dir){
  const t=tile(x,y);if(t==='#')return false;
  if(t==='='&&e===player)return false;
  if(t==='='&&e&&e.kind==='ghost'&&e.status==='active'&&dir==='down')return false;
  return true;
}
function canFrom(e,name){const c=cell(e),d=DIR[name];return passable(c.x+d.x,c.y+d.y,e,name)}
function moveEntity(e,amount,choose){
  let guard=0;
  while(amount>.00001&&guard++<8){
    if(atCenter(e)){
      e.x=Math.round(e.x-.5)+.5;e.y=Math.round(e.y-.5)+.5;
      if(choose)choose(e);
      if(!e.dir||e.dir==='none'||!canFrom(e,e.dir)){e.dir='none';break}
    }
    const d=DIR[e.dir];let tx=e.x,ty=e.y;
    if(d.x<0)tx=Math.ceil(e.x-.5)-.5;else if(d.x>0)tx=Math.floor(e.x-.5)+1.5;
    if(d.y<0)ty=Math.ceil(e.y-.5)-.5;else if(d.y>0)ty=Math.floor(e.y-.5)+1.5;
    let dist=Math.abs(tx-e.x)+Math.abs(ty-e.y);if(dist<.00001)dist=1;
    const step=Math.min(amount,dist);e.x+=d.x*step;e.y+=d.y*step;amount-=step;
    if(Math.abs(e.x-tx)<.00001&&Math.abs(e.y-ty)<.00001){e.x=tx;e.y=ty}
    if(e.y>13.9&&e.y<15.1){if(e.x<=-.5)e.x+=COLS;else if(e.x>=COLS+.5)e.x-=COLS}
  }
}
function resetBoard(){
  board=RAW.map(r=>r.split(''));pellets=0;fruit=null;
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(board[y][x]==='.'||board[y][x]==='o')pellets++;
  totalPellets=pellets;
}
function makePlayer(){return{x:13.5,y:23.5,dir:'left',want:'left',speed:7.7,mouth:0,dead:0}}
const ghostInfo=[
  {name:'BLINKY',color:'#f33',x:13.5,y:11.5,delay:0,corner:{x:25,y:0}},
  {name:'PINKY',color:'#ff9fca',x:13.5,y:14.5,delay:2.5,corner:{x:2,y:0}},
  {name:'INKY',color:'#31e6e6',x:11.5,y:14.5,delay:6,corner:{x:27,y:30}},
  {name:'CLYDE',color:'#ff9c36',x:15.5,y:14.5,delay:10,corner:{x:0,y:30}}];
function makeGhosts(){return ghostInfo.map((g,i)=>({...g,kind:'ghost',id:i,dir:i?'up':'left',status:i?'house':'active',release:g.delay,fright:0,eatenScore:0,phase:i*.9}))}
function resetActors(full=false){
  player=makePlayer();ghosts=makeGhosts();frightTimer=0;ghostCombo=0;modeTimer=0;modeIndex=0;
  state=full?'ready':state;stateTimer=full?2.2:stateTimer;
}
function newGame(){score=0;lives=3;level=1;extraGiven=false;resetBoard();resetActors(true);sound('start')}
function nextLevel(){level++;resetBoard();resetActors(true);stateTimer=2;flash=0}
function addScore(n){score+=n;if(score>high){high=score;try{localStorage.setItem('pacmanHigh',high)}catch(e){}}if(score>=10000&&!extraGiven){extraGiven=true;lives++;tone(880,.25,'square',.04)}}
function startInput(){initAudio();if(state==='title'||state==='gameover')newGame()}
function setDirection(name){startInput();if(state==='playing'||state==='ready')player.want=name}
function playerChoice(e){
  if(e.want&&canFrom(e,e.want))e.dir=e.want;
  else if(e.dir!=='none'&&!canFrom(e,e.dir))e.dir='none';
}
function targetFor(g){
  if(g.status==='eyes')return{x:13.5,y:14.5};
  if(g.status==='exiting')return{x:13.5,y:11.5};
  const scatter=modeIndex%2===0;if(scatter)return g.corner;
  const pd=DIR[player.dir]||DIR.left;
  if(g.id===0)return{x:player.x,y:player.y};
  if(g.id===1)return{x:player.x+pd.x*4,y:player.y+pd.y*4};
  if(g.id===2){const ax=player.x+pd.x*2,ay=player.y+pd.y*2,b=ghosts[0];return{x:ax+(ax-b.x),y:ay+(ay-b.y)}}
  const d=(g.x-player.x)**2+(g.y-player.y)**2;return d>64?{x:player.x,y:player.y}:g.corner;
}
function ghostChoice(g){
  if(g.status==='exiting'&&g.y<=11.5){g.status='active';g.dir='left'}
  if(g.status==='eyes'&&g.y>12.5&&g.y<15.5&&g.x>10&&g.x<18){g.status='house';g.release=.9;g.dir='up';return}
  let opts=NAMES.filter(n=>canFrom(g,n));
  if(opts.length>1)opts=opts.filter(n=>n!==OPP[g.dir]);
  if(!opts.length)opts=[OPP[g.dir]];
  if(g.status==='active'&&frightTimer>0){g.dir=opts[(Math.random()*opts.length)|0];return}
  const target=targetFor(g);let best=opts[0],bestD=Infinity;
  for(const n of opts){const d=DIR[n],nx=g.x+d.x,ny=g.y+d.y,dd=(nx-target.x)**2+(ny-target.y)**2;if(dd<bestD){bestD=dd;best=n}}
  g.dir=best;
}
function eatTile(){
  const c=cell(player);if(c.y<0||c.y>=ROWS||c.x<0||c.x>=COLS)return;
  const v=board[c.y][c.x];
  if(v==='.'||v==='o'){
    board[c.y][c.x]=' ';pellets--;addScore(v==='o'?50:10);sound(v==='o'?'power':'dot');
    const eaten=totalPellets-pellets;if(eaten===70||eaten===170)fruit={x:13.5,y:17.5,t:9,pop:0,points:[100,300,500,700,1000,2000,3000,5000][Math.min(level-1,7)]};
    if(v==='o'){
      frightTimer=Math.max(3,7-level*.35);ghostCombo=0;
      for(const g of ghosts)if(g.status==='active'){g.dir=OPP[g.dir];g.fright=1}
    }
    if(pellets===0){state='levelclear';stateTimer=2.1;flash=0;sound('level')}
  }
}
function collide(){
  for(const g of ghosts){if(g.status!=='active')continue;const dx=g.x-player.x,dy=g.y-player.y;if(dx*dx+dy*dy<.52){
    if(frightTimer>0){g.status='eyes';g.dir=OPP[g.dir];const pts=200*(2**ghostCombo++);g.eatenScore=pts;g.scoreTimer=.8;addScore(pts);sound('eat')}
    else die();
  }}
}
function die(){if(state!=='playing')return;state='dying';stateTimer=2;player.dead=0;sound('death')}
function update(dt){
  if(paused)return;
  if(state==='title'||state==='gameover')return;
  if(state==='ready'){stateTimer-=dt;if(stateTimer<=0)state='playing';return}
  if(state==='dying'){
    stateTimer-=dt;player.dead=Math.min(1,(2-stateTimer)/1.25);
    if(stateTimer<=0){lives--;if(lives<1){state='gameover';stateTimer=0}else{resetActors(false);state='ready';stateTimer=1.8}}return;
  }
  if(state==='levelclear'){stateTimer-=dt;flash+=dt;if(stateTimer<=0)nextLevel();return}
  if(state!=='playing')return;
  modeTimer+=dt;if(modeTimer>scatterTimes[modeIndex]){modeTimer=0;modeIndex=Math.min(modeIndex+1,scatterTimes.length-1);for(const g of ghosts)if(g.status==='active'&&frightTimer<=0)g.dir=OPP[g.dir]}
  if(frightTimer>0){frightTimer=Math.max(0,frightTimer-dt);if(!frightTimer)ghostCombo=0}
  moveEntity(player,player.speed*dt,playerChoice);player.mouth+=dt*12;eatTile();
  if(fruit){
    if(fruit.t>0){fruit.t-=dt;if((player.x-fruit.x)**2+(player.y-fruit.y)**2<.5){fruit.t=0;fruit.pop=.9;addScore(fruit.points);sound('fruit')}}
    else if((fruit.pop-=dt)<=0)fruit=null;
  }
  for(const g of ghosts){
    if(g.scoreTimer>0)g.scoreTimer-=dt;
    if(g.status==='house'){
      g.release-=dt;g.y+=Math.sin(performance.now()/180+g.phase)*dt*.18;
      if(g.release<=0){g.status='exiting';g.x=13.5;g.y=13.5;g.dir='up'}
      continue;
    }
    let speed=g.status==='eyes'?11.5:(frightTimer>0?5.2:6.9+Math.min(level*.12,.7));
    if(g.y>13.8&&g.y<15.2&&(g.x<5.5||g.x>22.5))speed*=.68;
    moveEntity(g,speed*dt,ghostChoice);
  }
  collide();
}
function sx(x){return x*TS}function sy(y){return OY+y*TS}
function drawWall(x,y){
  const px=sx(x),py=sy(y);ctx.fillStyle='#020414';ctx.fillRect(px,py,TS,TS);ctx.strokeStyle='#174dff';ctx.lineWidth=2.2;ctx.beginPath();
  if(!wall(x,y-1)){ctx.moveTo(px+2,py+1);ctx.lineTo(px+TS-2,py+1)}
  if(!wall(x,y+1)){ctx.moveTo(px+2,py+TS-1);ctx.lineTo(px+TS-2,py+TS-1)}
  if(!wall(x-1,y)){ctx.moveTo(px+1,py+2);ctx.lineTo(px+1,py+TS-2)}
  if(!wall(x+1,y)){ctx.moveTo(px+TS-1,py+2);ctx.lineTo(px+TS-1,py+TS-2)}ctx.stroke();
}
function drawMaze(){
  const flashWalls=state==='levelclear'&&Math.floor(flash*5)%2;ctx.save();
  if(flashWalls){ctx.shadowColor='#fff';ctx.shadowBlur=5}
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(wall(x,y))drawWall(x,y);
  ctx.restore();
  ctx.fillStyle='#ff93c9';for(let x=0;x<COLS;x++)if(tile(x,12)==='=')ctx.fillRect(sx(x),sy(12)+9,TS,4);
  const pulse=.65+.35*Math.sin(performance.now()/160);
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const v=board[y][x];if(v==='.'||v==='o'){ctx.fillStyle='#ffd9a0';ctx.beginPath();ctx.arc(sx(x+.5),sy(y+.5),v==='o'?4.8*pulse+1:2.25,0,Math.PI*2);ctx.fill()}
  }
}
function drawPac(){
  if(state==='dying'&&player.dead>=.92)return;
  const x=sx(player.x),y=sy(player.y),ang=DIR[player.dir]?.a??Math.PI;
  let bite=state==='dying'?Math.min(Math.PI,player.dead*Math.PI):(.08+Math.abs(Math.sin(player.mouth))*.28)*Math.PI;
  ctx.fillStyle='#ffe600';ctx.beginPath();ctx.moveTo(x,y);ctx.arc(x,y,9.5,ang+bite,ang+Math.PI*2-bite);ctx.closePath();ctx.fill();
}
function drawFruit(){
  if(!fruit)return;const x=sx(fruit.x),y=sy(fruit.y);
  if(fruit.pop>0){text(String(fruit.points),x,y,13,'#ffb8ff');return}
  ctx.strokeStyle='#42d348';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-3,y-3);ctx.quadraticCurveTo(x+1,y-12,x+7,y-11);ctx.stroke();
  ctx.fillStyle='#f22';ctx.beginPath();ctx.arc(x-5,y+2,5,0,Math.PI*2);ctx.arc(x+5,y+3,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#5f5';ctx.beginPath();ctx.ellipse(x+8,y-10,4,2,-.4,0,Math.PI*2);ctx.fill();
}
function ghostBody(g,x,y,color){
  ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y-1,9.5,Math.PI,0);ctx.lineTo(x+9.5,y+9);
  ctx.lineTo(x+6.3,y+5.7);ctx.lineTo(x+3.1,y+9);ctx.lineTo(x,y+5.7);ctx.lineTo(x-3.1,y+9);ctx.lineTo(x-6.3,y+5.7);ctx.lineTo(x-9.5,y+9);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(x-3.6,y-1,3.2,4.1,0,0,Math.PI*2);ctx.ellipse(x+3.6,y-1,3.2,4.1,0,0,Math.PI*2);ctx.fill();
  const d=DIR[g.dir]||DIR.left;ctx.fillStyle='#1645a5';ctx.beginPath();ctx.arc(x-3.6+d.x*1.4,y-1+d.y*1.4,1.6,0,Math.PI*2);ctx.arc(x+3.6+d.x*1.4,y-1+d.y*1.4,1.6,0,Math.PI*2);ctx.fill();
}
function drawEyes(g,x,y){
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(x-3.6,y-1,3.2,4.1,0,0,Math.PI*2);ctx.ellipse(x+3.6,y-1,3.2,4.1,0,0,Math.PI*2);ctx.fill();const d=DIR[g.dir]||DIR.left;ctx.fillStyle='#1645a5';ctx.beginPath();ctx.arc(x-3.6+d.x*1.4,y-1+d.y*1.4,1.6,0,Math.PI*2);ctx.arc(x+3.6+d.x*1.4,y-1+d.y*1.4,1.6,0,Math.PI*2);ctx.fill();
}
function drawGhost(g){
  const x=sx(g.x),y=sy(g.y);if(g.status==='eyes')drawEyes(g,x,y);else{
    let color=g.color;if(frightTimer>0&&g.status==='active')color=frightTimer<2&&Math.floor(frightTimer*6)%2?'#eee':'#1938cf';ghostBody(g,x,y,color);
  }
  if(g.scoreTimer>0){ctx.fillStyle='#8ff';ctx.font='bold 13px monospace';ctx.textAlign='center';ctx.fillText(g.eatenScore,x,y-13)}
}
function text(str,x,y,size=18,color='#fff',align='center'){ctx.fillStyle=color;ctx.font=`bold ${size}px monospace`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(str,x,y)}
function drawHUD(){
  text('1UP',88,12,14,'#fff');text(String(score).padStart(2,'0'),88,32,18,'#fff');text('HIGH SCORE',308,12,14,'#fff');text(String(high).padStart(2,'0'),308,32,18,'#fff');text('LEVEL '+level,550,25,13,'#7ff');
  for(let i=0;i<Math.max(0,lives-1);i++){ctx.fillStyle='#ffe600';ctx.beginPath();ctx.moveTo(25+i*25,739);ctx.arc(25+i*25,739,8.5,.2*Math.PI,1.8*Math.PI);ctx.closePath();ctx.fill()}
  for(let i=0;i<Math.min(7,level);i++){ctx.fillStyle=i%2?'#f44':'#f6b22c';ctx.beginPath();ctx.arc(586-i*18,739,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4f4';ctx.fillRect(584-i*18,729,3,5)}
}
function overlay(){
  if(state==='title'){
    ctx.fillStyle='#000d';ctx.fillRect(62,205,492,280);text('PAC-MAN',308,257,48,'#ffe600');
    ghostInfo.forEach((g,i)=>ghostBody({...g,dir:'right'},205+i*69,315,g.color));
    text('PRESS ENTER OR AN ARROW',308,374,18,'#fff');text('ARROWS / WASD TO MOVE',308,410,14,'#78a5ff');text('P OR ESC TO PAUSE',308,436,14,'#78a5ff');
  }else if(state==='ready')text('READY!',308,sy(17.5),18,'#ffe600');
  else if(state==='gameover'){ctx.fillStyle='#000b';ctx.fillRect(85,292,446,125);text('GAME OVER',308,326,28,'#f44');text('PRESS ENTER TO PLAY AGAIN',308,374,15,'#fff')}
  if(paused){ctx.fillStyle='#000b';ctx.fillRect(0,0,W,H);text('PAUSED',308,350,34,'#ffe600');text('PRESS P OR ESC TO RESUME',308,388,14,'#fff')}
}
function render(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);drawMaze();drawFruit();if(player)drawPac();for(const g of ghosts)drawGhost(g);drawHUD();overlay();
}
function frame(t){
  if(!last)last=t;let dt=Math.min(.05,(t-last)/1000);last=t;acc+=dt;while(acc>=1/120){update(1/120);acc-=1/120}render();requestAnimationFrame(frame)
}
function togglePause(){if(state==='playing'||paused){paused=!paused;initAudio();if(!paused&&audio)audio.resume()}}
const keys={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down'};
addEventListener('keydown',e=>{
  if(keys[e.key]){e.preventDefault();setDirection(keys[e.key])}
  else if(e.key==='Enter'||e.key===' '){e.preventDefault();startInput()}
  else if(e.key==='p'||e.key==='P'||e.key==='Escape'){e.preventDefault();togglePause()}
});
for(const n of NAMES){const b=document.getElementById(n);b.addEventListener('pointerdown',e=>{e.preventDefault();setDirection(n)})}
document.getElementById('pause').addEventListener('pointerdown',e=>{e.preventDefault();togglePause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')paused=true});
resetBoard();player=makePlayer();ghosts=makeGhosts();canvas.focus();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
