<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PAC-MAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none;
  }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Press Start 2P', ui-monospace, monospace; color: #8a8aa8;
  }
  canvas { display: block; }
  #help {
    font-size: 10px; line-height: 1.8; padding: 6px 8px 0; text-align: center; letter-spacing: 0.5px;
  }
  #help b { color: #ffd200; font-weight: normal; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="help"><b>ARROWS/WASD</b> MOVE &nbsp; <b>P</b> PAUSE &nbsp; <b>M</b> MUTE &nbsp; <b>SWIPE</b> ON TOUCH</div>
<script>
'use strict';
(() => {

// ---------------------------------------------------------------------------
// Constants & maze
// ---------------------------------------------------------------------------
const T = 24;                    // logical tile size in px
const COLS = 28, ROWS = 31;      // maze size in tiles
const TOP = 3, BOTTOM = 2;       // HUD rows above / below the maze
const W = COLS * T, H = (ROWS + TOP + BOTTOM) * T;
const BASE_SPEED = 9.47;         // tiles/sec at "100%" (arcade: 75.76 px/s on 8px tiles)
const STEP = 1 / 60;
const FAMILY = "'Press Start 2P', ui-monospace, monospace";
const FONT = `${Math.round(T * 0.7)}px ${FAMILY}`;
const FONT_SMALL = `${Math.round(T * 0.5)}px ${FAMILY}`;

// # wall   . dot   o power pellet   - ghost-house door   (space) empty
const MAZE_SRC = [
  '############################',
  '#............##............#',
  '#.####.#####.##.#####.####.#',
  '#o####.#####.##.#####.####o#',
  '#.####.#####.##.#####.####.#',
  '#..........................#',
  '#.####.##.########.##.####.#',
  '#.####.##.########.##.####.#',
  '#......##....##....##......#',
  '######.##### ## #####.######',
  '     #.##### ## #####.#     ',
  '     #.##          ##.#     ',
  '     #.## ###--### ##.#     ',
  '######.## #      # ##.######',
  '      .   #      #   .      ',
  '######.## #      # ##.######',
  '     #.## ######## ##.#     ',
  '     #.##          ##.#     ',
  '     #.## ######## ##.#     ',
  '######.## ######## ##.######',
  '#............##............#',
  '#.####.#####.##.#####.####.#',
  '#.####.#####.##.#####.####.#',
  '#o..##.......  .......##..o#',
  '###.##.##.########.##.##.###',
  '###.##.##.########.##.##.###',
  '#......##....##....##......#',
  '#.##########.##.##########.#',
  '#.##########.##.##########.#',
  '#..........................#',
  '############################',
];

const UP = { x: 0, y: -1, a: -Math.PI / 2 };
const DOWN = { x: 0, y: 1, a: Math.PI / 2 };
const LEFT = { x: -1, y: 0, a: Math.PI };
const RIGHT = { x: 1, y: 0, a: 0 };
const NONE = { x: 0, y: 0, a: 0 };
UP.opp = DOWN; DOWN.opp = UP; LEFT.opp = RIGHT; RIGHT.opp = LEFT; NONE.opp = NONE;
const DIR_ORDER = [UP, LEFT, DOWN, RIGHT];   // arcade tie-break priority

const GHOST_DEFS = [
  { name: 'blinky', nick: 'SHADOW',  color: '#ff0000', start: { x: 14, y: 11.5 }, home: { x: 14, y: 14.5 }, scatter: { x: 25, y: -3 } },
  { name: 'pinky',  nick: 'SPEEDY',  color: '#ffb8ff', start: { x: 14, y: 14.5 }, home: { x: 14, y: 14.5 }, scatter: { x: 2,  y: -3 } },
  { name: 'inky',   nick: 'BASHFUL', color: '#00ffff', start: { x: 12, y: 14.5 }, home: { x: 12, y: 14.5 }, scatter: { x: 27, y: 32 } },
  { name: 'clyde',  nick: 'POKEY',   color: '#ffb852', start: { x: 16, y: 14.5 }, home: { x: 16, y: 14.5 }, scatter: { x: 0,  y: 32 } },
];

const FRUIT_POS = { x: 14, y: 17.5 };
const FRUIT_POINTS = { cherry: 100, strawberry: 300, orange: 500, apple: 700, melon: 1000, galaxian: 2000, bell: 3000, key: 5000 };
const LEVEL_FRUIT = ['cherry', 'strawberry', 'orange', 'orange', 'apple', 'apple', 'melon', 'melon',
                     'galaxian', 'galaxian', 'bell', 'bell', 'key'];
const fruitFor = l => LEVEL_FRUIT[Math.min(l, LEVEL_FRUIT.length) - 1];

function levelParams(l) {
  let p;
  if (l === 1)      p = { pac: 0.80, pacF: 0.90, ghost: 0.75, ghostF: 0.50, tunnel: 0.40 };
  else if (l <= 4)  p = { pac: 0.90, pacF: 0.95, ghost: 0.85, ghostF: 0.55, tunnel: 0.45 };
  else if (l <= 20) p = { pac: 1.00, pacF: 1.00, ghost: 0.95, ghostF: 0.60, tunnel: 0.50 };
  else              p = { pac: 0.90, pacF: 0.90, ghost: 0.95, ghostF: 0.60, tunnel: 0.50 };
  const fright = [6, 5, 4, 3, 2, 5, 2, 2, 1, 5, 2, 1, 1, 3, 1, 1, 0, 1];
  const elroy = [20, 30, 40, 40, 40, 50, 50, 50, 60, 60, 60, 80, 80, 80, 100, 100, 100, 100, 120];
  p.fright = l <= fright.length ? fright[l - 1] : 0;
  p.elroy = elroy[Math.min(l, elroy.length) - 1];
  p.modes = l === 1 ? [7, 20, 7, 20, 5, 20, 5, Infinity]
          : l <= 4  ? [7, 20, 7, 20, 5, 1033, 1 / 60, Infinity]
          :           [5, 20, 5, 20, 5, 1037, 1 / 60, Infinity];
  return p;
}

// ---------------------------------------------------------------------------
// Sound (WebAudio synth — no assets)
// ---------------------------------------------------------------------------
const Sound = {
  ctx: null, master: null, bgOsc: null, bgGain: null, bgType: '', waka: false,
  muted: localStorage.getItem('pacman.muted') === '1',

  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.muted ? 0 : 0.35;
    this.master.connect(this.ctx.destination);
    this.bgOsc = this.ctx.createOscillator();
    this.bgGain = this.ctx.createGain();
    this.bgGain.gain.value = 0;
    this.bgOsc.connect(this.bgGain).connect(this.master);
    this.bgOsc.start();
  },

  toggleMute() {
    this.muted = !this.muted;
    localStorage.setItem('pacman.muted', this.muted ? '1' : '0');
    if (this.master) this.master.gain.setTargetAtTime(this.muted ? 0 : 0.35, this.ctx.currentTime, 0.02);
  },

  sweep(f0, f1, dur, type = 'square', vol = 0.2, when = 0) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + when;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.linearRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.006);
    g.gain.setValueAtTime(vol, t + dur * 0.8);
    g.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(g).connect(this.master);
    o.start(t);
    o.stop(t + dur + 0.02);
  },

  eatDot() {
    this.waka = !this.waka;
    if (this.waka) this.sweep(540, 250, 0.09, 'triangle', 0.4);
    else this.sweep(250, 540, 0.09, 'triangle', 0.4);
  },
  eatGhost() { this.sweep(150, 1500, 0.45, 'square', 0.12); },
  eatFruit() { this.sweep(400, 1100, 0.1, 'square', 0.12); this.sweep(1100, 500, 0.18, 'square', 0.12, 0.1); },
  extraLife() { for (let i = 0; i < 6; i++) this.sweep(1320, 1320, 0.09, 'square', 0.1, i * 0.16); },

  death() {
    let t = 0;
    for (let i = 0; i < 10; i++) {
      const hi = 820 - i * 55, lo = hi - 260;
      this.sweep(lo, hi, 0.07, 'triangle', 0.35, t);
      this.sweep(hi, lo, 0.07, 'triangle', 0.35, t + 0.07);
      t += 0.14;
    }
    this.sweep(90, 600, 0.12, 'triangle', 0.35, t + 0.08);
    this.sweep(90, 600, 0.12, 'triangle', 0.35, t + 0.28);
  },

  intro() {
    if (!this.ctx) return;
    const N = {
      B4: 493.88, C5: 523.25, 'D#5': 622.25, E5: 659.25, F5: 698.46, 'F#5': 739.99, G5: 783.99,
      'G#5': 830.61, A5: 880, B5: 987.77, C6: 1046.5,
      B2: 123.47, B3: 246.94, C3: 130.81, C4: 261.63, 'F#3': 185, 'G#3': 207.65, 'A#3': 233.08,
    };
    const u = 0.135, t0 = 0.05;
    const mel = [
      ['B4', 1], ['B5', 1], ['F#5', 1], ['D#5', 1], ['B5', .5], ['F#5', 1.5], ['D#5', 2],
      ['C5', 1], ['C6', 1], ['G5', 1], ['E5', 1], ['C6', .5], ['G5', 1.5], ['E5', 2],
      ['B4', 1], ['B5', 1], ['F#5', 1], ['D#5', 1], ['B5', .5], ['F#5', 1.5], ['D#5', 2],
      ['D#5', .5], ['E5', .5], ['F5', 1], ['F5', .5], ['F#5', .5], ['G5', 1], ['G5', .5], ['G#5', .5], ['A5', 1], ['B5', 2],
    ];
    let t = t0;
    for (const [n, d] of mel) { this.sweep(N[n], N[n], d * u * 0.9, 'square', 0.09, t); t += d * u; }
    const bass = ['B2', 'B3', 'B2', 'B3', 'C3', 'C4', 'C3', 'C4', 'B2', 'B3', 'B2', 'B3', 'F#3', 'G#3', 'A#3', 'B3'];
    let tb = t0;
    for (const n of bass) { this.sweep(N[n], N[n], 2 * u * 0.85, 'triangle', 0.3, tb); tb += 2 * u; }
  },

  // Continuous background: siren / frightened warble / returning-eyes whine.
  updateBg(kind, progress) {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    let f = 200, v = 0, type = 'triangle';
    if (kind === 'siren') {
      const ph = (now * (1.7 + progress * 1.3)) % 1;
      const tri = ph < 0.5 ? ph * 2 : 2 - ph * 2;
      f = 360 + progress * 220 + tri * 240; v = 0.08;
    } else if (kind === 'fright') {
      f = 170 + ((now * 7.5) % 1) * 380; v = 0.035; type = 'square';
    } else if (kind === 'eyes') {
      f = 1500 - ((now * 11) % 1) * 1000; v = 0.03; type = 'square';
    }
    if (type !== this.bgType) { this.bgOsc.type = type; this.bgType = type; }
    this.bgOsc.frequency.setTargetAtTime(f, now, 0.012);
    this.bgGain.gain.setTargetAtTime(v, now, 0.03);
  },
};

// ---------------------------------------------------------------------------
// Canvas setup & pre-rendered maze (smoothed signed-distance outline)
// ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let S = 1;                         // backing-store pixels per logical px
let mazeBlue = null, mazeWhite = null, rebuildTimer = 0;

function resize() {
  const help = document.getElementById('help');
  const availW = window.innerWidth - 8;
  const availH = window.innerHeight - help.offsetHeight - 10;
  const scale = Math.max(0.2, Math.min(availW / W, availH / H));
  canvas.style.width = Math.floor(W * scale) + 'px';
  canvas.style.height = Math.floor(H * scale) + 'px';
  const newS = Math.min(2.5, Math.max(1, scale * (window.devicePixelRatio || 1)));
  const changed = newS !== S || !mazeBlue;
  S = newS;
  canvas.width = Math.round(W * S);
  canvas.height = Math.round(H * S);
  if (!changed) return;
  clearTimeout(rebuildTimer);
  if (!mazeBlue) buildMaze(); else rebuildTimer = setTimeout(buildMaze, 150);
}

function buildMaze() {
  const R = Math.max(8, Math.round(T * S));      // device px per tile
  const w = COLS * R, h = ROWS * R;
  const src = (c, r) => r >= 0 && r < ROWS && c >= 0 && c < COLS && MAZE_SRC[r][c] === '#';
  // Off-grid: open, except the tunnel walls, which extend so their lines run off-screen.
  const isWall = (c, r) => {
    if (r < 0 || r >= ROWS) return false;
    if (c < 0 || c >= COLS) { const e = c < 0 ? 0 : COLS - 1; return src(e, r) && !src(e, r - 1) && !src(e, r + 1); }
    return src(c, r);
  };
  const GW = COLS + 2, grid = new Uint8Array(GW * (ROWS + 2));
  for (let r = -1; r <= ROWS; r++) for (let c = -1; c <= COLS; c++) grid[(r + 1) * GW + c + 1] = isWall(c, r) ? 1 : 0;

  // Signed distance (in tiles) to the wall/open boundary: + inside walls, - in corridors.
  const sdf = new Float32Array(w * h);
  for (let py = 0; py < h; py++) {
    const y = (py + 0.5) / R, r = Math.min(ROWS - 1, Math.floor(y));
    for (let px = 0; px < w; px++) {
      const x = (px + 0.5) / R, c = Math.min(COLS - 1, Math.floor(x));
      const inside = grid[(r + 1) * GW + c + 1];
      let best = 1;
      for (let dr = -1; dr <= 1; dr++) {
        const ty = r + dr, base = (ty + 1) * GW;
        const ddy = y < ty ? ty - y : (y > ty + 1 ? y - ty - 1 : 0);
        if (ddy >= best) continue;
        for (let dc = -1; dc <= 1; dc++) {
          if (grid[base + c + dc + 1] === inside) continue;
          const tx = c + dc;
          const ddx = x < tx ? tx - x : (x > tx + 1 ? x - tx - 1 : 0);
          const d = Math.sqrt(ddx * ddx + ddy * ddy);
          if (d < best) best = d;
        }
      }
      sdf[py * w + px] = inside ? best : -best;
    }
  }
  boxBlur(sdf, w, h, Math.max(1, Math.round(R * 0.14)));   // rounds all corners
  mazeBlue = paintMaze(sdf, w, h, R, [48, 48, 255], [6, 6, 38]);
  mazeWhite = paintMaze(sdf, w, h, R, [255, 255, 255], [40, 40, 70]);
}

function boxBlur(a, w, h, r) {
  const b = new Float32Array(a.length), n = 2 * r + 1;
  for (let pass = 0; pass < 2; pass++) {
    for (let y = 0; y < h; y++) {
      const o = y * w; let s = 0;
      for (let i = -r; i <= r; i++) s += a[o + Math.min(w - 1, Math.max(0, i))];
      for (let x = 0; x < w; x++) {
        b[o + x] = s / n;
        s += a[o + Math.min(w - 1, x + r + 1)] - a[o + Math.max(0, x - r)];
      }
    }
    for (let x = 0; x < w; x++) {
      let s = 0;
      for (let i = -r; i <= r; i++) s += b[Math.min(h - 1, Math.max(0, i)) * w + x];
      for (let y = 0; y < h; y++) {
        a[y * w + x] = s / n;
        s += b[Math.min(h - 1, y + r + 1) * w + x] - b[Math.max(0, y - r) * w + x];
      }
    }
  }
}

function paintMaze(sdf, w, h, R, line, fill) {
  const mk = () => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  const lineC = mk(), fillC = mk();
  const li = lineC.getContext('2d').createImageData(w, h);
  const fi = fillC.getContext('2d').createImageData(w, h);
  const inset = 0.27 * R, half = Math.max(1, 0.055 * R);
  for (let i = 0; i < sdf.length; i++) {
    const s = sdf[i] * R, j = i * 4;
    const la = Math.min(1, half + 0.5 - Math.abs(s - inset));
    const fa = Math.min(1, s - inset + 0.5);
    if (la > 0) { li.data[j] = line[0]; li.data[j + 1] = line[1]; li.data[j + 2] = line[2]; li.data[j + 3] = la * 255; }
    if (fa > 0) { fi.data[j] = fill[0]; fi.data[j + 1] = fill[1]; fi.data[j + 2] = fill[2]; fi.data[j + 3] = fa * 255; }
  }
  lineC.getContext('2d').putImageData(li, 0, 0);
  fillC.getContext('2d').putImageData(fi, 0, 0);
  const out = mk(), o = out.getContext('2d');
  o.drawImage(fillC, 0, 0);
  o.shadowColor = `rgba(${line.join(',')},0.85)`;
  o.shadowBlur = R * 0.4;
  o.drawImage(lineC, 0, 0);
  o.shadowBlur = 0;
  o.drawImage(lineC, 0, 0);
  return out;
}

// ---------------------------------------------------------------------------
// Game state
// ---------------------------------------------------------------------------
const game = {
  state: 'title', timer: 0, titleTime: 0, paused: false,
  score: 0, hi: +(localStorage.getItem('pacman.hi') || 0), lives: 3, level: 1, extraGiven: false,
  params: levelParams(1),
  dotsLeft: 0, dotsEaten: 0, totalDots: 0,
  mode: 'scatter', modeIndex: 0, modeTime: 0,
  frightTimer: 0, combo: 0,
  idleTimer: 0, useGlobal: false, globalDots: 0,
  fruit: null, popups: [], eatenGhost: null, eatenPoints: 0,
  firstReady: false, deathSoundPlayed: false,
};
let maze = [];
let pac, ghosts;
let time = 0;

function resetMaze() {
  maze = MAZE_SRC.map(r => r.split(''));
  game.totalDots = MAZE_SRC.join('').replace(/[^.o]/g, '').length;
  game.dotsLeft = game.totalDots;
  game.dotsEaten = 0;
}

function resetActors() {
  pac = { x: 14, y: 23.5, dir: LEFT, facing: LEFT, nextDir: null, anim: 0 };
  ghosts = GHOST_DEFS.map((d, i) => ({
    ...d, x: d.start.x, y: d.start.y,
    state: i === 0 ? 'active' : 'house',
    dir: i === 0 ? LEFT : i === 1 ? DOWN : UP,
    frightened: false, dotCount: 0,
  }));
  game.frightTimer = 0;
  game.mode = 'scatter'; game.modeIndex = 0; game.modeTime = 0;
  game.fruit = null; game.popups = []; game.idleTimer = 0; game.eatenGhost = null;
}

function startLevel() {
  game.params = levelParams(game.level);
  resetMaze();
  resetActors();
  game.useGlobal = false; game.globalDots = 0;
}

function startGame() {
  Sound.init();
  game.score = 0; game.lives = 3; game.level = 1; game.extraGiven = false; game.paused = false;
  startLevel();
  game.state = 'ready'; game.timer = 4.4; game.firstReady = true;
  Sound.intro();
}

function saveHi() { try { localStorage.setItem('pacman.hi', game.hi); } catch (e) { /* storage unavailable */ } }

function addScore(n) {
  game.score += n;
  if (!game.extraGiven && game.score >= 10000) { game.extraGiven = true; game.lives++; Sound.extraLife(); }
  if (game.score > game.hi) game.hi = game.score;
}

// ---------------------------------------------------------------------------
// Grid helpers & movement
// ---------------------------------------------------------------------------
const wrapCol = c => ((c % COLS) + COLS) % COLS;
function tileAt(c, r) { return r < 0 || r >= ROWS ? '#' : maze[r][wrapCol(c)]; }
function blocked(c, r) { const t = tileAt(c, r); return t === '#' || t === '-'; }

const isCentered = e => Math.abs(e.x - Math.floor(e.x) - 0.5) < 1e-4 && Math.abs(e.y - Math.floor(e.y) - 0.5) < 1e-4;

function distToNextCenter(e) {
  const d = e.dir;
  if (d.x > 0) return Math.floor(e.x - 0.5 + 1e-6) + 1.5 - e.x;
  if (d.x < 0) return e.x - (Math.ceil(e.x - 0.5 - 1e-6) - 0.5);
  if (d.y > 0) return Math.floor(e.y - 0.5 + 1e-6) + 1.5 - e.y;
  return e.y - (Math.ceil(e.y - 0.5 - 1e-6) - 0.5);
}

// Moves an entity `dist` tiles along the grid, calling onCenter at each tile
// center it reaches (which may change e.dir). Returns distance moved.
function moveGrid(e, dist, onCenter) {
  let moved = 0;
  for (let guard = 0; dist > 1e-6 && guard < 10; guard++) {
    if (isCentered(e)) {
      e.x = Math.floor(e.x) + 0.5; e.y = Math.floor(e.y) + 0.5;
      if (!onCenter(e) || e.dir === NONE) break;
    }
    if (e.dir === NONE) break;
    const m = Math.min(distToNextCenter(e), dist);
    e.x += e.dir.x * m; e.y += e.dir.y * m;
    dist -= m; moved += m;
    if (e.x < -0.5) e.x += COLS; else if (e.x >= COLS + 0.5) e.x -= COLS;
  }
  return moved;
}

function pacAtCenter(p) {
  const c = Math.floor(p.x), r = Math.floor(p.y);
  if (p.nextDir && !blocked(c + p.nextDir.x, r + p.nextDir.y)) p.dir = p.nextDir;
  else if (p.dir !== NONE && blocked(c + p.dir.x, r + p.dir.y)) p.dir = NONE;
  return p.dir !== NONE;
}

function ghostTarget(g) {
  if (g.state === 'eaten') return { x: 13, y: 11 };
  const pc = Math.floor(pac.x), pr = Math.floor(pac.y), f = pac.facing;
  const elroy = g.name === 'blinky' && game.dotsLeft <= game.params.elroy;
  if (game.mode === 'scatter' && !elroy) return g.scatter;
  switch (g.name) {
    case 'blinky': return { x: pc, y: pr };
    case 'pinky':  return { x: pc + f.x * 4 - (f === UP ? 4 : 0), y: pr + f.y * 4 };   // incl. arcade "up" overflow bug
    case 'inky': {
      const b = ghosts[0];
      const px = pc + f.x * 2 - (f === UP ? 2 : 0), py = pr + f.y * 2;
      return { x: 2 * px - Math.floor(b.x), y: 2 * py - Math.floor(b.y) };
    }
    default: {
      const dx = Math.floor(g.x) - pc, dy = Math.floor(g.y) - pr;
      return dx * dx + dy * dy > 64 ? { x: pc, y: pr } : g.scatter;
    }
  }
}

function ghostAtCenter(g) {
  const c = wrapCol(Math.floor(g.x)), r = Math.floor(g.y);
  if (g.state === 'eaten' && r === 11 && (c === 13 || c === 14)) { g.state = 'entering'; return false; }
  const opts = [];
  for (const d of DIR_ORDER) {
    if (d === g.dir.opp || blocked(c + d.x, r + d.y)) continue;
    // Arcade rule: no turning up into these four tiles while scattering/chasing.
    if (d === UP && g.state === 'active' && !g.frightened && (r === 11 || r === 23) && (c === 12 || c === 15)) continue;
    opts.push(d);
  }
  if (!opts.length) { g.dir = g.dir.opp; return true; }
  if (g.frightened) { g.dir = opts[Math.floor(Math.random() * opts.length)]; return true; }
  const t = ghostTarget(g);
  let best = opts[0], bd = Infinity;
  for (const d of opts) {
    const dx = c + d.x - t.x, dy = r + d.y - t.y, dd = dx * dx + dy * dy;
    if (dd < bd) { bd = dd; best = d; }
  }
  g.dir = best;
  return true;
}

function ghostSpeed(g) {
  const P = game.params;
  if (g.state === 'eaten' || g.state === 'entering') return 2 * BASE_SPEED;
  if (g.state === 'house') return 0.35 * BASE_SPEED;
  if (g.state === 'leaving') return 0.5 * BASE_SPEED;
  const c = Math.floor(g.x), r = Math.floor(g.y);
  if (r === 14 && (c <= 5 || c >= 22)) return P.tunnel * BASE_SPEED;
  if (g.frightened) return P.ghostF * BASE_SPEED;
  if (g.name === 'blinky') {   // "Cruise Elroy"
    if (game.dotsLeft <= P.elroy / 2) return (P.ghost + 0.1) * BASE_SPEED;
    if (game.dotsLeft <= P.elroy) return (P.ghost + 0.05) * BASE_SPEED;
  }
  return P.ghost * BASE_SPEED;
}

function stepToward(g, target, sp) {
  const d = target - g.x;
  g.dir = d > 0 ? RIGHT : LEFT;
  g.x += Math.sign(d) * Math.min(sp, Math.abs(d));
}

function updateGhost(g, dt) {
  const sp = ghostSpeed(g) * dt;
  switch (g.state) {
    case 'house': {
      g.y += g.dir.y * sp;
      if (g.y <= g.home.y - 0.35) { g.y = g.home.y - 0.35; g.dir = DOWN; }
      else if (g.y >= g.home.y + 0.35) { g.y = g.home.y + 0.35; g.dir = UP; }
      break;
    }
    case 'leaving': {
      if (Math.abs(g.x - 14) > 1e-3) { stepToward(g, 14, sp); break; }
      g.x = 14; g.dir = UP; g.y -= sp;
      if (g.y <= 11.5) { g.y = 11.5; g.state = 'active'; g.dir = LEFT; }
      break;
    }
    case 'entering': {
      if (g.y <= 11.5 + 1e-3 && Math.abs(g.x - 14) > 1e-3) stepToward(g, 14, sp);
      else if (g.y < 14.5) { g.x = 14; g.dir = DOWN; g.y = Math.min(14.5, g.y + sp); }
      else if (Math.abs(g.x - g.home.x) > 1e-3) stepToward(g, g.home.x, sp);
      else { g.state = 'leaving'; g.frightened = false; }
      break;
    }
    default:
      moveGrid(g, sp, ghostAtCenter);
  }
}

function updateHouse(dt) {
  const waiting = ghosts.filter(g => g.state === 'house');
  if (!waiting.length) { game.useGlobal = false; return; }
  game.idleTimer += dt;
  const g = waiting[0], L = game.level;
  let release;
  if (game.useGlobal) release = game.globalDots >= { pinky: 7, inky: 17, clyde: 32 }[g.name];
  else release = g.dotCount >= (g.name === 'pinky' ? 0 : g.name === 'inky' ? (L === 1 ? 30 : 0) : (L === 1 ? 60 : L === 2 ? 50 : 0));
  if (game.idleTimer >= (L < 5 ? 4 : 3)) { release = true; game.idleTimer = 0; }
  if (release) g.state = 'leaving';
}

function energize() {
  const P = game.params;
  game.combo = 0;
  game.frightTimer = P.fright;
  for (const g of ghosts) {
    if (g.state === 'eaten' || g.state === 'entering') continue;
    if (g.state === 'active') g.dir = g.dir.opp;
    g.frightened = P.fright > 0;
  }
}

function eatAt(p) {
  const c = wrapCol(Math.floor(p.x)), r = Math.floor(p.y);
  const t = maze[r][c];
  if (t !== '.' && t !== 'o') return;
  maze[r][c] = ' ';
  game.dotsLeft--; game.dotsEaten++;
  game.idleTimer = 0;
  if (game.useGlobal) game.globalDots++;
  else { const w = ghosts.find(g => g.state === 'house'); if (w) w.dotCount++; }
  Sound.eatDot();
  if (t === '.') addScore(10);
  else { addScore(50); energize(); }
  if (game.dotsEaten === 70 || game.dotsEaten === 170) {
    game.fruit = { name: fruitFor(game.level), t: 9 + Math.random() };
  }
}

function checkCollisions() {
  for (const g of ghosts) {
    if (g.state !== 'active') continue;
    let dx = Math.abs(g.x - pac.x); dx = Math.min(dx, COLS - dx);
    const dy = Math.abs(g.y - pac.y);
    if (dx * dx + dy * dy > 0.36) continue;
    if (g.frightened) {
      const pts = 200 * (1 << game.combo);
      game.combo = Math.min(game.combo + 1, 3);
      addScore(pts);
      g.state = 'eaten'; g.frightened = false;
      game.eatenGhost = g; game.eatenPoints = pts;
      game.state = 'eatGhost'; game.timer = 1;
      Sound.eatGhost();
    } else {
      game.state = 'dying'; game.timer = 0; game.deathSoundPlayed = false;
    }
    return;
  }
}

// ---------------------------------------------------------------------------
// Update
// ---------------------------------------------------------------------------
function updatePlay(dt) {
  const P = game.params;

  if (game.frightTimer > 0) {
    game.frightTimer -= dt;
    if (game.frightTimer <= 0) { game.frightTimer = 0; for (const g of ghosts) g.frightened = false; }
  } else {
    game.modeTime += dt;
    if (game.modeTime >= P.modes[game.modeIndex]) {
      game.modeTime -= P.modes[game.modeIndex];
      game.modeIndex++;
      game.mode = game.modeIndex % 2 === 0 ? 'scatter' : 'chase';
      for (const g of ghosts) if (g.state === 'active') g.dir = g.dir.opp;
    }
  }

  updateHouse(dt);

  const pSpeed = (game.frightTimer > 0 ? P.pacF : P.pac) * BASE_SPEED;
  if (pac.nextDir && pac.dir !== NONE && pac.nextDir === pac.dir.opp) pac.dir = pac.nextDir;
  pac.anim += moveGrid(pac, pSpeed * dt, pacAtCenter);
  if (pac.dir !== NONE) pac.facing = pac.dir;
  eatAt(pac);
  if (game.dotsLeft === 0) { game.state = 'levelDone'; game.timer = 0; return; }

  for (const g of ghosts) updateGhost(g, dt);
  checkCollisions();

  if (game.fruit) {
    game.fruit.t -= dt;
    if (game.fruit.t <= 0) game.fruit = null;
    else if (Math.abs(pac.x - FRUIT_POS.x) < 0.6 && Math.abs(pac.y - FRUIT_POS.y) < 0.5) {
      const pts = FRUIT_POINTS[game.fruit.name];
      addScore(pts);
      game.popups.push({ x: FRUIT_POS.x, y: FRUIT_POS.y, text: String(pts), color: '#ffb8ff', t: 2 });
      game.fruit = null;
      Sound.eatFruit();
    }
  }
  for (const p of game.popups) p.t -= dt;
  game.popups = game.popups.filter(p => p.t > 0);
}

function update(dt) {
  time += dt;
  if (game.paused) return;
  switch (game.state) {
    case 'title':
      game.titleTime += dt;
      break;
    case 'ready':
      game.timer -= dt;
      if (game.timer <= 0) { game.state = 'play'; game.firstReady = false; }
      break;
    case 'play':
      updatePlay(dt);
      break;
    case 'eatGhost':
      game.timer -= dt;
      if (game.timer <= 0) { game.eatenGhost = null; game.state = 'play'; }
      break;
    case 'dying':
      game.timer += dt;
      if (game.timer >= 1 && !game.deathSoundPlayed) { game.deathSoundPlayed = true; Sound.death(); }
      if (game.timer >= 2.9) {
        game.lives--;
        if (game.lives <= 0) { game.state = 'gameover'; game.timer = 4; saveHi(); }
        else {
          resetActors();
          game.useGlobal = true; game.globalDots = 0;
          game.state = 'ready'; game.timer = 2;
        }
      }
      break;
    case 'levelDone':
      game.timer += dt;
      if (game.timer >= 3.2) {
        game.level++;
        startLevel();
        game.state = 'ready'; game.timer = 2;
      }
      break;
    case 'gameover':
      game.timer -= dt;
      if (game.timer <= 0) { game.state = 'title'; game.titleTime = 0; }
      break;
  }
}

function bgSoundKind() {
  if (game.paused || game.state !== 'play') return 'none';
  if (ghosts.some(g => g.state === 'eaten' || g.state === 'entering')) return 'eyes';
  if (game.frightTimer > 0) return 'fright';
  return 'siren';
}

// ---------------------------------------------------------------------------
// Drawing
// ---------------------------------------------------------------------------
function drawPacman(x, y, rot, open, r = T * 0.8) {
  const a = open * 0.85;
  ctx.fillStyle = '#ffff00';
  ctx.beginPath();
  if (a < 0.02) ctx.arc(x, y, r, 0, Math.PI * 2);
  else { ctx.moveTo(x, y); ctx.arc(x, y, r, rot + a, rot + Math.PI * 2 - a); ctx.closePath(); }
  ctx.fill();
}

const chomp = anim => { const ph = (anim / 0.6) % 1; return ph < 0.5 ? ph * 2 : 2 - ph * 2; };

function drawGhostBody(x, y, color, dir, look) {
  const r = T * 0.8;
  if (look !== 'eyes') {
    const bottom = y + r * 0.9, frame = Math.floor(time * 8) % 2;
    ctx.fillStyle = look === 'fright' ? '#2121ff' : look === 'flash' ? '#f0f0ff' : color;
    ctx.beginPath();
    ctx.arc(x, y - r * 0.1, r, Math.PI, 0);
    ctx.lineTo(x + r, bottom);
    for (let i = 1; i <= 6; i++) ctx.lineTo(x + r - (2 * r * i) / 6, (i + frame) % 2 ? bottom - r * 0.28 : bottom);
    ctx.closePath();
    ctx.fill();
  }
  if (look === 'fright' || look === 'flash') {
    const fc = look === 'fright' ? '#ffb8ae' : '#ff2020';
    ctx.fillStyle = fc;
    ctx.fillRect(x - r * 0.42, y - r * 0.38, r * 0.24, r * 0.24);
    ctx.fillRect(x + r * 0.18, y - r * 0.38, r * 0.24, r * 0.24);
    ctx.strokeStyle = fc; ctx.lineWidth = r * 0.1; ctx.lineJoin = 'miter';
    ctx.beginPath();
    for (let i = 0; i <= 8; i++) {
      const px = x - r * 0.6 + i * (r * 1.2 / 8), py = y + r * 0.34 + (i % 2 ? -r * 0.13 : 0);
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.stroke();
    return;
  }
  const ex = dir.x * r * 0.12, ey = dir.y * r * 0.14;
  ctx.fillStyle = '#fff';
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.ellipse(x + s * r * 0.36 + ex, y - r * 0.18 + ey, r * 0.27, r * 0.34, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = '#2121ff';
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.arc(x + s * r * 0.36 + ex + dir.x * r * 0.14, y - r * 0.18 + ey + dir.y * r * 0.17, r * 0.15, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawGhost(g, gx) {
  let look = 'normal';
  if (g.state === 'eaten' || g.state === 'entering') look = 'eyes';
  else if (g.frightened) look = game.frightTimer < 2 && Math.floor(game.frightTimer * 5) % 2 === 0 ? 'flash' : 'fright';
  drawGhostBody(gx * T, g.y * T, g.color, g.dir, look);
}

// Draw an actor, duplicated across the tunnel seam so wrapping looks continuous.
function drawWrapped(x, fn) {
  fn(x);
  if (x < 1) fn(x + COLS); else if (x > COLS - 1) fn(x - COLS);
}

function drawFruit(name, x, y, size) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(size / 10, size / 10);   // draw in a ~20x20 box centered on 0,0
  const circle = (cx, cy, r, color) => { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill(); };
  const poly = (pts, color) => {
    ctx.fillStyle = color; ctx.beginPath();
    pts.forEach(([px, py], i) => i ? ctx.lineTo(px, py) : ctx.moveTo(px, py));
    ctx.closePath(); ctx.fill();
  };
  ctx.lineCap = 'round';
  switch (name) {
    case 'cherry':
      ctx.strokeStyle = '#de9751'; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.moveTo(-4, 2); ctx.quadraticCurveTo(-1, -5, 7, -8);
      ctx.moveTo(4, 4); ctx.quadraticCurveTo(3, -3, 7, -8); ctx.stroke();
      circle(-4, 4, 4.3, '#ff0000'); circle(4, 6, 4.3, '#ff0000');
      circle(-5.5, 3, 1, '#fff'); circle(2.5, 5, 1, '#fff');
      break;
    case 'strawberry':
      ctx.fillStyle = '#ff0000';
      ctx.beginPath(); ctx.moveTo(0, 9);
      ctx.bezierCurveTo(-10, 3, -9, -6, 0, -5); ctx.bezierCurveTo(9, -6, 10, 3, 0, 9); ctx.fill();
      ctx.fillStyle = '#fff';
      for (const [sx, sy] of [[-4, -1], [0, -2], [4, -1], [-2, 2], [2, 2], [-4, 3], [4, 3], [0, 5], [-1, 7.5]]) ctx.fillRect(sx - 0.5, sy - 0.5, 1, 1);
      poly([[-5, -5], [0, -8], [5, -5], [2, -4], [0, -6], [-2, -4]], '#00de00');
      ctx.fillStyle = '#00de00'; ctx.fillRect(-0.6, -9.5, 1.2, 3);
      break;
    case 'orange':
      circle(0, 2, 7.5, '#ffb847');
      ctx.strokeStyle = '#de9751'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(0, -5); ctx.lineTo(0, -8); ctx.stroke();
      ctx.fillStyle = '#00de00'; ctx.beginPath(); ctx.ellipse(3.5, -7, 3.5, 1.6, -0.3, 0, Math.PI * 2); ctx.fill();
      circle(-3, -1, 1.2, 'rgba(255,255,255,.7)');
      break;
    case 'apple':
      circle(-3, 2, 6.2, '#ff0000'); circle(3, 2, 6.2, '#ff0000'); circle(0, 4, 6, '#ff0000');
      ctx.strokeStyle = '#de9751'; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.moveTo(0, -3); ctx.quadraticCurveTo(0, -7, 2, -9); ctx.stroke();
      ctx.fillStyle = '#00de00'; ctx.beginPath(); ctx.ellipse(-3, -6, 3, 1.4, 0.5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(-3, 2, 3.8, Math.PI * 0.95, Math.PI * 1.35); ctx.stroke();
      break;
    case 'melon':
      circle(0, 2, 7.5, '#6bde2a');
      ctx.strokeStyle = '#1f7a1f'; ctx.lineWidth = 1.2;
      for (const k of [-4, 0, 4]) { ctx.beginPath(); ctx.ellipse(k * 0.9, 2, 1.8, 7.2, 0, 0, Math.PI * 2); ctx.stroke(); }
      ctx.fillStyle = '#fff';
      for (const [sx, sy] of [[-4, -1], [2, 5], [4, -2], [-1, 6]]) ctx.fillRect(sx, sy, 1, 1);
      ctx.strokeStyle = '#de9751'; ctx.beginPath(); ctx.moveTo(0, -5.5); ctx.lineTo(0, -8.5); ctx.stroke();
      break;
    case 'galaxian':
      poly([[0, -8], [2.5, -2], [2.5, 6], [0, 8], [-2.5, 6], [-2.5, -2]], '#ffff00');
      poly([[-2.5, -1], [-8.5, -6], [-8.5, 3], [-2.5, 5]], '#2121ff');
      poly([[2.5, -1], [8.5, -6], [8.5, 3], [2.5, 5]], '#2121ff');
      poly([[0, -8], [2, -3], [-2, -3]], '#ff0000');
      break;
    case 'bell':
      ctx.fillStyle = '#ffff00';
      ctx.beginPath(); ctx.moveTo(-8, 5);
      ctx.bezierCurveTo(-7, 3, -7, -8, 0, -8); ctx.bezierCurveTo(7, -8, 7, 3, 8, 5); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffff00'; ctx.fillRect(-8, 4, 16, 2);
      circle(1.5, 7.5, 2, '#9ee7ff');
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(-3.5, 2); ctx.quadraticCurveTo(-4, -4, -1, -6); ctx.stroke();
      break;
    case 'key':
      ctx.fillStyle = '#6bd0ff';
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-4.5, -9.5, 9, 7, 2.5) : ctx.rect(-4.5, -9.5, 9, 7); ctx.fill();
      ctx.fillStyle = '#000'; ctx.fillRect(-2, -7.5, 4, 1.4);
      ctx.fillStyle = '#e0e0e0'; ctx.fillRect(-1.1, -2.5, 2.2, 11.5);
      ctx.fillRect(1.1, 2, 2.5, 1.6); ctx.fillRect(1.1, 5.5, 2.5, 1.6);
      break;
  }
  ctx.restore();
}

function drawDots() {
  ctx.fillStyle = '#ffb8ae';
  ctx.beginPath();
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (maze[r][c] === '.') { ctx.moveTo((c + 0.5) * T + T * 0.12, (r + 0.5) * T); ctx.arc((c + 0.5) * T, (r + 0.5) * T, T * 0.12, 0, Math.PI * 2); }
  }
  ctx.fill();
  if (game.state === 'play' && Math.floor(time * 5) % 2) return;   // energizers blink during play
  ctx.beginPath();
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (maze[r][c] === 'o') { ctx.moveTo((c + 0.5) * T + T * 0.4, (r + 0.5) * T); ctx.arc((c + 0.5) * T, (r + 0.5) * T, T * 0.4, 0, Math.PI * 2); }
  }
  ctx.fill();
}

function drawText(text, x, y, color, align = 'center', font = FONT) {
  ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
}

function drawTopHud() {
  const blink = game.state === 'title' || game.state === 'gameover' || Math.floor(time * 3.3) % 2 === 0;
  if (blink) drawText('1UP', 3 * T, T * 0.7, '#fff', 'left');
  drawText('HIGH SCORE', W / 2, T * 0.7, '#fff');
  drawText(game.score ? String(game.score) : '00', 7 * T, T * 1.8, '#fff', 'right');
  if (game.hi) drawText(String(game.hi), W / 2 + 3.5 * T, T * 1.8, '#fff', 'right');
}

function drawBottomHud() {
  const y = (TOP + ROWS + 1) * T;
  if (game.state !== 'title' && game.state !== 'gameover') {
    const n = Math.min(5, Math.max(0, game.lives - 1));
    for (let i = 0; i < n; i++) drawPacman(2.5 * T + i * 2 * T, y, Math.PI, 0.55, T * 0.72);
    for (let l = game.level, i = 0; l >= Math.max(1, game.level - 6); l--, i++) drawFruit(fruitFor(l), W - 2.5 * T - i * 2 * T, y, T * 0.75);
  }
  if (Sound.muted) drawText('MUTED', W / 2, y, '#666', 'center', FONT_SMALL);
}

function drawTitle() {
  const tt = game.titleTime;
  ctx.save();
  ctx.shadowColor = '#ff8c00'; ctx.shadowBlur = 18;
  drawText('PAC-MAN', W / 2, 6 * T, '#ffff00', 'center', `${Math.round(T * 1.8)}px ${FAMILY}`);
  ctx.restore();
  drawText('CHARACTER / NICKNAME', W / 2, 10 * T, '#fff');
  GHOST_DEFS.forEach((d, i) => {
    const t0 = 0.5 + i * 0.9;
    if (tt < t0) return;
    const y = (12.5 + i * 2.6) * T;
    drawGhostBody(4 * T, y, d.color, RIGHT, 'normal');
    if (tt > t0 + 0.3) drawText('-' + d.nick, 6.5 * T, y, d.color, 'left');
    if (tt > t0 + 0.6) drawText('"' + d.name.toUpperCase() + '"', 16.5 * T, y, d.color, 'left');
  });
  if (tt > 4.3) {
    ctx.fillStyle = '#ffb8ae';
    ctx.beginPath(); ctx.arc(10 * T, 24 * T, T * 0.12, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(10 * T, 25.6 * T, T * 0.4, 0, Math.PI * 2); ctx.fill();
    drawText('10 PTS', 11.5 * T, 24 * T, '#fff', 'left');
    drawText('50 PTS', 11.5 * T, 25.6 * T, '#fff', 'left');
  }
  // Little attract-mode chase across the screen.
  const span = W + 16 * T;
  const px = W + 2 * T - ((tt * 7 * T) % span);
  const cy = 28.8 * T;
  drawPacman(px, cy, Math.PI, chomp(tt * 7));
  GHOST_DEFS.forEach((d, i) => drawGhostBody(px + (2.6 + i * 2) * T, cy, d.color, LEFT, 'normal'));
  if (Math.floor(time * 2) % 2 === 0) drawText('PRESS ENTER OR TAP', W / 2, 32 * T, '#ffb852');
  drawText('ARROWS / WASD / SWIPE TO MOVE', W / 2, 33.6 * T, '#8a8aa8', 'center', FONT_SMALL);
}

function drawPlayer() {
  const x = pac.x, y = pac.y * T;
  if (game.state === 'dying' && game.timer >= 1) {
    const t = game.timer - 1;
    if (t < 1.4) {
      const a = 0.15 + (t / 1.4) * (Math.PI - 0.15);
      ctx.fillStyle = '#ffff00';
      ctx.beginPath(); ctx.moveTo(x * T, y);
      ctx.arc(x * T, y, T * 0.8, -Math.PI / 2 + a, -Math.PI / 2 + Math.PI * 2 - a);
      ctx.closePath(); ctx.fill();
    } else if (t < 1.8) {
      const k = (t - 1.4) / 0.4;
      ctx.strokeStyle = '#ffff00'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const ang = i * Math.PI / 4, r1 = T * (0.25 + k * 0.35), r2 = r1 + T * 0.3;
        ctx.moveTo(x * T + Math.cos(ang) * r1, y + Math.sin(ang) * r1);
        ctx.lineTo(x * T + Math.cos(ang) * r2, y + Math.sin(ang) * r2);
      }
      ctx.stroke();
    }
    return;
  }
  const open = game.state === 'ready' || game.state === 'levelDone' ? 0 : chomp(pac.anim);
  drawWrapped(x, px => drawPacman(px * T, y, pac.facing.a, open));
}

function render() {
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  drawTopHud();
  if (game.state === 'title') { drawTitle(); drawBottomHud(); return; }

  ctx.save();
  ctx.translate(0, TOP * T);
  const flashing = game.state === 'levelDone' && game.timer > 1;
  const white = flashing && Math.floor((game.timer - 1) / 0.22) % 2 === 0;
  if (mazeBlue) ctx.drawImage(white ? mazeWhite : mazeBlue, 0, 0, COLS * T, ROWS * T);
  if (!flashing) { ctx.fillStyle = '#ffb8de'; ctx.fillRect(12.75 * T, 12.42 * T, 2.5 * T, T * 0.16); }
  drawDots();

  if (game.fruit) drawFruit(game.fruit.name, FRUIT_POS.x * T, FRUIT_POS.y * T, T * 0.8);
  for (const p of game.popups) drawText(p.text, p.x * T, p.y * T, p.color, 'center', FONT_SMALL);

  const intro = game.state === 'ready' && game.firstReady && game.timer > 2;
  const showActors = !intro && game.state !== 'gameover';
  const showGhosts = showActors && !(game.state === 'dying' && game.timer >= 1) && !flashing;
  if (showActors && game.state !== 'eatGhost') drawPlayer();
  if (showGhosts) for (const g of ghosts) if (g !== game.eatenGhost) drawWrapped(g.x, gx => drawGhost(g, gx));
  if (game.state === 'eatGhost') drawText(String(game.eatenPoints), game.eatenGhost.x * T, game.eatenGhost.y * T, '#00ffff', 'center', FONT_SMALL);

  if (intro) drawText('PLAYER ONE', W / 2, 11.5 * T, '#00ffff');
  if (game.state === 'ready') drawText('READY!', W / 2, 17.5 * T, '#ffff00');
  if (game.state === 'gameover') drawText('GAME  OVER', W / 2, 17.5 * T, '#ff0000');
  ctx.restore();

  drawBottomHud();

  if (game.paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    drawText('PAUSED', W / 2, H / 2 - T, '#ffff00');
    drawText('PRESS P OR TAP TO RESUME', W / 2, H / 2 + T, '#fff', 'center', FONT_SMALL);
  }
}

// ---------------------------------------------------------------------------
// Input
// ---------------------------------------------------------------------------
const KEYMAP = {
  ArrowUp: UP, KeyW: UP, ArrowDown: DOWN, KeyS: DOWN,
  ArrowLeft: LEFT, KeyA: LEFT, ArrowRight: RIGHT, KeyD: RIGHT,
};
const playing = () => game.state !== 'title' && game.state !== 'gameover';

function primaryAction() {
  Sound.init();
  if (!playing()) startGame();
  else if (game.paused) game.paused = false;
}

window.addEventListener('keydown', e => {
  const d = KEYMAP[e.code];
  if (d || e.code === 'Space') e.preventDefault();
  Sound.init();
  if (e.code === 'KeyM') { Sound.toggleMute(); return; }
  if (e.code === 'Enter' || e.code === 'Space') { primaryAction(); return; }
  if ((e.code === 'KeyP' || e.code === 'Escape') && playing()) { game.paused = !game.paused; return; }
  if (d && playing()) pac.nextDir = d;
});

let touch = null;
window.addEventListener('touchstart', e => {
  e.preventDefault();
  Sound.init();
  const t = e.changedTouches[0];
  touch = { x: t.clientX, y: t.clientY, moved: false };
}, { passive: false });
window.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!touch) return;
  const t = e.changedTouches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y;
  if (Math.hypot(dx, dy) < 22) return;
  if (playing()) pac.nextDir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? RIGHT : LEFT) : (dy > 0 ? DOWN : UP);
  touch = { x: t.clientX, y: t.clientY, moved: true };
}, { passive: false });
window.addEventListener('touchend', e => {
  e.preventDefault();
  if (touch && !touch.moved) primaryAction();
  touch = null;
}, { passive: false });
canvas.addEventListener('mousedown', primaryAction);

document.addEventListener('visibilitychange', () => { if (document.hidden && playing()) game.paused = true; });
window.addEventListener('resize', resize);

// ---------------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------------
resetMaze();
resetActors();
resize();
if (document.fonts) document.fonts.load(FONT);

let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.25, (now - last) / 1000);
  last = now;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  Sound.updateBg(bgSoundKind(), 1 - game.dotsLeft / game.totalDots);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
