      if (Math.floor(this.globalTime * 6) % 2 === 0) {
        ctx.fillStyle = '#FFB897';
        ctx.beginPath();
        ctx.arc(73, 230, 3.3, 0, Math.PI * 2);
        ctx.fill();
      }
      drawPixelText(ctx, '50 PTS', 88, 227, '#FFFFFF', 'left');

      // Pulsing Start CTA
      if (Math.floor(this.globalTime * 2.4) % 2 === 0) {
        drawPixelText(ctx, 'PRESS ENTER OR SPACE', 14 * TILE, 254, '#FFFF00', 'center');
      }
      drawPixelText(ctx, 'ARROWS OR WASD TO MOVE', 14 * TILE, 272, '#FFB8FF', 'center');
    }

    renderPauseOverlay(ctx) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.72)';
      ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

      ctx.strokeStyle = '#2121DE';
      ctx.lineWidth = 2;
      ctx.fillStyle = '#060614';
      ctx.fillRect(42, 110, 140, 62);
      ctx.strokeRect(42, 110, 140, 62);

      drawPixelText(ctx, 'PAUSED', 14 * TILE, 124, '#FFFF00', 'center');
      drawPixelText(ctx, 'P OR ESC TO RESUME', 14 * TILE, 148, '#FFFFFF', 'center');
    }
  }

  // =========================================================================
  // 8. BOOTSTRAP, RESPONSIVE SCALING, INPUTS & FIXED-TIMESTEP LOOP
  // =========================================================================
  const canvas = document.getElementById('game');
  const btnPause = document.getElementById('btn-pause');
  const btnMute = document.getElementById('btn-mute');
  const btnRestart = document.getElementById('btn-restart');

  const game = new PacManGame(canvas);

  function resizeCanvas() {
    const availW = window.innerWidth - 40;
    const availH = window.innerHeight - 78;
    const scale = Math.max(1, Math.min(availW / LOGICAL_W, availH / LOGICAL_H));
    const cssW = Math.floor(LOGICAL_W * scale);
    const cssH = Math.floor(LOGICAL_H * scale);

    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';

    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const targetW = Math.round(cssW * dpr);
    const targetH = Math.round(cssH * dpr);
    if (canvas.width !== targetW || canvas.height !== targetH) {
      canvas.width = targetW;
      canvas.height = targetH;
    }
  }

  function syncButtons() {
    btnPause.textContent = game.paused ? 'RESUME' : 'PAUSE';
    btnPause.classList.toggle('active', game.paused);
    btnMute.textContent = game.sound.muted ? 'SOUND: OFF' : 'SOUND: ON';
    btnMute.classList.toggle('active', game.sound.muted);
  }

  const KEY_TO_DIR = {
    ArrowUp: DIR_UP, KeyW: DIR_UP,
    ArrowLeft: DIR_LEFT, KeyA: DIR_LEFT,
    ArrowDown: DIR_DOWN, KeyS: DIR_DOWN,
    ArrowRight: DIR_RIGHT, KeyD: DIR_RIGHT
  };

  window.addEventListener('keydown', (e) => {
    const code = e.code;

    if (code in KEY_TO_DIR || code === 'Space') {
      e.preventDefault();
    }

    if (code === 'Enter' || code === 'Space') {
      if (game.state === 'TITLE' || game.state === 'GAME_OVER') {
        game.startNewGame();
        syncButtons();
        return;
      }
      if (game.paused && code === 'Space') {
        game.togglePause();
        syncButtons();
        return;
      }
    }

    if (code === 'KeyP' || code === 'Escape') {
      e.preventDefault();
      game.togglePause();
      syncButtons();
      return;
    }

    if (code === 'KeyM') {
      game.sound.setMuted(!game.sound.muted);
      syncButtons();
      return;
    }

    if (code in KEY_TO_DIR) {
      if (game.state === 'TITLE') {
        game.startNewGame();
        syncButtons();
      }
      game.setDirectionInput(KEY_TO_DIR[code], true);
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.code in KEY_TO_DIR) {
      game.setDirectionInput(KEY_TO_DIR[e.code], false);
    }
  });

  // Pointer click to start on Title / Game Over
  canvas.addEventListener('click', () => {
    if (game.state === 'TITLE' || game.state === 'GAME_OVER') {
      game.startNewGame();
      syncButtons();
    }
  });

  // Touch swipe controls for mobile/trackpad convenience
  let touchStartX = 0;
  let touchStartY = 0;
  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 0) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    if (game.state === 'TITLE' || game.state === 'GAME_OVER') {
      game.startNewGame();
      syncButtons();
    }
  }, { passive: true });

  canvas.addEventListener('touchmove', (e) => {
    if (e.touches.length === 0) return;
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;
    if (Math.hypot(dx, dy) > 18) {
      const dir = Math.abs(dx) > Math.abs(dy)
        ? (dx > 0 ? DIR_RIGHT : DIR_LEFT)
        : (dy > 0 ? DIR_DOWN : DIR_UP);
      game.bufferedDir = dir;
      game.bufferTimer = 0.5;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }
  }, { passive: true });

  btnPause.addEventListener('click', () => {
    game.togglePause();
    syncButtons();
    btnPause.blur();
  });

  btnMute.addEventListener('click', () => {
    game.sound.setMuted(!game.sound.muted);
    syncButtons();
    btnMute.blur();
  });

  btnRestart.addEventListener('click', () => {
    game.startNewGame();
    syncButtons();
    btnRestart.blur();
  });

  // Auto-pause when tab becomes hidden
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && !game.paused && game.state === 'PLAYING') {
      game.togglePause();
      syncButtons();
    }
  });

  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();
  syncButtons();

  // Fixed-timestep 60Hz game loop (smooth on 60Hz, 120Hz, 144Hz displays)
  let lastTime = performance.now();
  let accumulator = 0;

  function loop(now) {
    const rawDt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;
    accumulator += rawDt;

    while (accumulator >= FIXED_DT) {
      game.step(FIXED_DT);
      accumulator -= FIXED_DT;
    }

    game.render();
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
