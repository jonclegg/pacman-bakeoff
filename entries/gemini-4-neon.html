<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAC-MAN</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 50% 35%, #11132a 0%, #06060d 62%, #020205 100%);
    color: #e8ecff;
    font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  .arcade-shell {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 10px 14px;
  }

  .cabinet-frame {
    position: relative;
    padding: 10px;
    border-radius: 14px;
    background: linear-gradient(160deg, #1b1e36 0%, #0d0f1d 55%, #070811 100%);
    box-shadow:
      0 22px 60px rgba(0, 0, 0, 0.85),
      0 0 0 1px rgba(80, 110, 255, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.08),
      0 0 38px rgba(33, 33, 255, 0.16);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .screen-bezel {
    position: relative;
    background: #000000;
    border-radius: 8px;
    overflow: hidden;
    box-shadow:
      inset 0 0 0 2px #05050a,
      inset 0 0 24px rgba(0, 0, 0, 0.9);
    line-height: 0;
  }

  canvas#game {
    display: block;
    background: #000000;
    cursor: pointer;
    image-rendering: crisp-edges;
  }

  .scanlines {
    pointer-events: none;
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0) 0px,
      rgba(0, 0, 0, 0) 2px,
      rgba(0, 0, 0, 0.14) 3px,
      rgba(0, 0, 0, 0.14) 4px
    );
    opacity: 0;
    transition: opacity 0.2s ease;
  }

  .scanlines.on {
    opacity: 1;
  }

  .control-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px 14px;
    font-size: 12px;
    color: #9ba5cc;
    letter-spacing: 0.03em;
  }

  .keys-legend {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .key-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  kbd {
    display: inline-block;
    padding: 2px 6px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    color: #f4f6ff;
    background: #171a2f;
    border: 1px solid #303763;
    border-bottom-width: 2px;
    border-radius: 4px;
  }

  .btn-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .hud-btn {
    appearance: none;
    border: 1px solid #303763;
    background: #14172b;
    color: #dce3ff;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 4px 10px;
    border-radius: 5px;
    cursor: pointer;
    transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
  }

  .hud-btn:hover {
    background: #1f2445;
    border-color: #4f5cb3;
    color: #ffffff;
  }

  .hud-btn:active {
    transform: translateY(1px);
  }

  .hud-btn.active {
    background: #252b63;
    border-color: #6f7dff;
    color: #ffea54;
  }

  @media (max-height: 620px) {
    .arcade-shell {
      gap: 6px;
      padding: 6px;
    }
    .cabinet-frame {
      padding: 6px;
    }
    .control-bar {
      font-size: 11px;
    }
  }
</style>
</head>
<body>
<div class="arcade-shell">
  <div class="cabinet-frame">
    <div class="screen-bezel">
      <canvas id="game" width="448" height="576" aria-label="Pac-Man Arcade Game"></canvas>
      <div id="scanlines" class="scanlines" aria-hidden="true"></div>
    </div>
  </div>
  <div class="control-bar">
    <div class="keys-legend">
      <span class="key-item"><kbd>ARROWS</kbd> / <kbd>WASD</kbd> Move</span>
      <span class="key-item"><kbd>P</kbd> Pause</span>
      <span class="key-item"><kbd>M</kbd> Mute</span>
      <span class="key-item"><kbd>R</kbd> Restart</span>
    </div>
    <div class="btn-group">
      <button id="btn-pause" class="hud-btn" type="button" title="Pause / Resume (P)">PAUSE</button>
      <button id="btn-mute" class="hud-btn" type="button" title="Toggle Sound (M)">SOUND: ON</button>
      <button id="btn-crt" class="hud-btn" type="button" title="Toggle CRT Scanlines">CRT: OFF</button>
      <button id="btn-restart" class="hud-btn" type="button" title="Restart Game (R)">NEW GAME</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // =========================================================================
  // 1. ARCADE CONSTANTS & DATA TABLES
  // =========================================================================
  const COLS = 28;
  const ROWS = 31;
  const SCREEN_ROWS = 36; // Rows 0-2 top HUD, 3-33 maze, 34-35 bottom HUD
  const MAZE_ROW_OFFSET = 3;
  const LOGIC_TILE = 8; // Original arcade 8x8 pixel tiles (224x288 logical)
  const LOGIC_W = COLS * LOGIC_TILE;        // 224
  const LOGIC_H = SCREEN_ROWS * LOGIC_TILE; // 288
  const FIXED_DT = 1 / 60;
  const BASE_SPEED = 9.47; // Tiles per second at 100% arcade speed (~75.75 arcade px/sec)

  const DIR = {
    NONE:  { x:  0, y:  0, id: -1, angle: 0 },
    UP:    { x:  0, y: -1, id:  0, angle: -Math.PI / 2 },
    LEFT:  { x: -1, y:  0, id:  1, angle: Math.PI },
    DOWN:  { x:  0, y:  1, id:  2, angle: Math.PI / 2 },
    RIGHT: { x:  1, y:  0, id:  3, angle: 0 }
  };

  // Authentic arcade tie-breaking order: UP > LEFT > DOWN > RIGHT
  const DIR_PRIORITY = [DIR.UP, DIR.LEFT, DIR.DOWN, DIR.RIGHT];

  function oppositeDir(d) {
    if (d === DIR.UP) return DIR.DOWN;
    if (d === DIR.DOWN) return DIR.UP;
    if (d === DIR.LEFT) return DIR.RIGHT;
    if (d === DIR.RIGHT) return DIR.LEFT;
    return DIR.NONE;
  }

  // Exact 28x31 classic arcade Pac-Man maze (240 regular pellets + 4 power pellets = 244)
  // '#' wall, '.' pellet, 'o' power pellet, ' ' empty, '-' ghost door, '=' house interior, 'T' tunnel
  const MAZE_TEMPLATE = [
    '############################', // 00
    '#............##............#', // 01
    '#.####.#####.##.#####.####.#', // 02
    '#o####.#####.##.#####.####o#', // 03
    '#.####.#####.##.#####.####.#', // 04
    '#..........................#', // 05
    '#.####.##.########.##.####.#', // 06
    '#.####.##.########.##.####.#', // 07
    '#......##....##....##......#', // 08
    '######.##### ## #####.######', // 09
    '######.##### ## #####.######', // 10
    '######.##          ##.######', // 11
    '######.## ###--### ##.######', // 12
    '######.## #======# ##.######', // 13
    'TTTTTT.   #======#   .TTTTTT', // 14
    '######.## #======# ##.######', // 15
    '######.## ######## ##.######', // 16
    '######.##          ##.######', // 17
    '######.## ######## ##.######', // 18
    '######.## ######## ##.######', // 19
    '#............##............#', // 20
    '#.####.#####.##.#####.####.#', // 21
    '#.####.#####.##.#####.####.#', // 22
    '#o..##.......  .......##..o#', // 23
    '###.##.##.########.##.##.###', // 24
    '###.##.##.########.##.##.###', // 25
    '#......##....##....##......#', // 26
    '#.##########.##.##########.#', // 27
    '#.##########.##.##########.#', // 28
    '#..........................#', // 29
    '############################'  // 30
  ];

  // Classic 4 intersections where ghosts cannot turn UP during Chase/Scatter/Frightened
  const NO_UP_TILES = new Set(['12,11', '15,11', '12,23', '15,23']);

  const COLORS = {
    bg: '#000000',
    wall: '#2121ff',
    wallFlash: '#ffffff',
    door: '#ffb8de',
    pellet: '#ffb897',
    pacman: '#ffff00',
    blinky: '#ff0000',
    pinky: '#ffb8ff',
    inky: '#00ffff',
    clyde: '#ffb852',
    frightBody: '#2121de',
    frightFace: '#ffb897',
    frightFlashBody: '#ffffff',
    frightFlashFace: '#ff0000',
    scoreCyan: '#00ffff',
    fruitScore: '#ffb8ff',
    textWhite: '#dedeff',
    textYellow: '#ffff00',
    textRed: '#ff0000',
    textCyan: '#00ffff',
    textPink: '#ffb8ff',
    textOrange: '#ffb852'
  };

  // Authentic arcade level progression table
  const FRUITS = [
    { id: 'cherry',     name: 'CHERRY',     pts: 100  },
    { id: 'strawberry', name: 'STRAWBERRY', pts: 300  },
    { id: 'orange',     name: 'ORANGE',     pts: 500  },
    { id: 'apple',      name: 'APPLE',      pts: 700  },
    { id: 'melon',      name: 'MELON',      pts: 1000 },
    { id: 'galaxian',   name: 'GALAXIAN',   pts: 2000 },
    { id: 'bell',       name: 'BELL',       pts: 3000 },
    { id: 'key',        name: 'KEY',        pts: 5000 }
  ];

  function getLevelConfig(level) {
    let fruitIdx;
    if (level === 1) fruitIdx = 0;
    else if (level === 2) fruitIdx = 1;
    else if (level <= 4) fruitIdx = 2;
    else if (level <= 6) fruitIdx = 3;
    else if (level <= 8) fruitIdx = 4;
    else if (level <= 10) fruitIdx = 5;
    else if (level <= 12) fruitIdx = 6;
    else fruitIdx = 7;

    // Frightened durations (seconds) & flash counts from arcade ROM
    const frightTable = [
      [6, 5], [5, 5], [4, 5], [3, 5], [2, 5], [5, 5], [2, 5], [2, 5],
      [1, 3], [5, 5], [2, 5], [1, 3], [1, 3], [3, 5], [1, 3], [1, 3],
      [0, 0], [1, 3]
    ];
    const [frightSec, frightFlashes] = level <= frightTable.length ? frightTable[level - 1] : [0, 0];

    // Elroy 1 dot thresholds
    const elroyTable = [20, 30, 40, 40, 40, 50, 50, 50, 60, 60, 60, 80, 80, 80, 100, 100, 100, 100];
    const elroy1Dots = level <= elroyTable.length ? elroyTable[level - 1] : 120;
    const elroy2Dots = Math.floor(elroy1Dots / 2);

    // Speeds (fraction of BASE_SPEED)
    let pacSpeed, pacFrightSpeed, ghostSpeed, ghostFrightSpeed, ghostTunnelSpeed, elroy1Speed, elroy2Speed;
    if (level === 1) {
      pacSpeed = 0.80; pacFrightSpeed = 0.90;
      ghostSpeed = 0.75; ghostFrightSpeed = 0.50; ghostTunnelSpeed = 0.40;
      elroy1Speed = 0.80; elroy2Speed = 0.85;
    } else if (level <= 4) {
      pacSpeed = 0.90; pacFrightSpeed = 0.95;
      ghostSpeed = 0.85; ghostFrightSpeed = 0.55; ghostTunnelSpeed = 0.45;
      elroy1Speed = 0.90; elroy2Speed = 0.95;
    } else if (level <= 20) {
      pacSpeed = 1.00; pacFrightSpeed = 1.00;
      ghostSpeed = 0.95; ghostFrightSpeed = 0.60; ghostTunnelSpeed = 0.50;
      elroy1Speed = 1.00; elroy2Speed = 1.05;
    } else {
      pacSpeed = 0.90; pacFrightSpeed = 0.90;
      ghostSpeed = 0.95; ghostFrightSpeed = 0.60; ghostTunnelSpeed = 0.50;
      elroy1Speed = 1.00; elroy2Speed = 1.05;
    }

    // Scatter/Chase schedule in seconds: [S1, C1, S2, C2, S3, C3, S4, C4]
    let waves;
    if (level === 1) {
      waves = [7, 20, 7, 20, 5, 20, 5, Infinity];
    } else if (level <= 4) {
      waves = [7, 20, 7, 20, 5, 1033, 1 / 60, Infinity];
    } else {
      waves = [5, 20, 5, 20, 5, 1037, 1 / 60, Infinity];
    }

    // Ghost personal dot limits inside ghost house
    const inkyDotLimit = level === 1 ? 30 : 0;
    const clydeDotLimit = level === 1 ? 60 : (level === 2 ? 50 : 0);
    const dotTimeoutSec = level < 5 ? 4.0 : 3.0;

    return {
      level,
      fruit: FRUITS[fruitIdx],
      frightSec,
      frightFlashes,
      elroy1Dots,
      elroy2Dots,
      pacSpeed,
      pacFrightSpeed,
      ghostSpeed,
      ghostFrightSpeed,
      ghostTunnelSpeed,
      elroy1Speed,
      elroy2Speed,
      waves,
      inkyDotLimit,
      clydeDotLimit,
      dotTimeoutSec
    };
  }

  // =========================================================================
  // 2. BUILT-IN 8x8 ARCADE BITMAP FONT (Zero external fonts!)
  // =========================================================================
  const FONT_8X8 = {
    ' ': [0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00],
    '0': [0x3C,0x66,0x6E,0x76,0x66,0x66,0x3C,0x00],
    '1': [0x18,0x38,0x18,0x18,0x18,0x18,0x7E,0x00],
    '2': [0x3C,0x66,0x06,0x1C,0x30,0x60,0x7E,0x00],
    '3': [0x3C,0x66,0x06,0x1C,0x06,0x66,0x3C,0x00],
    '4': [0x0C,0x1C,0x3C,0x6C,0x7E,0x0C,0x0C,0x00],
    '5': [0x7E,0x60,0x7C,0x06,0x06,0x66,0x3C,0x00],
    '6': [0x3C,0x60,0x7C,0x66,0x66,0x66,0x3C,0x00],
    '7': [0x7E,0x66,0x0C,0x18,0x18,0x18,0x18,0x00],
    '8': [0x3C,0x66,0x66,0x3C,0x66,0x66,0x3C,0x00],
    '9': [0x3C,0x66,0x66,0x3E,0x06,0x0C,0x38,0x00],
    'A': [0x18,0x3C,0x66,0x66,0x7E,0x66,0x66,0x00],
    'B': [0x7C,0x66,0x66,0x7C,0x66,0x66,0x7C,0x00],
    'C': [0x3C,0x66,0x60,0x60,0x60,0x66,0x3C,0x00],
    'D': [0x78,0x6C,0x66,0x66,0x66,0x6C,0x78,0x00],
    'E': [0x7E,0x60,0x60,0x78,0x60,0x60,0x7E,0x00],
    'F': [0x7E,0x60,0x60,0x78,0x60,0x60,0x60,0x00],
    'G': [0x3C,0x66,0x60,0x6E,0x66,0x66,0x3E,0x00],
    'H': [0x66,0x66,0x66,0x7E,0x66,0x66,0x66,0x00],
    'I': [0x3C,0x18,0x18,0x18,0x18,0x18,0x3C,0x00],
    'J': [0x1E,0x0C,0x0C,0x0C,0x6C,0x6C,0x38,0x00],
    'K': [0x66,0x6C,0x78,0x70,0x78,0x6C,0x66,0x00],
    'L': [0x60,0x60,0x60,0x60,0x60,0x60,0x7E,0x00],
    'M': [0x63,0x77,0x7F,0x6B,0x63,0x63,0x63,0x00],
    'N': [0x66,0x76,0x7E,0x7E,0x6E,0x66,0x66,0x00],
    'O': [0x3C,0x66,0x66,0x66,0x66,0x66,0x3C,0x00],
    'P': [0x7C,0x66,0x66,0x7C,0x60,0x60,0x60,0x00],
    'Q': [0x3C,0x66,0x66,0x66,0x6A,0x6C,0x36,0x00],
    'R': [0x7C,0x66,0x66,0x7C,0x6C,0x66,0x66,0x00],
    'S': [0x3C,0x66,0x60,0x3C,0x06,0x66,0x3C,0x00],
    'T': [0x7E,0x18,0x18,0x18,0x18,0x18,0x18,0x00],
    'U': [0x66,0x66,0x66,0x66,0x66,0x66,0x3C,0x00],
    'V': [0x66,0x66,0x66,0x66,0x66,0x3C,0x18,0x00],
    'W': [0x63,0x63,0x63,0x6B,0x7F,0x77,0x63,0x00],
    'X': [0x66,0x66,0x3C,0x18,0x3C,0x66,0x66,0x00],
    'Y': [0x66,0x66,0x66,0x3C,0x18,0x18,0x18,0x00],
    'Z': [0x7E,0x06,0x0C,0x18,0x30,0x60,0x7E,0x00],
    '!': [0x18,0x3C,0x3C,0x18,0x18,0x00,0x18,0x00],
    '-': [0x00,0x00,0x00,0x7E,0x00,0x00,0x00,0x00],
    '.': [0x00,0x00,0x00,0x00,0x00,0x18,0x18,0x00],
    ',': [0x00,0x00,0x00,0x00,0x00,0x18,0x18,0x30],
    ':': [0x00,0x18,0x18,0x00,0x18,0x18,0x00,0x00],
    '/': [0x02,0x06,0x0C,0x18,0x30,0x60,0x40,0x00],
    '"': [0x66,0x66,0x24,0x00,0x00,0x00,0x00,0x00],
    "'": [0x18,0x18,0x30,0x00,0x00,0x00,0x00,0x00],
    '(': [0x0C,0x18,0x30,0x30,0x30,0x18,0x0C,0x00],
    ')': [0x30,0x18,0x0C,0x0C,0x0C,0x18,0x30,0x00],
    '+': [0x00,0x18,0x18,0x7E,0x18,0x18,0x00,0x00]
  };

  // =========================================================================
  // 3. WEB AUDIO API ARCADE SOUND SYNTHESIZER
  // =========================================================================
  class SoundEngine {
    constructor() {
      this.ctx = null;
      this.master = null;
      this.musicGain = null;
      this.muted = false;
      this.wakaFlip = false;
      this.bgMode = 'none'; // 'none', 'siren', 'fright', 'eyes'
      this.sirenGear = 0;
      this.bgOsc = null;
      this.bgGain = null;
      this.bgLfo = null;
      this.bgLfoGain = null;
      this.active = false;
    }

    unlock() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        try {
          this.ctx = new AudioCtx();
          this.master = this.ctx.createGain();
          this.master.gain.value = this.muted ? 0 : 0.28;
          this.master.connect(this.ctx.destination);
          this.musicGain = this.ctx.createGain();
          this.musicGain.gain.value = 1;
          this.musicGain.connect(this.master);
        } catch (e) {
          this.ctx = null;
          return;
        }
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume().catch(() => {});
      }
      this.active = true;
    }

    stopMusic() {
      if (!this.ctx || !this.master) return;
      if (this.musicGain) {
        try { this.musicGain.disconnect(); } catch (e) {}
      }
      this.musicGain = this.ctx.createGain();
      this.musicGain.gain.value = 1;
      this.musicGain.connect(this.master);
    }

    setMuted(m) {
      this.muted = m;
      if (this.master && this.ctx) {
        this.master.gain.setTargetAtTime(m ? 0 : 0.28, this.ctx.currentTime, 0.015);
      }
    }

    stopBackground() {
      if (this.bgOsc) {
        try { this.bgOsc.stop(); } catch (e) {}
        try { this.bgOsc.disconnect(); } catch (e) {}
        this.bgOsc = null;
      }
      if (this.bgLfo) {
        try { this.bgLfo.stop(); } catch (e) {}
        try { this.bgLfo.disconnect(); } catch (e) {}
        this.bgLfo = null;
      }
      if (this.bgGain) {
        try { this.bgGain.disconnect(); } catch (e) {}
        this.bgGain = null;
      }
      if (this.bgLfoGain) {
        try { this.bgLfoGain.disconnect(); } catch (e) {}
        this.bgLfoGain = null;
      }
      this.bgMode = 'none';
    }

    setBackground(mode, gear) {
      if (!this.ctx || !this.active) return;
      if (mode === 'none') {
        this.stopBackground();
        return;
      }
      if (this.bgMode === mode && (mode !== 'siren' || this.sirenGear === gear)) {
        return;
      }
      this.stopBackground();
      this.bgMode = mode;
      this.sirenGear = gear;

      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      const lfo = this.ctx.createOscillator();
      const lfoGain = this.ctx.createGain();

      if (mode === 'siren') {
        // 5 classic arcade siren gears rising in pitch & sweep rate
        const baseFreqs = [340, 390, 445, 510, 585];
        const lfoRates  = [2.1, 2.55, 3.05, 3.65, 4.35];
        const depths    = [78,  88,   98,   110,  125];
        const gIdx = Math.max(0, Math.min(4, gear | 0));
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(baseFreqs[gIdx], now);
        lfo.type = 'triangle';
        lfo.frequency.setValueAtTime(lfoRates[gIdx], now);
        lfoGain.gain.setValueAtTime(depths[gIdx], now);
        gain.gain.setValueAtTime(0.24, now);
      } else if (mode === 'fright') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(215, now);
        lfo.type = 'sawtooth';
        lfo.frequency.setValueAtTime(7.2, now);
        lfoGain.gain.setValueAtTime(68, now);
        gain.gain.setValueAtTime(0.26, now);
      } else if (mode === 'eyes') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(720, now);
        lfo.type = 'sawtooth';
        lfo.frequency.setValueAtTime(9.5, now);
        lfoGain.gain.setValueAtTime(-260, now);
        gain.gain.setValueAtTime(0.18, now);
      }

      lfo.connect(lfoGain);
      lfoGain.connect(osc.frequency);
      osc.connect(gain);
      gain.connect(this.master);
      osc.start(now);
      lfo.start(now);

      this.bgOsc = osc;
      this.bgGain = gain;
      this.bgLfo = lfo;
      this.bgLfoGain = lfoGain;
    }

    playWaka() {
      if (!this.ctx || !this.active) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';

      if (this.wakaFlip) {
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.exponentialRampToValueAtTime(490, now + 0.065);
      } else {
        osc.frequency.setValueAtTime(460, now);
        osc.frequency.exponentialRampToValueAtTime(215, now + 0.065);
      }
      this.wakaFlip = !this.wakaFlip;

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.36, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.075);

      osc.connect(gain);
      gain.connect(this.master);
      osc.start(now);
      osc.stop(now + 0.08);
    }

    playEatGhost() {
      if (!this.ctx || !this.active) return;

      osc.type = 'square';
      osc.frequency.setValueAtTime(210, now);
      osc.frequency.exponentialRampToValueAtTime(960, now + 0.16);
      osc.frequency.exponentialRampToValueAtTime(1480, now + 0.28);

      gain.gain.setValueAtTime(0.24, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.30);

      osc.connect(gain);
      gain.connect(this.master);
      osc.start(now);

    playDeath() {
      if (!this.ctx || !this.active) return;
      this.stopBackground();
      const now = this.ctx.currentTime;
      // Classic 6 descending wavy steps + 2 quick low pops
      for (let i = 0; i < 6; i++) {
        const t = now + i * 0.16;
        const base = 520 - i * 52;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';

        osc.frequency.linearRampToValueAtTime(base - 95, t + 0.15);
        gain.gain.setValueAtTime(0.19, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.155);
        osc.connect(gain);
        gain.connect(this.master);
        osc.start(t);
        osc.stop(t + 0.16);

      // Two final arcade pops
      for (let j = 0; j < 2; j++) {
        const t = now + 1.02 + j * 0.15;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(160, t);
        osc.frequency.exponentialRampToValueAtTime(620, t + 0.06);
        osc.frequency.exponentialRampToValueAtTime(110, t + 0.12);
        gain.gain.setValueAtTime(0.28, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
        osc.connect(gain);
        gain.connect(this.master);
        osc.start(t);
        osc.stop(t + 0.135);
      }
    }
