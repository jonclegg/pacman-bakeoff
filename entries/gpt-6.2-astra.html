function activate(){armAudio();if(phase==='paused')pauseGame();else if(phase==='title'||phase==='over')beginGame()}
get('action').addEventListener('click',activate);get('sound').addEventListener('click',toggleSound);get('pause').addEventListener('click',()=>{armAudio();pauseGame()});
const keys={ArrowLeft:'left',ArrowUp:'up',ArrowDown:'down',ArrowRight:'right',a:'left',w:'up',s:'down',d:'right'};
document.addEventListener('keydown',event=>{if(event.metaKey||event.ctrlKey||event.altKey)return;const key=event.key.length===1?event.key.toLowerCase():event.key,direction=keys[key];if(direction){event.preventDefault();if(!event.repeat){armAudio();inputTurn(direction)}return}if(key==='Enter'&&event.target instanceof HTMLButtonElement&&event.target!==get('action')&&phase!=='over'&&phase!=='title'&&phase!=='paused')return;if(!['Enter',' ','Escape','p','m'].includes(key))return;event.preventDefault();if(event.repeat)return;if(key==='m')toggleSound();else if(key==='Enter'||key===' '&&(phase==='title'||phase==='over'))activate();else{armAudio();pauseGame()}});
document.querySelectorAll('.pad button').forEach(button=>button.addEventListener('pointerdown',event=>{event.preventDefault();armAudio();inputTurn(button.dataset.dir)}));let touch=null;
get('screen').addEventListener('pointerdown',event=>{if(event.target.closest('button')||event.target.closest('.overlay'))return;touch={left:event.clientX,top:event.clientY,id:event.pointerId};get('screen').setPointerCapture(event.pointerId)});
get('screen').addEventListener('pointermove',event=>{if(!touch||event.pointerId!==touch.id)return;const dx=event.clientX-touch.left,dy=event.clientY-touch.top;if(Math.max(Math.abs(dx),Math.abs(dy))<11)return;inputTurn(Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down'));touch.left=event.clientX;touch.top=event.clientY});for(const name of ['pointerup','pointercancel','lostpointercapture'])get('screen').addEventListener(name,()=>{touch=null});
function blurPause(){if(['play','ready','capture'].includes(phase))pauseGame();stopHum();silenceNotes()}window.addEventListener('blur',blurPause);document.addEventListener('visibilitychange',()=>{if(document.hidden)blurPause()});
resetMaze();actors();hud();soundUI();displayState();resizeScreen();if('ResizeObserver' in window)new ResizeObserver(resizeScreen).observe(get('screen'));else window.addEventListener('resize',resizeScreen);
let previous=0,bank=0;const tick=1/120;
function frame(stamp){const delta=previous?Math.min((stamp-previous)/1000,.085):0;previous=stamp;bank+=delta;while(bank>=tick){simulated(tick);bank-=tick}render();updateHum();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script>
