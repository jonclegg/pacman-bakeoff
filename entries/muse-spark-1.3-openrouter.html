<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pac-Man</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#050510; color:#fff;
    font-family:'Courier New',monospace;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; padding:16px;
    user-select:none;
  }
  h1 { color:#ffe600; letter-spacing:6px; text-shadow:0 0 18px #ffe60088; margin-bottom:4px; }
  #hud { display:flex; gap:28px; font-size:18px; font-weight:bold; margin:8px 0 12px; }
  #hud span { color:#ffe600; }
  #wrap { position:relative; }
  canvas { background:#000; border:3px solid #2121ff; border-radius:10px; box-shadow:0 0 40px #2121ff66; display:block; }
  #overlay {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:12px;
    background:rgba(0,0,10,.78); border-radius:10px; text-align:center;
  }
  #overlay.hidden { display:none; }
  #overlay h2 { color:#ffe600; font-size:34px; letter-spacing:4px; }
  #overlay p { color:#aaa; font-size:14px; max-width:340px; line-height:1.5; }
  button {
    background:#ffe600; border:none; padding:12px 32px; font-size:18px;
    font-weight:bold; font-family:inherit; border-radius:8px; cursor:pointer;
  }
  button:hover { background:#fff; }
  #controls { margin-top:12px; color:#666; font-size:13px; }
  #touch { display:none; margin-top:12px; gap:8px; }
  #touch button { padding:12px 18px; font-size:20px; }
  @media (pointer:coarse) { #touch { display:grid; grid-template-columns:repeat(3,64px); } }
</style>
</head>
<body>
<h1>● PAC-MAN</h1>
<div id="hud">
  <div>SCORE <span id="score">0</span></div>
  <div>LIVES <span id="lives">❤❤❤</span></div>
  <div>LEVEL <span id="level">1</span></div>
  <div>HIGH <span id="high">0</span></div>
</div>
<div id="wrap">
  <canvas id="game" width="560" height="620"></canvas>
  <div id="overlay">
    <h2 id="ovTitle">PAC-MAN</h2>
    <p id="ovText">Eat all the dots. Avoid the ghosts — unless you grab a power pellet!<br><br>Arrows / WASD to move · P to pause</p>
    <button id="startBtn">▶ START</button>
  </div>
</div>
<div id="controls">⬅⬆⬇➎ or WASD · P pause · M mute</div>
<div id="touch">
  <span></span><button data-d="up">▲</button><span></span>
  <button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button>
</div>

<script>
"use strict";
// ---------- Maze: 28 cols x 31 rows ----------
// # wall, . dot, o power pellet, ' ' empty, - ghost house door
const MAP = [
  "############################",
  "#............##............#",
  "#.####.#####.##.#####.####.#",
  "#o####.#####.##.#####.####o#",
  "#.####.#####.##.#####.####.#",
  "#..........................#",
  "#.####.##.########.##.####.#",
  "#.####.##.########.##.####.#",
  "#......##....##....##......#",
  "######.##### ## #####.######",
  "     #.##### ## #####.#     ",
  "     #.##          ##.#     ",
  "     #.## ###--### ##.#     ",
  "######.## #      # ##.######",
  "      .   #      #   .      ",
  "######.## #      # ##.######",
  "     #.## ######## ##.#     ",
  "     #.##          ##.#     ",
  "     #.## ######## ##.#     ",
  "######.## ######## ##.######",
  "#............##............#",
  "#.####.#####.##.#####.####.#",
  "#.####.#####.##.#####.####.#",
  "#o..##.......  .......##..o#",
  "###.##.##.########.##.##.###",
  "###.##.##.########.##.##.###",
  "#......##....##....##......#",
  "#.##########.##.##########.#",
  "#.##########.##.##########.#",
  "#..........................#",
  "############################",
];
const COLS = 28, ROWS = 31, TILE = 20;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const levelEl = document.getElementById('level');
const highEl = document.getElementById('high');
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovText = document.getElementById('ovText');
const startBtn = document.getElementById('startBtn');

let grid, dotsLeft, score=0, lives=3, level=1, high=+(localStorage.getItem('pacman_high')||0);
let pac, ghosts, frightTimer=0, state='menu', paused=false, muted=false, mouth=0, ghostCombo=0;
let audioCtx=null;

highEl.textContent = high;

function buildGrid(){
  grid=[]; dotsLeft=0;
  for(let r=0;r<ROWS;r++){ grid.push([]);
    for(let c=0;c<COLS;c++){
      const ch=MAP[r][c]; grid[r].push(ch);
      if(ch==='.'||ch==='o') dotsLeft++;
    }
  }
}
const DIRS={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
function isWall(c,r){
  if(r<0||r>=ROWS) return false; // tunnel rows handled by wrap
  c=((c%COLS)+COLS)%COLS;
  const ch=grid[r][c];
  return ch==='#';
}
function isDoor(c,r){ return grid[r]&&grid[r][c]==='-'; }
function tileCenter(c,r){ return {x:c*TILE+TILE/2, y:r*TILE+TILE/2}; }

function resetActors(){
  pac={c:13.5,r:23,px:0,py:0,dir:DIRS.left,want:DIRS.left,speed:8.2,dead:false,deathT:0};
  // snap to tile center
  const p=tileCenter(13,23); pac.px=p.x; pac.py=p.y; pac.c=13; pac.r=23;
  const defs=[
    {name:'blinky',color:'#ff0000',c:13,r:11,scatter:{c:25,r:0}},
    {name:'pinky', color:'#ffb8ff',c:13,r:14,scatter:{c:2,r:0}},
    {name:'inky',  color:'#00ffff',c:12,r:14,scatter:{c:27,r:30}},
    {name:'clyde', color:'#ffb847',c:14,r:14,scatter:{c:0,r:30}},
  ];
  ghosts=defs.map((d,i)=>{
    const p2=tileCenter(d.c,d.r);
    return {...d,px:p2.x,py:p2.y,dir:i===0?DIRS.left:DIRS.up,mode:i===0?'chase':'house',houseT:i*180,scatterT:0,speed:7.4,eaten:false};
  });
  frightTimer=0; ghostCombo=0;
}

function beep(freq,dur,type='square',vol=0.05){
  if(muted) return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type;o.frequency.value=freq;g.gain.value=vol;
    o.connect(g);g.connect(audioCtx.destination);
    o.start();g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+dur);
    o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
const sfx={
  waka(){beep(520,0.07);setTimeout(()=>beep(320,0.07),60);},
  power(){beep(150,0.4,'sawtooth');},
  eat(){beep(880,0.15);setTimeout(()=>beep(1320,0.2),100);},
  death(){beep(600,0.15);setTimeout(()=>beep(400,0.15),150);setTimeout(()=>beep(200,0.3),300);},
};

// ---------- Ghost AI ----------
function ghostTarget(g){
  if(g.mode==='scatter') return g.scatter;
  if(g.mode==='fright') return {c:(Math.random()*COLS)|0,r:(Math.random()*ROWS)|0};
  const pc=Math.round(pac.c),pr=Math.round(pac.r);
  if(g.name==='blinky') return {c:pc,r:pr};
  if(g.name==='pinky') return {c:pc+pac.dir.x*4,r:pr+pac.dir.y*4};
  if(g.name==='inky'){
    const b=ghosts[0];
    return {c:pc*2-Math.round((b.px/TILE-0.5))+pac.dir.x*2, r:pr*2-Math.round((b.py/TILE-0.5))+pac.dir.y*2};
  }
  // clyde: chase until close, then scatter
  const gx=g.px/TILE,gy=g.py/TILE;
  const d=Math.hypot(gx-pc,gy-pr);
  return d>8?{c:pc,r:pr}:g.scatter;
}
function atCenter(e){
  const cx=(Math.round(e.px/TILE-0.5))*TILE+TILE/2;
  const cy=(Math.round(e.py/TILE-0.5))*TILE+TILE/2;
  return Math.abs(e.px-cx)<e.speed*0.6 && Math.abs(e.py-cy)<e.speed*0.6;
}
function chooseDir(g){
  const gc=Math.round(g.px/TILE-0.5), gr=Math.round(g.py/TILE-0.5);
  const t=ghostTarget(g);
  const opts=[DIRS.up,DIRS.left,DIRS.down,DIRS.right];
  let best=null,bd=1e9;
  for(const d of opts){
    if(d.x===-g.dir.x&&d.y===-g.dir.y) continue; // no reverse
    const nc=gc+d.x,nr=gr+d.y;
    if(isWall(nc,nr)) continue;
    if(isDoor(nc,nr)&&g.mode!=='house'&&!g.eaten) continue;
    // ghosts can't go up at these tiles (classic rule)
    if(d===DIRS.up&&((gc===12||gc===15)&&(gr===11||gr===23))) continue;
    const dist=(nc-t.c)**2+(nr-t.r)**2;
    if(dist<bd){bd=dist;best=d;}
  }
  return best||{x:-g.dir.x,y:-g.dir.y};
}

// ---------- Update ----------
function moveEntity(e,dt){
  e.px+=e.dir.x*e.speed*dt*60;
  e.py+=e.dir.y*e.speed*dt*60;
  // tunnel wrap
  if(e.px<-TILE/2) e.px=COLS*TILE+TILE/2;
  if(e.px>COLS*TILE+TILE/2) e.px=-TILE/2;
  e.c=e.px/TILE-0.5; e.r=e.py/TILE-0.5;
}
function update(dt){
  mouth+=dt*10;
  if(frightTimer>0){frightTimer-=dt;if(frightTimer<=0){ghosts.forEach(g=>{if(g.mode==='fright')g.mode=g.scatterT>0?'scatter':'chase';});}}
  // --- Pac-Man steering ---
  if(atCenter(pac)){
    const gc=Math.round(pac.px/TILE-0.5),gr=Math.round(pac.py/TILE-0.5);
    const cx=gc*TILE+TILE/2,cy=gr*TILE+TILE/2;
    pac.px=cx;pac.py=cy;
    if(!isWall(gc+pac.want.x,gr+pac.want.y)&&!isDoor(gc+pac.want.x,gr+pac.want.y)) pac.dir=pac.want;
    if(isWall(gc+pac.dir.x,gr+pac.dir.y)||isDoor(gc+pac.dir.x,gr+pac.dir.y)){
      // stopped at wall; still eat dot on tile
    } else moveEntity(pac,dt);
    // eat
    const ch=grid[gr]&&grid[gr][((gc%COLS)+COLS)%COLS];
    if(ch==='.'){grid[gr][gc]=' ';score+=10;dotsLeft--;sfx.waka();}
    else if(ch==='o'){grid[gr][gc]=' ';score+=50;dotsLeft--;frightTimer=7+level;ghostCombo=0;sfx.power();
      ghosts.forEach(g=>{if(g.mode!=='house'&&!g.eaten){g.mode='fright';}});
    }
    if(dotsLeft<=0){nextLevel();return;}
  } else moveEntity(pac,dt);

  // --- Ghosts ---
  // global mode timer: alternate scatter/chase
  for(const g of ghosts){
    if(g.mode==='house'){
      g.houseT-=dt*60;
      g.py+=Math.sin(performance.now()/200)*0.4;
      if(g.houseT<=0){g.mode='leave';}
      continue;
    }
    if(g.mode==='leave'){
      // move toward door exit (13-14, 11)
      const tx=13.5*TILE,ty=11*TILE+TILE/2;
      const dx=tx-g.px,dy=ty-g.py;
      const sp=g.speed*dt*60;
      if(Math.abs(dx)<sp&&Math.abs(dy)<sp){g.px=tx;g.py=ty;g.dir=DIRS.left;g.mode=frightTimer>0?'fright':'chase';}
      else{g.px+=Math.sign(dx)*Math.min(sp,Math.abs(dx));g.py+=Math.sign(dy)*Math.min(sp,Math.abs(dy));}
      continue;
    }
    const sp = g.eaten?12:(g.mode==='fright'?5.5:Math.min(7.4+level*0.25,10));
    g.speed=sp;
    if(atCenter(g)){
      const gc=Math.round(g.px/TILE-0.5),gr=Math.round(g.py/TILE-0.5);
      g.px=gc*TILE+TILE/2;g.py=gr*TILE+TILE/2;
      g.dir=chooseDir(g);
    }
    moveEntity(g,dt);
    if(g.eaten){
      const gc=Math.round(g.px/TILE-0.5),gr=Math.round(g.py/TILE-0.5);
      if(gc===13&&gr===11){g.eaten=false;g.mode='leave';}
    }
    // collision with pac
    const d=Math.hypot(g.px-pac.px,g.py-pac.py);
    if(d<TILE*0.7&&state==='play'){
      if(g.mode==='fright'&&!g.eaten){
        g.eaten=true;g.mode='chase';
        const pts=200*Math.pow(2,ghostCombo);ghostCombo=Math.min(ghostCombo+1,3);
        score+=pts;sfx.eat();
      } else if(!g.eaten){
        die();return;
      }
    }
  }
  if(score>high){high=score;localStorage.setItem('pacman_high',high);}
  scoreEl.textContent=score;highEl.textContent=high;
}

function die(){
  sfx.death();lives--;
  livesEl.textContent='❤'.repeat(Math.max(lives,0))||'—';
  if(lives<=0){gameOver(false);return;}
  pac.dead=true;state='dying';setTimeout(()=>{resetActors();state='play';},1200);
}
function nextLevel(){
  level++;levelEl.textContent=level;
  beep(660,0.12);setTimeout(()=>beep(880,0.12),130);setTimeout(()=>beep(1100,0.25),260);
  buildGrid();resetActors();
  // speed up slightly
  pac.speed+=0.4;
}
function gameOver(win){
  state='over';
  ovTitle.textContent=win?'YOU WIN!':'GAME OVER';
  ovText.innerHTML=`Final score: <b style="color:#ffe600">${score}</b><br>Level reached: ${level}<br><br>Press START to play again`;
  startBtn.textContent='↻ PLAY AGAIN';
  overlay.classList.remove('hidden');
}

// ---------- Render ----------
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // maze
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const x=c*TILE,y=r*TILE,ch=grid[r][c];
    if(ch==='#'){
      ctx.strokeStyle='#2121ff';ctx.lineWidth=2;
      // draw wall edges only where neighbor isn't wall (rounded look)
      ctx.beginPath();
      if(r>0&&grid[r-1][c]!=='#'){ctx.moveTo(x,y+1);ctx.lineTo(x+TILE,y+1);}
      if(r<ROWS-1&&grid[r+1][c]!=='#'){ctx.moveTo(x,y+TILE-1);ctx.lineTo(x+TILE,y+TILE-1);}
      if(c>0&&grid[r][c-1]!=='#'){ctx.moveTo(x+1,y);ctx.lineTo(x+1,y+TILE);}
      if(c<COLS-1&&grid[r][c+1]!=='#'){ctx.moveTo(x+TILE-1,y);ctx.lineTo(x+TILE-1,y+TILE);}
      ctx.stroke();
    } else if(ch==='.'){ctx.fillStyle='#ffb8ae';ctx.beginPath();ctx.arc(x+TILE/2,y+TILE/2,2.5,0,7);ctx.fill();}
    else if(ch==='o'){
      const p=3.5+Math.sin(performance.now()/250)*1.5;
      ctx.fillStyle='#ffb8ae';ctx.beginPath();ctx.arc(x+TILE/2,y+TILE/2,p,0,7);ctx.fill();
    } else if(ch==='-'){ctx.fillStyle='#ffb8de';ctx.fillRect(x,y+TILE/2-1,TILE,2);}
  }
  // ghost house
  // dots drawn; now pac
  if(state==='play'||state==='dying'||paused){
    const ang=Math.abs(Math.sin(mouth))*0.35;
    const base=Math.atan2(pac.dir.y,pac.dir.x);
    ctx.fillStyle='#ffe600';
    ctx.beginPath();ctx.moveTo(pac.px,pac.py);
    ctx.arc(pac.px,pac.py,9,base+ang,base+Math.PI*2-ang);ctx.closePath();ctx.fill();
    // eye
    ctx.fillStyle='#000';
  }
  for(const g of ghosts){
    const fright=g.mode==='fright';
    const body=fright?(Math.floor(performance.now()/300)%2?'#fff':'#2121ff'):g.color;
    const x=g.px,y=g.py;
    ctx.fillStyle=g.eaten?'transparent':body;
    if(!g.eaten){
      ctx.beginPath();
      ctx.arc(x,y-1,9,Math.PI,0);
      ctx.lineTo(x+9,y+8);
      for(let i=0;i<3;i++){ctx.lineTo(x+9-(i*6+3),y+5);ctx.lineTo(x+9-(i+1)*6,y+8);}
      ctx.lineTo(x-9,y+8);ctx.lineTo(x-9,y-1);
      ctx.fill();
    }
    // eyes
    const ex=g.dir.x*2.5,ey=g.dir.y*2.5;
    if(!fright||g.eaten){
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(x-3.5+ex,y-3+ey,2.8,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(x+3.5+ex,y-3+ey,2.8,0,7);ctx.fill();
      ctx.fillStyle='#000';
      ctx.beginPath();ctx.arc(x-3.5+ex*1.6,y-3+ey*1.6,1.4,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(x+3.5+ex*1.6,y-3+ey*1.6,1.4,0,7);ctx.fill();
    } else {
      ctx.fillStyle=fright&&g.mode==='fright'?'#ff0000':'#fff';
      ctx.font='bold 9px monospace';ctx.textAlign='center';
      ctx.fillText('◔◔',x,y+2);
    }
  }
  if(state==='dying'){
    // simple death flash
    ctx.fillStyle='rgba(255,0,0,.25)';ctx.fillRect(0,0,canvas.width,canvas.height);
  }
  if(paused&&state==='play'){
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#ffe600';ctx.font='bold 32px monospace';ctx.textAlign='center';
    ctx.fillText('PAUSED',canvas.width/2,canvas.height/2);
  }
}

// ---------- Loop ----------
let last=0;
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min((t-last)/1000||0,0.05);last=t;
  if(state==='play'&&!paused) update(dt);
  if(state!=='menu') draw();
}

// ---------- Input ----------
function setWant(d){pac.want=DIRS[d];}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  const map={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'};
  if(map[k]){setWant(map[k]);e.preventDefault();if(state==='menu')startGame();}
  if(k==='p'&&state==='play')paused=!paused;
  if(k==='m')muted=!muted;
  if(k==='enter'&&state!=='play')startGame();
});
document.querySelectorAll('#touch button').forEach(b=>b.addEventListener('click',()=>setWant(b.dataset.d)));
// swipe
let tsx=0,tsy=0;
canvas.addEventListener('touchstart',e=>{tsx=e.touches[0].clientX;tsy=e.touches[0].clientY;},{passive:true});
canvas.addEventListener('touchmove',e=>{
  const dx=e.touches[0].clientX-tsx,dy=e.touches[0].clientY-tsy;
  if(Math.abs(dx)>24||Math.abs(dy)>24){setWant(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));tsx=e.touches[0].clientX;tsy=e.touches[0].clientY;}
  e.preventDefault();
},{passive:false});

function startGame(){
  score=0;lives=3;level=1;
  scoreEl.textContent='0';livesEl.textContent='❤❤❤';levelEl.textContent='1';
  buildGrid();resetActors();
  pac.speed=8.2;
  state='play';paused=false;
  overlay.classList.add('hidden');
  beep(440,0.1);setTimeout(()=>beep(660,0.1),110);setTimeout(()=>beep(880,0.2),220);
}
startBtn.addEventListener('click',startGame);

// scatter/chase wave timer
setInterval(()=>{
  if(state!=='play'||paused)return;
  ghosts.forEach(g=>{
    if(g.mode==='scatter'){g.mode=frightTimer>0?'fright':'chase';}
    else if(g.mode==='chase'&&frightTimer<=0){/* stay; flip periodically */ }
  });
},7000);

buildGrid();resetActors();
requestAnimationFrame(loop);
</script>
</body>
</html>
