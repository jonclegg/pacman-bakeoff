<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pac Grid</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Courier New", monospace;
        background: #090b1b;
        color: #f9f7e8;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 0%, #202852 0, transparent 42%),
          linear-gradient(135deg, #0a0b1d, #13102d 65%, #070916);
      }

      main {
        width: min(100%, 750px);
        padding: 28px 20px;
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 7px;
        color: #64edff;
        font-size: 0.72rem;
        font-weight: bold;
        letter-spacing: 0.24em;
      }

      h1 {
        margin: 0;
        color: #ffd82a;
        font-size: clamp(2.4rem, 9vw, 4.8rem);
        letter-spacing: -0.11em;
        line-height: 0.9;
        text-shadow: 4px 4px 0 #d94bba;
      }

      .subtitle {
        margin: 14px 0 22px;
        color: #b9bcdf;
        font-size: 0.83rem;
        letter-spacing: 0.04em;
      }

      .scoreboard {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        max-width: 590px;
        margin: 0 auto 14px;
      }

      .stat {
        border: 2px solid #3f4381;
        border-radius: 8px;
        padding: 9px 8px 8px;
        background: #111431;
      }

      .stat span {
        display: block;
        color: #aeb3e4;
        font-size: 0.62rem;
        letter-spacing: 0.11em;
      }

      .stat strong {
        color: #fff6bc;
        font-size: clamp(1rem, 4vw, 1.35rem);
      }

      .game-frame {
        position: relative;
        overflow: hidden;
        max-width: 592px;
        margin: auto;
        border: 4px solid #5559a8;
        border-radius: 12px;
        background: #050613;
        box-shadow: 0 0 0 5px #171a42, 0 22px 60px #000a;
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        image-rendering: pixelated;
        touch-action: none;
      }

      .message {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
      }

      .message p {
        margin: 0;
        padding: 10px 15px;
        border: 2px solid #f1e064;
        background: #07091ccc;
        color: #fff9bd;
        font-size: clamp(0.72rem, 3vw, 1rem);
        font-weight: bold;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        animation: pulse 1s steps(2) infinite;
      }

      .message.hidden { display: none; }

      .controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px 18px;
        margin: 17px 0 0;
        color: #aeb3df;
        font-size: 0.72rem;
        line-height: 1.5;
      }

      kbd {
        border: 1px solid #585eaa;
        border-bottom-width: 3px;
        border-radius: 4px;
        padding: 2px 5px;
        color: #fff;
        font: inherit;
      }

      @keyframes pulse { 50% { opacity: 0.45; } }

      @media (max-width: 400px) {
        main { padding: 20px 10px; }
        .scoreboard { gap: 5px; }
        .stat { padding: 7px 3px; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">ARCADE MODE · 01 PLAYER</p>
      <h1>PAC GRID</h1>
      <p class="subtitle">Clear the dots. Outsmart the ghosts. Don’t look back.</p>

      <section class="scoreboard" aria-label="Game score">
        <div class="stat"><span>SCORE</span><strong id="score">00000</strong></div>
        <div class="stat"><span>DOTS LEFT</span><strong id="dots">000</strong></div>
        <div class="stat"><span>BEST</span><strong id="best">00000</strong></div>
      </section>

      <div class="game-frame">
        <canvas id="game" aria-label="Pac Grid game board"></canvas>
        <div class="message" id="message"><p>Press a direction to start</p></div>
      </div>

      <div class="controls">
        <span><kbd>←</kbd> <kbd>↑</kbd> <kbd>↓</kbd> <kbd>→</kbd> or <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> to move</span>
        <span>Swipe on the board on touch devices</span>
        <span><kbd>R</kbd> to restart</span>
      </div>
    </main>

    <script>
      const layout = [
        "#####################",
        "#.........#.........#",
        "#.###.###.#.###.###.#",
        "#o###.###.#.###.###o#",
        "#...................#",
        "#.###.#.#####.#.###.#",
        "#.....#...#...#.....#",
        "#####.###.#.###.#####",
        "#...#.#.##G##.#.#...#",
        "#.###.#.#GGG#.#.###.#",
        "#.....#.#GGG#.#.....#",
        "#.###.#.#####.#.###.#",
        "#...#...........#...#",
        "###.#.###.#.###.#.###",
        "#.....#...#...#.....#",
        "#.#####.#####.#####.#",
        "#o.................o#",
        "#.#######.#.#######.#",
        "#.........P.........#",
        "#.#################.#",
        "#####################",
      ];

      const tile = 28;
      const canvas = document.querySelector("#game");
      const context = canvas.getContext("2d");
      const scoreElement = document.querySelector("#score");
      const dotsElement = document.querySelector("#dots");
      const bestElement = document.querySelector("#best");
      const messageElement = document.querySelector("#message");
      const width = layout[0].length;
      const height = layout.length;
      const directions = {
        ArrowUp: { x: 0, y: -1, angle: -Math.PI / 2 },
        ArrowDown: { x: 0, y: 1, angle: Math.PI / 2 },
        ArrowLeft: { x: -1, y: 0, angle: Math.PI },
        ArrowRight: { x: 1, y: 0, angle: 0 },
      };
      const keyDirections = {
        w: directions.ArrowUp, a: directions.ArrowLeft, s: directions.ArrowDown, d: directions.ArrowRight,
      };
      const ghostColors = ["#ff4f89", "#48d9ff", "#ff9e43", "#ad7aff", "#52e5ae", "#ff6a5c", "#f2d94e"];

      canvas.width = width * tile;
      canvas.height = height * tile;
      let game;
      let lastFrame = 0;
      let touchStart;

      function key(x, y) {
        return `${x},${y}`;
      }

      function opposite(first, second) {
        return first && first.x === -second.x && first.y === -second.y;
      }

      function createGame() {
        const pellets = new Set();
        const powerPellets = new Set();
        const ghosts = [];
        let player;

        layout.forEach((row, y) => {
          [...row].forEach((cell, x) => {
            if (cell === ".") pellets.add(key(x, y));
            if (cell === "o") powerPellets.add(key(x, y));
            if (cell === "P") player = { x, y, direction: directions.ArrowLeft, queued: directions.ArrowLeft };
            if (cell === "G") ghosts.push({
              x, y, homeX: x, homeY: y, direction: directions.ArrowUp, color: ghostColors[ghosts.length],
            });
          });
        });

        return {
          pellets,
          powerPellets,
          ghosts,
          player,
          score: 0,
          best: Number(localStorage.getItem("pac-grid-best") || 0),
          state: "ready",
          playerTimer: 0,
          ghostTimer: 0,
          frightened: 0,
          animation: 0,
        };
      }

      function isWall(x, y) {
        return y < 0 || y >= height || x < 0 || x >= width || layout[y][x] === "#";
      }

      function canMove(actor, direction) {
        return !isWall(actor.x + direction.x, actor.y + direction.y);
      }

      function updateScore() {
        const dots = game.pellets.size + game.powerPellets.size;
        scoreElement.textContent = String(game.score).padStart(5, "0");
        dotsElement.textContent = String(dots).padStart(3, "0");
        bestElement.textContent = String(game.best).padStart(5, "0");
      }

      function showMessage(text) {
        messageElement.querySelector("p").textContent = text;
        messageElement.classList.remove("hidden");
      }

      function hideMessage() {
        messageElement.classList.add("hidden");
      }

      function setDirection(direction) {
        if (game.state === "over" || game.state === "won") {
          reset();
        }
        game.player.queued = direction;
        if (game.state === "ready") {
          game.state = "playing";
          hideMessage();
        }
      }

      function eatAtPlayer() {
        const position = key(game.player.x, game.player.y);
        if (game.pellets.delete(position)) game.score += 10;
        if (game.powerPellets.delete(position)) {
          game.score += 50;
          game.frightened = 7000;
        }
        if (game.pellets.size + game.powerPellets.size === 0) {
          game.state = "won";
          game.best = Math.max(game.best, game.score);
          localStorage.setItem("pac-grid-best", game.best);
          showMessage("Board clear! Press a direction");
        }
        updateScore();
      }

      function movePlayer() {
        const { player } = game;
        if (canMove(player, player.queued)) player.direction = player.queued;
        if (!canMove(player, player.direction)) return;
        player.x += player.direction.x;
        player.y += player.direction.y;
        eatAtPlayer();
      }

      function ghostOptions(ghost) {
        return Object.values(directions).filter((direction) => canMove(ghost, direction));
      }

      function moveGhost(ghost) {
        let options = ghostOptions(ghost);
        const withoutReverse = options.filter((direction) => !opposite(direction, ghost.direction));
        if (withoutReverse.length) options = withoutReverse;

        const playerDistance = (direction) => {
          const x = ghost.x + direction.x;
          const y = ghost.y + direction.y;
          return Math.abs(x - game.player.x) + Math.abs(y - game.player.y);
        };
        options.sort((first, second) => {
          const delta = playerDistance(first) - playerDistance(second);
          return game.frightened > 0 ? -delta : delta;
        });
        const tie = options.filter((direction) => playerDistance(direction) === playerDistance(options[0]));
        ghost.direction = tie[Math.floor(Math.random() * tie.length)];
        ghost.x += ghost.direction.x;
        ghost.y += ghost.direction.y;
      }

      function resetGhost(ghost) {
        ghost.x = ghost.homeX;
        ghost.y = ghost.homeY;
        ghost.direction = directions.ArrowUp;
      }

      function checkCollisions() {
        game.ghosts.forEach((ghost) => {
          if (ghost.x !== game.player.x || ghost.y !== game.player.y) return;
          if (game.frightened > 0) {
            game.score += 200;
            resetGhost(ghost);
            updateScore();
            return;
          }
          game.state = "over";
          game.best = Math.max(game.best, game.score);
          localStorage.setItem("pac-grid-best", game.best);
          updateScore();
          showMessage("Caught! Press a direction");
        });
      }

      function update(delta) {
        if (game.state !== "playing") return;
        game.animation += delta;
        game.frightened = Math.max(0, game.frightened - delta);
        game.playerTimer += delta;
        game.ghostTimer += delta;

        if (game.playerTimer >= 112) {
          game.playerTimer = 0;
          movePlayer();
          checkCollisions();
        }
        if (game.state === "playing" && game.ghostTimer >= 154) {
          game.ghostTimer = 0;
          game.ghosts.forEach(moveGhost);
          checkCollisions();
        }
      }

      function drawWall(x, y) {
        context.fillStyle = "#18206c";
        context.fillRect(x * tile, y * tile, tile, tile);
        context.strokeStyle = "#5563ff";
        context.lineWidth = 2;
        context.strokeRect(x * tile + 1, y * tile + 1, tile - 2, tile - 2);
      }

      function drawGhost(ghost) {
        const x = ghost.x * tile + tile / 2;
        const y = ghost.y * tile + tile / 2;
        const frightened = game.frightened > 0;
        context.fillStyle = frightened ? (game.frightened < 1800 ? "#f4f2e0" : "#2e6df6") : ghost.color;
        context.beginPath();
        context.arc(x, y - 3, 10, Math.PI, 0);
        context.lineTo(x + 10, y + 9);
        context.lineTo(x + 5, y + 5);
        context.lineTo(x, y + 9);
        context.lineTo(x - 5, y + 5);
        context.lineTo(x - 10, y + 9);
        context.lineTo(x - 10, y - 3);
        context.fill();
        if (!frightened) {
          context.fillStyle = "#fff";
          context.beginPath();
          context.arc(x - 4, y - 2, 3, 0, Math.PI * 2);
          context.arc(x + 4, y - 2, 3, 0, Math.PI * 2);
          context.fill();
          context.fillStyle = "#12143c";
          context.beginPath();
          context.arc(x - 3, y - 2, 1.4, 0, Math.PI * 2);
          context.arc(x + 5, y - 2, 1.4, 0, Math.PI * 2);
          context.fill();
        }
      }

      function drawPlayer() {
        const { player } = game;
        const x = player.x * tile + tile / 2;
        const y = player.y * tile + tile / 2;
        const mouth = 0.16 + Math.abs(Math.sin(game.animation / 95)) * 0.2;
        context.fillStyle = "#ffda31";
        context.beginPath();
        context.moveTo(x, y);
        context.arc(x, y, 11, player.direction.angle + mouth, player.direction.angle + Math.PI * 2 - mouth);
        context.fill();
      }

      function render() {
        context.fillStyle = "#050613";
        context.fillRect(0, 0, canvas.width, canvas.height);
        layout.forEach((row, y) => {
          [...row].forEach((cell, x) => {
            if (cell === "#") drawWall(x, y);
            const position = key(x, y);
            if (game.pellets.has(position)) {
              context.fillStyle = "#fff7c6";
              context.fillRect(x * tile + 12, y * tile + 12, 4, 4);
            }
            if (game.powerPellets.has(position)) {
              context.fillStyle = "#fff0a0";
              context.beginPath();
              context.arc(x * tile + tile / 2, y * tile + tile / 2, 6 + Math.sin(game.animation / 140) * 1.5, 0, Math.PI * 2);
              context.fill();
            }
          });
        });
        game.ghosts.forEach(drawGhost);
        drawPlayer();
      }

      function reset() {
        game = createGame();
        showMessage("Press a direction to start");
        updateScore();
      }

      function frame(timestamp) {
        const delta = Math.min(timestamp - lastFrame, 100);
        lastFrame = timestamp;
        update(delta);
        render();
        requestAnimationFrame(frame);
      }

      document.addEventListener("keydown", (event) => {
        const direction = directions[event.key] || keyDirections[event.key.toLowerCase()];
        if (direction) {
          event.preventDefault();
          setDirection(direction);
        }
        if (event.key.toLowerCase() === "r") reset();
      });

      canvas.addEventListener("pointerdown", (event) => {
        touchStart = { x: event.clientX, y: event.clientY };
      });

      canvas.addEventListener("pointerup", (event) => {
        if (!touchStart) return;
        const deltaX = event.clientX - touchStart.x;
        const deltaY = event.clientY - touchStart.y;
        touchStart = undefined;
        if (Math.max(Math.abs(deltaX), Math.abs(deltaY)) < 20) return;
        setDirection(Math.abs(deltaX) > Math.abs(deltaY)
          ? (deltaX > 0 ? directions.ArrowRight : directions.ArrowLeft)
          : (deltaY > 0 ? directions.ArrowDown : directions.ArrowUp));
      });

      reset();
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
