name: Deploy Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Every deploy publishes both branches: main at the root, dev under /dev/.
      - uses: actions/checkout@v5
        with:
          ref: main
          path: site
      - uses: actions/checkout@v5
        with:
          ref: dev
          path: site/dev
      - uses: actions/configure-pages@v5
      # A re-run keeps the previous attempt's artifact. deploy-pages errors if two are named github-pages.
      - name: Remove stale github-pages artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "github-pages") | .id')"
          if [ -z "$ids" ]; then
            exit 0
          fi
          for id in $ids; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
          done
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
