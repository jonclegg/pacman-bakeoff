name: Deploy Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Every deploy publishes both branches: main at the root, dev under /dev/.
      - uses: actions/checkout@v5
        with:
          ref: main
          path: site
      - uses: actions/checkout@v5
        with:
          ref: dev
          path: site/dev
      - uses: actions/configure-pages@v5
      # A re-run keeps the previous attempt's artifact. deploy-pages errors if two are named github-pages.
      - name: Remove stale github-pages artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "github-pages") | .id')"
          if [ -z "$ids" ]; then
            exit 0
          fi
          for id in $ids; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
          done
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  # Mirrors main to https://wooten-labs.com/pacman-bench/ (S3 bucket behind CloudFront).
  # The AWS role only trusts this repo's main branch and can only write under pacman-bench/.
  wooten-labs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: wooten-labs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Stage the gallery with the wooten-labs.com analytics tag
        run: |
          set -euo pipefail
          mkdir stage
          cp -R index.html arcade.css arcade.js entries stage/
          perl -0pi -e 's{^  </head>}{  <script src="/w.js" defer></script>\n</head>}m' stage/index.html
          grep -q '<script src="/w.js" defer></script>' stage/index.html
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::423173602168:role/GitHubActions-PacmanBench
          aws-region: us-east-1
      - name: Upload and clear the CDN cache
        run: |
          set -euo pipefail
          aws s3 sync stage/ s3://wooten-labs-site-423173602168/pacman-bench/ --delete --only-show-errors
          aws cloudfront create-invalidation --distribution-id E3NNL0QRWXIH24 --paths '/pacman-bench/*'
