name: Gallery tests

on:
  pull_request:
  # main and dev run these through the Pages deploy, which needs them to pass.
  push:
    branches-ignore: [main, dev]
  workflow_call:
    inputs:
      # Deploys skip the scroll frame-budget test: it times frames on GitHub's shared
      # machines and fails on a slow one with no change to the site. PRs still run it.
      skip_scroll_budget:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test ${{ inputs.skip_scroll_budget && '--grep-invert "scrolling the whole gallery stays within the frame budget"' || '' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
