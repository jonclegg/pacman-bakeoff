<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060816">
  <title>Neon Maze — Arcade Chase</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f8fbff;
      --muted: #8791b2;
      --panel: rgba(13, 17, 40, .78);
      --line: rgba(115, 133, 255, .2);
      --blue: #536dff;
      --cyan: #23e6ff;
      --yellow: #ffd84a;
      --pink: #ff4e91;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      overflow-x: hidden;
      font-family: Inter, ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 16%, rgba(83, 109, 255, .13), transparent 27rem),
        radial-gradient(circle at 82% 86%, rgba(255, 78, 145, .08), transparent 27rem),
        #060816;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .2;
      background-image: radial-gradient(rgba(255,255,255,.45) .55px, transparent .55px);
      background-size: 19px 19px;
      mask-image: linear-gradient(to bottom, black, transparent 72%);
    }

    button { font: inherit; }

    .shell {
      position: relative;
      width: min(1120px, 100%);
      min-height: 100dvh;
      margin: 0 auto;
      padding: 28px clamp(16px, 4vw, 48px) 24px;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--cyan);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .25em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 51px);
      line-height: .88;
      letter-spacing: -.055em;
      text-transform: uppercase;
    }

    h1 span {
      color: transparent;
      -webkit-text-stroke: 1.5px var(--yellow);
      filter: drop-shadow(0 0 10px rgba(255, 216, 74, .32));
    }

    .status-pill {
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #bdc5df;
      background: rgba(11, 14, 31, .72);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .08em;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .status-pill::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 7px;
      border-radius: 50%;
      vertical-align: 1px;
      background: #41f19a;
      box-shadow: 0 0 10px #41f19a;
    }

    .game-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 244px;
      align-items: start;
      gap: 18px;
      flex: 1;
    }

    .cabinet {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(18, 23, 52, .93), rgba(8, 11, 27, .94));
      box-shadow: 0 28px 70px rgba(0, 0, 0, .45), inset 0 1px rgba(255,255,255,.04);
    }

    .scoreboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 15px 18px 12px;
      border-bottom: 1px solid rgba(117, 133, 239, .12);
      background: rgba(5, 8, 23, .56);
    }

    .stat { min-width: 0; }
    .stat:nth-child(2) { text-align: center; }
    .stat:last-child { text-align: right; }

    .stat-label {
      display: block;
      margin-bottom: 3px;
      color: #697394;
      font-size: 9px;
      font-weight: 850;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .stat-value {
      display: block;
      overflow: hidden;
      font-size: clamp(16px, 3vw, 24px);
      font-weight: 850;
      letter-spacing: .035em;
      text-overflow: ellipsis;
    }

    .screen {
      position: relative;
      padding: clamp(10px, 2.5vw, 18px);
      background:
        linear-gradient(rgba(5, 7, 20, .9), rgba(4, 6, 16, .96)),
        repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(255,255,255,.014) 4px);
    }

    canvas {
      display: block;
      width: 100%;
      max-height: calc(100dvh - 210px);
      margin: auto;
      outline: none;
      aspect-ratio: 21 / 23;
      object-fit: contain;
      image-rendering: auto;
      touch-action: none;
      filter: saturate(1.08);
    }

    .screen::after {
      content: "";
      position: absolute;
      inset: 12px;
      pointer-events: none;
      border-radius: 8px;
      box-shadow: inset 0 0 30px rgba(3, 4, 13, .4);
    }

    aside {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel {
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: inset 0 1px rgba(255,255,255,.03);
      backdrop-filter: blur(18px);
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 0 13px;
      color: #d8ddf0;
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(3, 34px);
      grid-template-rows: repeat(2, 34px);
      justify-content: center;
      gap: 5px;
      margin: 6px 0 15px;
    }

    .key {
      display: grid;
      place-items: center;
      border: 1px solid rgba(145, 155, 212, .2);
      border-bottom-color: rgba(145, 155, 212, .35);
      border-radius: 8px;
      color: #dce2f7;
      background: rgba(31, 38, 74, .65);
      box-shadow: 0 3px 0 rgba(0,0,0,.24);
      font-size: 14px;
      font-weight: 850;
    }

    .key.up { grid-column: 2; }
    .key.left { grid-column: 1; grid-row: 2; }
    .key.down { grid-column: 2; grid-row: 2; }
    .key.right { grid-column: 3; grid-row: 2; }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.55;
      text-align: center;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 46px;
      gap: 8px;
    }

    .btn {
      min-height: 44px;
      border: 1px solid rgba(112, 130, 246, .26);
      border-radius: 11px;
      color: #f7f9ff;
      background: linear-gradient(180deg, rgba(75, 93, 193, .42), rgba(45, 57, 128, .38));
      cursor: pointer;
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .09em;
      text-transform: uppercase;
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }

    .btn:hover {
      border-color: rgba(123, 143, 255, .6);
      background: linear-gradient(180deg, rgba(86, 105, 221, .54), rgba(45, 57, 128, .45));
      transform: translateY(-1px);
    }

    .btn:active { transform: translateY(1px); }
    .btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

    .icon-btn {
      padding: 0;
      font-size: 17px;
      letter-spacing: 0;
    }

    .legend {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 8px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #9da6c4;
      font-size: 10px;
      font-weight: 700;
    }

    .dot, .power {
      flex: 0 0 auto;
      border-radius: 50%;
      background: #ffe6b1;
      box-shadow: 0 0 7px rgba(255, 230, 177, .5);
    }

    .dot { width: 5px; height: 5px; }
    .power { width: 11px; height: 11px; }

    .ghost-chip {
      width: 13px;
      height: 12px;
      border-radius: 7px 7px 3px 3px;
      background: var(--pink);
      box-shadow: 0 0 7px rgba(255, 78, 145, .45);
    }

    .pac-chip {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: conic-gradient(from 43deg, transparent 0 20%, var(--yellow) 21%);
      box-shadow: 0 0 7px rgba(255, 216, 74, .45);
    }

    .mobile-pad {
      display: none;
      width: 190px;
      height: 132px;
      margin: 14px auto 0;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(2, 56px);
      justify-content: center;
      gap: 8px;
    }

    .pad-btn {
      border: 1px solid rgba(119, 138, 255, .32);
      border-radius: 15px;
      color: #ebefff;
      background: rgba(41, 51, 106, .56);
      font-size: 20px;
      font-weight: 900;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .pad-btn:active { background: rgba(83, 109, 255, .6); transform: scale(.96); }
    .pad-btn[data-dir="up"] { grid-column: 2; }
    .pad-btn[data-dir="left"] { grid-column: 1; grid-row: 2; }
    .pad-btn[data-dir="down"] { grid-column: 2; grid-row: 2; }
    .pad-btn[data-dir="right"] { grid-column: 3; grid-row: 2; }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding-top: 17px;
      color: #4e5878;
      font-size: 9px;
      font-weight: 750;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    @media (max-width: 800px) {
      .shell { padding-top: 20px; }
      .game-layout { grid-template-columns: 1fr; }
      aside { display: grid; grid-template-columns: 1fr 1fr; }
      .panel.controls { display: none; }
      .panel.legend-panel { display: flex; flex-direction: column; justify-content: center; }
      canvas { max-height: none; }
      .mobile-pad { display: grid; }
    }

    @media (max-width: 500px) {
      header { align-items: center; margin-bottom: 14px; }
      .status-pill { padding: 7px 9px; font-size: 9px; }
      .cabinet { border-radius: 17px; }
      .scoreboard { padding: 12px 14px 10px; }
      .screen { padding: 8px; }
      aside { grid-template-columns: 1fr; }
      .panel.legend-panel { display: none; }
      .panel { padding: 13px; }
      .mobile-pad { margin-top: 9px; }
      footer span:last-child { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">Signal Arcade / 01</p>
        <h1>Neon <span>Maze</span></h1>
      </div>
      <div class="status-pill" id="statusPill">Ready</div>
    </header>

    <section class="game-layout" aria-label="Neon Maze game">
      <div>
        <div class="cabinet">
          <div class="scoreboard">
            <div class="stat">
              <span class="stat-label">Score</span>
              <span class="stat-value" id="score">000000</span>
            </div>
            <div class="stat">
              <span class="stat-label">High score</span>
              <span class="stat-value" id="highScore">000000</span>
            </div>
            <div class="stat">
              <span class="stat-label">Level</span>
              <span class="stat-value" id="level">01</span>
            </div>
          </div>
          <div class="screen">
            <canvas id="game" width="630" height="690" tabindex="0"
              aria-label="Pac-Man style maze. Use arrow keys or WASD to move."></canvas>
          </div>
        </div>

        <div class="mobile-pad" aria-label="Touch controls">
          <button class="pad-btn" data-dir="up" aria-label="Move up">↑</button>
          <button class="pad-btn" data-dir="left" aria-label="Move left">←</button>
          <button class="pad-btn" data-dir="down" aria-label="Move down">↓</button>
          <button class="pad-btn" data-dir="right" aria-label="Move right">→</button>
        </div>
      </div>

      <aside>
        <section class="panel controls">
          <h2 class="panel-title"><span>Controls</span><span>WASD</span></h2>
          <div class="keys" aria-hidden="true">
            <div class="key up">↑</div>
            <div class="key left">←</div>
            <div class="key down">↓</div>
            <div class="key right">→</div>
          </div>
          <p class="hint">Clear the maze. Power orbs turn the hunters vulnerable.</p>
        </section>

        <section class="panel">
          <h2 class="panel-title"><span>Game</span><span id="livesText">● ● ●</span></h2>
          <div class="actions">
            <button class="btn" id="pauseBtn">Pause</button>
            <button class="btn icon-btn" id="soundBtn" aria-label="Mute sound" title="Mute sound">♪</button>
            <button class="btn" id="restartBtn" style="grid-column: 1 / -1">New game</button>
          </div>
        </section>

        <section class="panel legend-panel">
          <h2 class="panel-title"><span>Field guide</span></h2>
          <div class="legend">
            <div class="legend-item"><i class="dot"></i><span>10 pts</span></div>
            <div class="legend-item"><i class="power"></i><span>50 pts</span></div>
            <div class="legend-item"><i class="ghost-chip"></i><span>Hunter</span></div>
            <div class="legend-item"><i class="pac-chip"></i><span>You</span></div>
          </div>
        </section>
      </aside>
    </section>

    <footer>
      <span>© 1980-ish / Rewired 2026</span>
      <span>Space to pause · R to restart</span>
    </footer>
  </main>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const highScoreEl = document.getElementById("highScore");
      const levelEl = document.getElementById("level");
      const livesEl = document.getElementById("livesText");
      const statusEl = document.getElementById("statusPill");
      const pauseBtn = document.getElementById("pauseBtn");
      const restartBtn = document.getElementById("restartBtn");
      const soundBtn = document.getElementById("soundBtn");

      const TILE = 30;
      const COLS = 21;
      const ROWS = 23;
      const WIDTH = COLS * TILE;
      const HEIGHT = ROWS * TILE;
      const TAU = Math.PI * 2;

      const MAZE_TEMPLATE = [
        "#####################",
        "#.........#.........#",
        "#.###.###.#.###.###.#",
        "#o###.###.#.###.###o#",
        "#...................#",
        "#.###.#.#####.#.###.#",
        "#.....#...#...#.....#",
        "#####.### # ###.#####",
        "    #.#       #.#    ",
        "#####.# ##=## #.#####",
        "     .  #GGG#  .     ",
        "#####.# #GGG# #.#####",
        "    #.# ##### #.#    ",
        "#####.#       #.#####",
        "#.........#.........#",
        "#.###.###.#.###.###.#",
        "#o..#.....P.....#..o#",
        "###.#.#.#####.#.#.###",
        "#.....#...#...#.....#",
        "#.#######.#.#######.#",
        "#...................#",
        "#.###.#####.#####.###",
        "#####################"
      ];

      const DIRS = {
        left:  { x: -1, y: 0, angle: Math.PI },
        right: { x: 1, y: 0, angle: 0 },
        up:    { x: 0, y: -1, angle: -Math.PI / 2 },
        down:  { x: 0, y: 1, angle: Math.PI / 2 }
      };
      const DIR_NAMES = Object.keys(DIRS);
      const OPPOSITE = { left: "right", right: "left", up: "down", down: "up" };
      const GHOST_DATA = [
        { color: "#ff4e67", name: "blaze", corner: { c: 19, r: 1 } },
        { color: "#ff72cf", name: "rose", corner: { c: 1, r: 1 } },
        { color: "#31e7ef", name: "spark", corner: { c: 19, r: 21 } },
        { color: "#ffac45", name: "ember", corner: { c: 1, r: 21 } }
      ];

      let maze;
      let pellets;
      let player;
      let ghosts;
      let score = 0;
      let highScore = loadHighScore();
      let level = 1;
      let lives = 3;
      let state = "ready";
      let muted = false;
      let frightenedUntil = 0;
      let ghostChain = 0;
      let readyUntil = 0;
      let levelStartedAt = 0;
      let lastTime = performance.now();
      let animationId;
      let audioContext;
      let wakaFlip = false;
      let flashText = "";
      let flashUntil = 0;

      canvas.width = WIDTH;
      canvas.height = HEIGHT;

      function loadHighScore() {
        try {
          return Number(localStorage.getItem("neon-maze-high-score")) || 0;
        } catch {
          return 0;
        }
      }

      function saveHighScore() {
        try {
          localStorage.setItem("neon-maze-high-score", String(highScore));
        } catch { /* Private browsing can reject storage. */ }
      }

      function tileAt(c, r) {
        if (c < 0 || c >= COLS) return " ";
        if (r < 0 || r >= ROWS) return "#";
        return maze[r][c];
      }

      function canEnter(c, r, isGhost = false) {
        const tile = tileAt(c, r);
        if (tile === "#") return false;
        if (tile === "=" && !isGhost) return false;
        return true;
      }

      function normalizeColumn(c) {
        if (c < 0) return COLS - 1;
        if (c >= COLS) return 0;
        return c;
      }

      function makeEntity(c, r, dir, speed) {
        return {
          c, r, fromC: c, fromR: r, toC: c, toR: r,
          dir, desired: dir, progress: 1, speed
        };
      }

      function resetMaze() {
        maze = MAZE_TEMPLATE.map(row => row.split(""));
        pellets = 0;
        maze.forEach(row => row.forEach((tile, c) => {
          if (tile === "." || tile === "o") pellets++;
          if (tile === "P" || tile === "G") row[c] = " ";
        }));
      }

      function resetActors(now, initial = false) {
        player = makeEntity(10, 16, "left", Math.min(7.2, 5.9 + level * .13));
        player.desired = "left";

        const starts = [
          { c: 10, r: 8, dir: "left" },
          { c: 9, r: 10, dir: "up" },
          { c: 10, r: 10, dir: "up" },
          { c: 11, r: 10, dir: "up" }
        ];
        ghosts = GHOST_DATA.map((data, index) => {
          const start = starts[index];
          return {
            ...makeEntity(start.c, start.r, start.dir, Math.min(6.5, 4.55 + level * .14)),
            ...data,
            spawnC: start.c,
            spawnR: start.r,
            releaseAt: now + (initial ? index * 1450 : index * 650),
            eaten: false,
            turnSeed: index * 1.73
          };
        });

        frightenedUntil = 0;
        ghostChain = 0;
        state = "ready";
        readyUntil = now + 1250;
        flashText = initial ? "READY!" : "KEEP GOING";
        flashUntil = readyUntil;
        updateHud();
      }

      function newGame() {
        score = 0;
        level = 1;
        lives = 3;
        resetMaze();
        resetActors(performance.now(), true);
        levelStartedAt = performance.now();
        tone(220, .08, "square", .025);
        canvas.focus({ preventScroll: true });
      }

      function nextLevel(now) {
        level++;
        resetMaze();
        resetActors(now, true);
        levelStartedAt = now;
        flashText = "LEVEL " + level;
        flashUntil = readyUntil;
        tone(660, .1, "sine", .035);
        setTimeout(() => tone(880, .12, "sine", .03), 80);
      }

      function addScore(points) {
        score += points;
        if (score > highScore) {
          highScore = score;
          saveHighScore();
        }
        updateHud();
      }

      function updateHud() {
        scoreEl.textContent = String(score).padStart(6, "0");
        highScoreEl.textContent = String(highScore).padStart(6, "0");
        levelEl.textContent = String(level).padStart(2, "0");
        livesEl.textContent = Array.from({ length: Math.max(0, lives) }, () => "●").join(" ");
        statusEl.firstChild.textContent =
          state === "playing" ? "Playing" :
          state === "paused" ? "Paused" :
          state === "over" ? "Game over" : "Ready";
        pauseBtn.textContent = state === "paused" ? "Resume" : "Pause";
      }

      function setDirection(direction) {
        if (!DIRS[direction]) return;
        ensureAudio();
        player.desired = direction;
        if (state === "ready" && performance.now() >= readyUntil) state = "playing";
        if (state === "over") newGame();
      }

      function getNextCell(entity, direction) {
        const d = DIRS[direction];
        return { c: normalizeColumn(entity.c + d.x), r: entity.r + d.y };
      }

      function beginStep(entity, direction, isGhost = false) {
        const next = getNextCell(entity, direction);
        if (!canEnter(next.c, next.r, isGhost)) return false;
        entity.dir = direction;
        entity.fromC = entity.c;
        entity.fromR = entity.r;
        entity.toC = next.c;
        entity.toR = next.r;
        entity.progress = 0;
        return true;
      }

      function entityPosition(entity) {
        let fromC = entity.fromC;
        let toC = entity.toC;
        if (Math.abs(toC - fromC) > 1) {
          if (fromC === 0) fromC = COLS;
          if (toC === 0) toC = COLS;
        }
        let c = fromC + (toC - fromC) * entity.progress;
        if (c < 0) c += COLS;
        if (c >= COLS) c -= COLS;
        return {
          x: (c + .5) * TILE,
          y: (entity.fromR + (entity.toR - entity.fromR) * entity.progress + .5) * TILE
        };
      }

      function arrive(entity) {
        entity.c = normalizeColumn(entity.toC);
        entity.r = entity.toR;
        entity.fromC = entity.c;
        entity.fromR = entity.r;
        entity.progress = 1;
      }

      function collectPellet(now) {
        const tile = maze[player.r][player.c];
        if (tile !== "." && tile !== "o") return;
        maze[player.r][player.c] = " ";
        pellets--;
        if (tile === "o") {
          addScore(50);
          frightenedUntil = now + Math.max(3800, 7200 - level * 280);
          ghostChain = 0;
          tone(150, .2, "sawtooth", .035);
        } else {
          addScore(10);
          wakaFlip = !wakaFlip;
          tone(wakaFlip ? 250 : 195, .035, "square", .014);
        }
        if (pellets <= 0) nextLevel(now);
      }

      function updatePlayer(dt, now) {
        let remaining = dt * player.speed;
        while (remaining > 0) {
          if (player.progress >= 1) {
            collectPellet(now);
            if (!beginStep(player, player.desired) && !beginStep(player, player.dir)) return;
          }
          const step = Math.min(remaining, 1 - player.progress);
          player.progress += step;
          remaining -= step;
          if (player.progress >= 1 - 1e-8) arrive(player);
        }
      }

      function validDirections(ghost) {
        const options = DIR_NAMES.filter(direction => {
          const next = getNextCell(ghost, direction);
          return canEnter(next.c, next.r, true);
        });
        const withoutReverse = options.filter(direction => direction !== OPPOSITE[ghost.dir]);
        return withoutReverse.length ? withoutReverse : options;
      }

      function ghostTarget(ghost, index, now) {
        const scatter = Math.floor((now - levelStartedAt) / 7000) % 4 === 0;
        if (scatter) return ghost.corner;

        const ahead = DIRS[player.dir];
        if (index === 0) return { c: player.c, r: player.r };
        if (index === 1) {
          return { c: player.c + ahead.x * 4, r: player.r + ahead.y * 4 };
        }
        if (index === 2) {
          const blaze = ghosts[0];
          return {
            c: player.c + ahead.x * 2 + (player.c - blaze.c),
            r: player.r + ahead.y * 2 + (player.r - blaze.r)
          };
        }
        const distance = Math.abs(ghost.c - player.c) + Math.abs(ghost.r - player.r);
        return distance < 7 ? ghost.corner : { c: player.c, r: player.r };
      }

      function chooseGhostDirection(ghost, index, now) {
        const options = validDirections(ghost);
        if (!options.length) return ghost.dir;
        if (now < ghost.releaseAt) {
          const exits = options.filter(d => d === "up");
          return exits[0] || options[Math.floor(Math.random() * options.length)];
        }
        if (ghost.eaten) {
          return closestDirection(ghost, options, { c: ghost.spawnC, r: ghost.spawnR });
        }
        if (now < frightenedUntil) {
          return options[Math.floor(Math.random() * options.length)];
        }
        const target = ghostTarget(ghost, index, now);
        return closestDirection(ghost, options, target);
      }

      function closestDirection(entity, options, target) {
        let best = options[0];
        let bestDistance = Infinity;
        for (const direction of options) {
          const next = getNextCell(entity, direction);
          const distance = (next.c - target.c) ** 2 + (next.r - target.r) ** 2;
          if (distance < bestDistance) {
            bestDistance = distance;
            best = direction;
          }
        }
        return best;
      }

      function updateGhost(ghost, index, dt, now) {
        if (ghost.eaten && ghost.c === ghost.spawnC && ghost.r === ghost.spawnR) {
          ghost.eaten = false;
          ghost.releaseAt = now + 700;
        }
        const speed = ghost.eaten
          ? 8.2
          : now < frightenedUntil
            ? Math.max(3.4, ghost.speed * .72)
            : ghost.speed;
        let remaining = dt * speed;
        while (remaining > 0) {
          if (ghost.progress >= 1) {
            const direction = chooseGhostDirection(ghost, index, now);
            if (!beginStep(ghost, direction, true)) return;
          }
          const step = Math.min(remaining, 1 - ghost.progress);
          ghost.progress += step;
          remaining -= step;
          if (ghost.progress >= 1 - 1e-8) arrive(ghost);
        }
      }

      function checkCollisions(now) {
        const p = entityPosition(player);
        for (const ghost of ghosts) {
          if (ghost.eaten) continue;
          const g = entityPosition(ghost);
          let dx = Math.abs(p.x - g.x);
          dx = Math.min(dx, WIDTH - dx);
          const dy = p.y - g.y;
          if (dx * dx + dy * dy > (TILE * .62) ** 2) continue;

          if (now < frightenedUntil) {
            ghost.eaten = true;
            ghostChain++;
            const points = 100 * (2 ** ghostChain);
            addScore(points);
            flashText = points + "!";
            flashUntil = now + 650;
            tone(820 + ghostChain * 90, .12, "square", .035);
          } else {
            loseLife(now);
          }
          break;
        }
      }

      function loseLife(now) {
        lives--;
        tone(95, .55, "sawtooth", .04);
        if (lives <= 0) {
          state = "over";
          flashText = "GAME OVER";
          flashUntil = Infinity;
          saveHighScore();
        } else {
          resetActors(now, false);
        }
        updateHud();
      }

      function togglePause() {
        if (state === "over") return;
        if (state === "paused") {
          state = "playing";
          lastTime = performance.now();
        } else if (state === "playing" || state === "ready") {
          state = "paused";
        }
        updateHud();
      }

      function ensureAudio() {
        if (muted || audioContext) return;
        try {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
        } catch { muted = true; }
      }

      function tone(frequency, duration, type = "sine", volume = .02) {
        if (muted) return;
        ensureAudio();
        if (!audioContext) return;
        if (audioContext.state === "suspended") audioContext.resume();
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        const now = audioContext.currentTime;
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, now);
        gain.gain.setValueAtTime(volume, now);
        gain.gain.exponentialRampToValueAtTime(.0001, now + duration);
        oscillator.connect(gain).connect(audioContext.destination);
        oscillator.start(now);
        oscillator.stop(now + duration);
      }

      function roundedRect(x, y, w, h, radius) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, radius);
      }

      function drawMaze(now) {
        ctx.fillStyle = "#040614";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        const glow = ctx.createRadialGradient(WIDTH / 2, HEIGHT * .46, 20, WIDTH / 2, HEIGHT * .46, WIDTH * .7);
        glow.addColorStop(0, "rgba(35, 53, 123, .12)");
        glow.addColorStop(1, "rgba(2, 3, 12, 0)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const tile = maze[r][c];
            const x = c * TILE;
            const y = r * TILE;
            if (tile === "#") {
              const inset = 2.25;
              const wallGradient = ctx.createLinearGradient(x, y, x + TILE, y + TILE);
              wallGradient.addColorStop(0, "#263dba");
              wallGradient.addColorStop(.5, "#425cff");
              wallGradient.addColorStop(1, "#15288e");
              ctx.shadowColor = "rgba(64, 91, 255, .5)";
              ctx.shadowBlur = 8;
              roundedRect(x + inset, y + inset, TILE - inset * 2, TILE - inset * 2, 7);
              ctx.fillStyle = wallGradient;
              ctx.fill();
              ctx.shadowBlur = 0;
              roundedRect(x + 5, y + 5, TILE - 10, TILE - 10, 4);
              ctx.fillStyle = "#0a1034";
              ctx.fill();
            } else if (tile === "=") {
              ctx.fillStyle = "#ff82d2";
              ctx.shadowColor = "#ff4eae";
              ctx.shadowBlur = 8;
              roundedRect(x + 2, y + TILE * .45, TILE - 4, 4, 2);
              ctx.fill();
              ctx.shadowBlur = 0;
            } else if (tile === ".") {
              ctx.fillStyle = "#ffe9bb";
              ctx.shadowColor = "rgba(255, 225, 169, .65)";
              ctx.shadowBlur = 5;
              ctx.beginPath();
              ctx.arc(x + TILE / 2, y + TILE / 2, 2.8, 0, TAU);
              ctx.fill();
              ctx.shadowBlur = 0;
            } else if (tile === "o") {
              const pulse = 6.1 + Math.sin(now / 130) * 1.5;
              ctx.fillStyle = "#fff0cb";
              ctx.shadowColor = "#ffe4a4";
              ctx.shadowBlur = 13;
              ctx.beginPath();
              ctx.arc(x + TILE / 2, y + TILE / 2, pulse, 0, TAU);
              ctx.fill();
              ctx.shadowBlur = 0;
            }
          }
        }
      }

      function drawPlayer(now) {
        const pos = entityPosition(player);
        const angle = DIRS[player.dir].angle;
        const mouth = state === "over" ? .02 : .16 + Math.abs(Math.sin(now / 72)) * .28;
        ctx.save();
        ctx.translate(pos.x, pos.y);
        ctx.rotate(angle);
        ctx.shadowColor = "rgba(255, 216, 74, .72)";
        ctx.shadowBlur = 13;
        ctx.fillStyle = "#ffd84a";
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, TILE * .39, mouth, TAU - mouth);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = "rgba(255,255,255,.38)";
        ctx.beginPath();
        ctx.arc(-2, -5, 2.5, 0, TAU);
        ctx.fill();
        ctx.restore();
      }

      function drawGhost(ghost, index, now) {
        const pos = entityPosition(ghost);
        const frightened = now < frightenedUntil && !ghost.eaten;
        const warning = frightened && frightenedUntil - now < 1800 && Math.floor(now / 160) % 2;
        const radius = TILE * .37;

        ctx.save();
        ctx.translate(pos.x, pos.y + 1);
        if (ghost.eaten) {
          drawEyes(ghost.dir, radius);
          ctx.restore();
          return;
        }

        const color = warning ? "#f2f4ff" : frightened ? "#2b5dff" : ghost.color;
        ctx.shadowColor = color;
        ctx.shadowBlur = frightened ? 7 : 11;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(0, -2, radius, Math.PI, 0);
        ctx.lineTo(radius, radius * .78);
        const wave = radius * .48;
        for (let i = 0; i < 4; i++) {
          const x = radius - wave * (i + 1);
          ctx.quadraticCurveTo(x + wave / 2, radius * (i % 2 ? .98 : .54), x, radius * .76);
        }
        ctx.lineTo(-radius, -2);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;

        if (frightened) {
          ctx.fillStyle = warning ? "#2552cc" : "#eef3ff";
          ctx.beginPath();
          ctx.arc(-5, -2, 1.8, 0, TAU);
          ctx.arc(5, -2, 1.8, 0, TAU);
          ctx.fill();
          ctx.strokeStyle = warning ? "#2552cc" : "#eef3ff";
          ctx.lineWidth = 1.7;
          ctx.beginPath();
          ctx.moveTo(-7, 7);
          ctx.lineTo(-3.5, 4);
          ctx.lineTo(0, 7);
          ctx.lineTo(3.5, 4);
          ctx.lineTo(7, 7);
          ctx.stroke();
        } else {
          drawEyes(ghost.dir, radius);
        }
        ctx.restore();
      }

      function drawEyes(direction, radius) {
        const d = DIRS[direction];
        for (const side of [-1, 1]) {
          ctx.fillStyle = "#f8fbff";
          ctx.beginPath();
          ctx.ellipse(side * radius * .38, -radius * .12, radius * .26, radius * .34, 0, 0, TAU);
          ctx.fill();
          ctx.fillStyle = "#172666";
          ctx.beginPath();
          ctx.arc(side * radius * .38 + d.x * 2.4, -radius * .12 + d.y * 2.4, radius * .12, 0, TAU);
          ctx.fill();
        }
      }

      function drawOverlay(now) {
        if (state === "paused" || state === "over" || now < flashUntil) {
          const label = state === "paused" ? "PAUSED" : flashText;
          const sub = state === "over" ? "PRESS ANY DIRECTION TO RESTART" :
            state === "paused" ? "PRESS SPACE TO RESUME" : "";
          ctx.save();
          ctx.fillStyle = state === "paused" || state === "over" ? "rgba(3, 5, 16, .68)" : "rgba(3, 5, 16, .22)";
          ctx.fillRect(0, 0, WIDTH, HEIGHT);
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.font = "900 27px system-ui, sans-serif";
          ctx.fillStyle = state === "over" ? "#ff5b8d" : "#ffd84a";
          ctx.shadowColor = ctx.fillStyle;
          ctx.shadowBlur = 16;
          ctx.fillText(label, WIDTH / 2, HEIGHT * .55);
          ctx.shadowBlur = 0;
          if (sub) {
            ctx.font = "700 9px system-ui, sans-serif";
            ctx.letterSpacing = "2px";
            ctx.fillStyle = "#a7b0d2";
            ctx.fillText(sub, WIDTH / 2, HEIGHT * .55 + 34);
          }
          ctx.restore();
        }
      }

      function render(now) {
        drawMaze(now);
        drawPlayer(now);
        ghosts.forEach((ghost, index) => drawGhost(ghost, index, now));
        drawOverlay(now);
      }

      function tick(now) {
        const dt = Math.min(.05, Math.max(0, (now - lastTime) / 1000));
        lastTime = now;

        if (state === "ready" && now >= readyUntil) {
          state = "playing";
          levelStartedAt = now;
          updateHud();
        }

        if (state === "playing") {
          updatePlayer(dt, now);
          ghosts.forEach((ghost, index) => updateGhost(ghost, index, dt, now));
          checkCollisions(now);
        }

        render(now);
        animationId = requestAnimationFrame(tick);
      }

      const keyDirections = {
        ArrowLeft: "left", a: "left", A: "left",
        ArrowRight: "right", d: "right", D: "right",
        ArrowUp: "up", w: "up", W: "up",
        ArrowDown: "down", s: "down", S: "down"
      };

      window.addEventListener("keydown", event => {
        const direction = keyDirections[event.key];
        if (direction) {
          event.preventDefault();
          setDirection(direction);
          return;
        }
        if (event.code === "Space") {
          event.preventDefault();
          togglePause();
        } else if (event.key === "r" || event.key === "R") {
          event.preventDefault();
          newGame();
        }
      });

      document.querySelectorAll(".pad-btn").forEach(button => {
        button.addEventListener("pointerdown", event => {
          event.preventDefault();
          setDirection(button.dataset.dir);
        });
      });

      let touchStart = null;
      canvas.addEventListener("pointerdown", event => {
        if (event.pointerType === "touch") touchStart = { x: event.clientX, y: event.clientY };
        ensureAudio();
      });
      canvas.addEventListener("pointerup", event => {
        if (!touchStart || event.pointerType !== "touch") return;
        const dx = event.clientX - touchStart.x;
        const dy = event.clientY - touchStart.y;
        touchStart = null;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
        setDirection(Math.abs(dx) > Math.abs(dy)
          ? (dx > 0 ? "right" : "left")
          : (dy > 0 ? "down" : "up"));
      });

      pauseBtn.addEventListener("click", togglePause);
      restartBtn.addEventListener("click", newGame);
      soundBtn.addEventListener("click", () => {
        muted = !muted;
        soundBtn.textContent = muted ? "×" : "♪";
        soundBtn.setAttribute("aria-label", muted ? "Unmute sound" : "Mute sound");
        soundBtn.title = muted ? "Unmute sound" : "Mute sound";
        if (!muted) tone(540, .08, "sine", .025);
      });

      document.addEventListener("visibilitychange", () => {
        if (document.hidden && state === "playing") togglePause();
      });

      window.addEventListener("beforeunload", saveHighScore);

      resetMaze();
      resetActors(performance.now(), true);
      highScoreEl.textContent = String(highScore).padStart(6, "0");
      animationId = requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
